<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="950" viewBox="0 0 1080 950" role="img" aria-labelledby="title desc"><title id="title">Top-k与字符预算的对照设计</title><desc id="desc">作者原创机制示意，非性能数据。相同原文版本与证据范围映射到不同切块后，再检查最终上下文的完整覆盖和预算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8B9CAB"/></marker></defs><rect width="1080" height="950" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif"><text x="540" y="64" font-size="42" fill="#2387DE" text-anchor="middle">Top-k 相同，预算未必相同</text><text x="540" y="112" font-size="27" fill="#79838D" text-anchor="middle">把候选召回与实际送入上下文分开记录</text><rect x="60" y="150" width="960" height="165" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="90" y="199" font-size="33" fill="#165DA2" text-anchor="start">固定输入</text><text x="450" y="193" font-size="27" fill="#576574" text-anchor="start">同一知识快照与问题集</text><text x="450" y="236" font-size="27" fill="#576574" text-anchor="start">同一词法排序与并列规则</text><text x="450" y="279" font-size="27" fill="#576574" text-anchor="start">只改变切块方式</text><path d="M540 324v26" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="363" width="960" height="165" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="90" y="412" font-size="33" fill="#146E73" text-anchor="start">分别选择上下文</text><text x="450" y="406" font-size="27" fill="#576574" text-anchor="start">Top-k：限制片段数量</text><text x="450" y="449" font-size="27" fill="#576574" text-anchor="start">字符预算：限制输入体积</text><text x="450" y="492" font-size="27" fill="#576574" text-anchor="start">超预算整块跳过，不截半句</text><path d="M540 537v26" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="576" width="960" height="165" rx="16" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="90" y="625" font-size="33" fill="#AC3345" text-anchor="start">逐题定位损失</text><text x="450" y="619" font-size="27" fill="#576574" text-anchor="start">证据没进候选？</text><text x="450" y="662" font-size="27" fill="#576574" text-anchor="start">进候选却没进上下文？</text><text x="450" y="705" font-size="27" fill="#576574" text-anchor="start">重叠文字占用了多少预算？</text><rect x="60" y="803" width="960" height="115" rx="16" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="540" y="850" font-size="28" fill="#986319" text-anchor="middle">大块、重叠、段落各有代价：先看逐题损失，再决定改什么</text><text x="540" y="895" font-size="27" fill="#986319" text-anchor="middle">字符不是 token；这些教学结果不能决定生产系统的最优策略</text></g></svg>
