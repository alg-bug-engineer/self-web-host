<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" role="img" aria-labelledby="title desc"><title id="title">切块与稳定证据映射</title><desc id="desc">作者原创机制示意，非性能数据。相同原文版本与证据范围映射到不同切块后，再检查最终上下文的完整覆盖和预算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8B9CAB"/></marker></defs><rect width="1080" height="800" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif"><text x="540" y="64" font-size="42" fill="#2387DE" text-anchor="middle">切块变了，证据的尺子不变</text><text x="540" y="112" font-size="27" fill="#79838D" text-anchor="middle">原文坐标 → 切块映射 → 最终上下文</text><rect x="60" y="154" width="960" height="174" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="90" y="201" font-size="32" fill="#165DA2" text-anchor="start">固定原文：doc / version · 证据区间 [40, 90)</text><text x="90" y="250" font-size="29" fill="#576574" text-anchor="start">主语、条件、结论一起标注；字符规范与版本一并冻结</text><text x="90" y="294" font-size="28" fill="#576574" text-anchor="start">标注跟着原文走，不跟着某次生成的 chunk ID 走</text><path d="M310 338v42" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><path d="M780 338v42" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="398" width="454" height="208" rx="16" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="84" y="444" font-size="31" fill="#AC3345" text-anchor="start">只找到 [0, 64)</text><text x="84" y="492" font-size="29" fill="#576574" text-anchor="start">相交 ≠ 完整命中</text><text x="84" y="537" font-size="27" fill="#576574" text-anchor="start">关键词在，后半段条件不在</text><text x="84" y="580" font-size="27" fill="#576574" text-anchor="start">缺失：[64, 90)</text><rect x="550" y="398" width="470" height="208" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="574" y="444" font-size="31" fill="#146E73" text-anchor="start">再找到 [64, 128)</text><text x="574" y="492" font-size="29" fill="#576574" text-anchor="start">按同文档、同版本求并集</text><text x="574" y="537" font-size="28" fill="#576574" text-anchor="start">完整覆盖 [40, 90)</text><text x="574" y="580" font-size="27" fill="#576574" text-anchor="start">同一条证据只计一次</text><rect x="60" y="650" width="960" height="114" rx="16" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="540" y="697" font-size="29" fill="#986319" text-anchor="middle">先查完整覆盖，再算召回；重叠不加分，旧版不代替新版</text><text x="540" y="741" font-size="27" fill="#986319" text-anchor="middle">区间覆盖检查能稳定复现，但不能替代语义审核</text></g></svg>
