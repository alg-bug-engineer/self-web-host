<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1100" viewBox="0 0 540 1100" role="img" aria-labelledby="title desc"><title id="title">切块与稳定证据映射</title><desc id="desc">作者原创机制示意，非性能数据。相同原文版本与证据范围映射到不同切块后，再检查最终上下文的完整覆盖和预算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8B9CAB"/></marker></defs><rect width="540" height="1100" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif"><text x="270" y="64" font-size="32" fill="#2387DE" text-anchor="middle">切块变了，证据的尺子不变</text><text x="270" y="112" font-size="27" fill="#79838D" text-anchor="middle">原文坐标 → 切块映射 → 最终上下文</text><rect x="32" y="148" width="476" height="204" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="56" y="192" font-size="29" fill="#165DA2" text-anchor="start">固定原文：doc / version</text><text x="56" y="236" font-size="29" fill="#576574" text-anchor="start">证据区间：[40, 90)</text><text x="56" y="280" font-size="28" fill="#576574" text-anchor="start">包含主语、条件和结论</text><text x="56" y="322" font-size="27" fill="#576574" text-anchor="start">换行与字符规范一并冻结</text><path d="M270 360v42" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="418" width="476" height="196" rx="16" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="56" y="461" font-size="30" fill="#AC3345" text-anchor="start">只找到 [0, 64)</text><text x="56" y="506" font-size="27" fill="#576574" text-anchor="start">与证据相交，但后半段缺失</text><text x="56" y="550" font-size="28" fill="#576574" text-anchor="start">出现关键词 ≠ 完整命中</text><text x="56" y="592" font-size="27" fill="#576574" text-anchor="start">缺失：[64, 90)</text><path d="M270 622v42" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="680" width="476" height="200" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="56" y="724" font-size="30" fill="#146E73" text-anchor="start">再找到 [64, 128)</text><text x="56" y="771" font-size="27" fill="#576574" text-anchor="start">同一文档、同一版本合并范围</text><text x="56" y="816" font-size="28" fill="#576574" text-anchor="start">并集完整覆盖 [40, 90)</text><text x="56" y="857" font-size="27" fill="#576574" text-anchor="start">这条证据只计一次</text><rect x="32" y="924" width="476" height="145" rx="16" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="270" y="968" font-size="29" fill="#986319" text-anchor="middle">先查完整覆盖，再算召回</text><text x="270" y="1010" font-size="27" fill="#986319" text-anchor="middle">重叠不加分，旧版不代替新版</text><text x="270" y="1049" font-size="27" fill="#986319" text-anchor="middle">区间覆盖仍不等于语义正确</text></g></svg>
