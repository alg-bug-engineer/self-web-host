<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1148" viewBox="0 0 540 1148" role="img" aria-labelledby="title desc"><title id="title">Top-k与字符预算的对照设计</title><desc id="desc">作者原创机制示意，非性能数据。相同原文版本与证据范围映射到不同切块后，再检查最终上下文的完整覆盖和预算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8B9CAB"/></marker></defs><rect width="540" height="1148" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif"><text x="270" y="64" font-size="32" fill="#2387DE" text-anchor="middle">Top-k 相同，预算未必相同</text><text x="270" y="112" font-size="27" fill="#79838D" text-anchor="middle">把候选召回与实际送入上下文分开记录</text><rect x="32" y="150" width="476" height="216" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="56" y="195" font-size="32" fill="#165DA2" text-anchor="start">固定输入</text><text x="56" y="241" font-size="27" fill="#576574" text-anchor="start">同一知识快照与问题集</text><text x="56" y="285" font-size="27" fill="#576574" text-anchor="start">同一词法排序与并列规则</text><text x="56" y="329" font-size="27" fill="#576574" text-anchor="start">只改变切块方式</text><path d="M270 374v29" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="415" width="476" height="216" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="56" y="460" font-size="32" fill="#146E73" text-anchor="start">分别选择上下文</text><text x="56" y="506" font-size="27" fill="#576574" text-anchor="start">Top-k：限制片段数量</text><text x="56" y="550" font-size="27" fill="#576574" text-anchor="start">字符预算：限制输入体积</text><text x="56" y="594" font-size="27" fill="#576574" text-anchor="start">超预算整块跳过，不截半句</text><path d="M270 639v29" fill="none" stroke="#8B9CAB" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="680" width="476" height="216" rx="16" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="56" y="725" font-size="32" fill="#AC3345" text-anchor="start">逐题定位损失</text><text x="56" y="771" font-size="27" fill="#576574" text-anchor="start">证据没进候选？</text><text x="56" y="815" font-size="27" fill="#576574" text-anchor="start">进候选却没进上下文？</text><text x="56" y="859" font-size="27" fill="#576574" text-anchor="start">重叠文字占用了多少预算？</text><rect x="32" y="966" width="476" height="150" rx="16" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="270" y="1013" font-size="29" fill="#986319" text-anchor="middle">大块、重叠、段落各有代价</text><text x="270" y="1058" font-size="27" fill="#986319" text-anchor="middle">字符不是 token，分数不是答案</text><text x="270" y="1096" font-size="27" fill="#986319" text-anchor="middle">不要从教学样例选生产冠军</text></g></svg>
