<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" role="img" aria-labelledby="title desc"><title id="title">租约收回写账权，不撤回请求</title><desc id="desc">合成事件 A1；两个独立本地 SQLite 文件</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="38" fill="#1d4ed8" font-weight="700">租约收回写账权，不撤回请求</text><text x="32" y="108" font-size="28" fill="#64748b" font-weight="400">合成事件 A1；两个独立本地 SQLite 文件</text><rect x="32" y="150" width="490" height="220" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="196" font-size="32" fill="#1d4ed8" font-weight="700">旧 worker：generation = 1</text><text x="54" y="244" font-size="30" fill="#1e3a5f" font-weight="400">时刻 0 领取，时刻 5 到期</text><text x="54" y="289" font-size="30" fill="#1e3a5f" font-weight="400">请求仍可到达接收端</text><text x="54" y="334" font-size="30" fill="#1e3a5f" font-weight="400">旧回调不能覆盖新状态</text><rect x="558" y="150" width="490" height="220" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="580" y="196" font-size="32" fill="#166534" font-weight="700">新 worker：generation = 2</text><text x="580" y="244" font-size="30" fill="#1e3a5f" font-weight="400">时刻 5 接管同一事件</text><text x="580" y="289" font-size="30" fill="#1e3a5f" font-weight="400">使用原 ID 与原正文重发</text><text x="580" y="334" font-size="30" fill="#1e3a5f" font-weight="400">有效回调才能写 acked</text><path d="M278 375 L278 418" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M803 375 L803 418" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="440" width="490" height="215" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="486" font-size="32" fill="#1d4ed8" font-weight="700">接收端：持久去重</text><text x="54" y="534" font-size="30" fill="#1e3a5f" font-weight="400">旧请求先到：应用一次</text><text x="54" y="579" font-size="30" fill="#1e3a5f" font-weight="400">新请求再到：duplicate</text><text x="54" y="624" font-size="30" fill="#1e3a5f" font-weight="400">receipt 与本地效果同事务</text><rect x="558" y="440" width="490" height="215" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="580" y="486" font-size="32" fill="#9f1239" font-weight="700">发送端：代次与到期校验</text><text x="580" y="534" font-size="30" fill="#1e3a5f" font-weight="400">旧回调：stale</text><text x="580" y="579" font-size="30" fill="#1e3a5f" font-weight="400">尚未接管但已过期：expired</text><text x="580" y="624" font-size="30" fill="#1e3a5f" font-weight="400">不把租约当作请求取消</text><rect x="32" y="705" width="1016" height="135" rx="18" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="54" y="751" font-size="32" fill="#713f12" font-weight="700">两道边界，缺一不可</text><text x="54" y="799" font-size="30" fill="#713f12" font-weight="400">代次防旧回写；接收端幂等防重复本地效果</text></g></svg>