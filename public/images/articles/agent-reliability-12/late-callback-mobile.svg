<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1390" viewBox="0 0 540 1390" role="img" aria-labelledby="title desc"><title id="title">租约不撤回已发出的请求</title><desc id="desc">同 ID、同正文，允许重复送达</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="34" fill="#1d4ed8" font-weight="700">租约不撤回已发出的请求</text><text x="32" y="108" font-size="30" fill="#64748b" font-weight="400">同 ID、同正文，允许重复送达</text><rect x="32" y="150" width="476" height="210" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="196" font-size="32" fill="#1d4ed8" font-weight="700">旧 worker：代次 1</text><text x="54" y="244" font-size="30" fill="#1e3a5f" font-weight="400">时刻 0 领取</text><text x="54" y="289" font-size="30" fill="#1e3a5f" font-weight="400">时刻 5 租约到期</text><text x="54" y="334" font-size="30" fill="#1e3a5f" font-weight="400">请求仍可能随后到达</text><path d="M270 365 L270 405" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="420" width="476" height="170" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="54" y="466" font-size="32" fill="#166534" font-weight="700">新 worker：代次 2</text><text x="54" y="514" font-size="30" fill="#1e3a5f" font-weight="400">时刻 5 接管原事件</text><text x="54" y="559" font-size="30" fill="#1e3a5f" font-weight="400">仍使用原 ID 与正文</text><path d="M270 595 L270 635" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="650" width="476" height="220" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="696" font-size="32" fill="#1d4ed8" font-weight="700">接收端：只应用一次</text><text x="54" y="744" font-size="30" fill="#1e3a5f" font-weight="400">旧请求先到：accepted</text><text x="54" y="789" font-size="30" fill="#1e3a5f" font-weight="400">新请求再到：duplicate</text><text x="54" y="834" font-size="30" fill="#1e3a5f" font-weight="400">本地效果与回执同事务</text><rect x="32" y="910" width="476" height="220" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="54" y="956" font-size="32" fill="#9f1239" font-weight="700">发送端：挡住旧回调</text><text x="54" y="1004" font-size="30" fill="#1e3a5f" font-weight="400">代次不匹配：stale</text><text x="54" y="1049" font-size="30" fill="#1e3a5f" font-weight="400">已到期未接管：expired</text><text x="54" y="1094" font-size="30" fill="#1e3a5f" font-weight="400">新有效回调写 acked</text><rect x="32" y="1175" width="476" height="175" rx="18" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="54" y="1221" font-size="32" fill="#713f12" font-weight="700">两道边界，各管一件事</text><text x="54" y="1269" font-size="30" fill="#713f12" font-weight="400">代次防旧回调覆盖状态</text><text x="54" y="1314" font-size="30" fill="#713f12" font-weight="400">幂等防重复本地效果</text></g></svg>