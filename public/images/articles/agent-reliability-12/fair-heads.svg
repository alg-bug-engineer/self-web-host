<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc"><title id="title">坏消息停下，其他流程继续</title><desc id="desc">按流程头部选择；领取时就更新轮转票号</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="38" fill="#1d4ed8" font-weight="700">坏消息停下，其他流程继续</text><text x="32" y="108" font-size="28" fill="#64748b" font-weight="400">按流程头部选择；领取时就更新轮转票号</text><rect x="32" y="150" width="320" height="245" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="54" y="196" font-size="32" fill="#9f1239" font-weight="700">流程 A</text><text x="54" y="244" font-size="30" fill="#1e3a5f" font-weight="400">A1：隔离待处置</text><text x="54" y="289" font-size="30" fill="#1e3a5f" font-weight="400">A2：仍等待 A1</text><text x="54" y="334" font-size="30" fill="#1e3a5f" font-weight="400">不删除，不跳过</text><rect x="380" y="150" width="320" height="245" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="402" y="196" font-size="32" fill="#166534" font-weight="700">流程 B</text><text x="402" y="244" font-size="30" fill="#1e3a5f" font-weight="400">B1：获得机会</text><text x="402" y="289" font-size="30" fill="#1e3a5f" font-weight="400">领取后 served = 7</text><text x="402" y="334" font-size="30" fill="#1e3a5f" font-weight="400">下一次排到后面</text><rect x="728" y="150" width="320" height="245" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="750" y="196" font-size="32" fill="#1d4ed8" font-weight="700">流程 C</text><text x="750" y="244" font-size="30" fill="#1e3a5f" font-weight="400">C1：下一个候选</text><text x="750" y="289" font-size="30" fill="#1e3a5f" font-weight="400">符合条件才入选</text><text x="750" y="334" font-size="30" fill="#1e3a5f" font-weight="400">不陪 A 反复重试</text><path d="M700 272 L726 272" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="440" width="1016" height="200" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="486" font-size="32" fill="#1d4ed8" font-weight="700">同一领取事务</text><text x="54" y="534" font-size="30" fill="#1e3a5f" font-weight="400">选可用头部 → 增加全局票号 → 更新 served</text><text x="54" y="579" font-size="30" fill="#1e3a5f" font-weight="400">同时写入 inflight、代次、尝试数和租约</text><rect x="32" y="685" width="1016" height="130" rx="18" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="54" y="731" font-size="32" fill="#713f12" font-weight="700">保证机会轮转，不保证完成时限</text><text x="54" y="779" font-size="30" fill="#713f12" font-weight="400">适用于有限且持续可派发的流程；新流量可改变顺序</text></g></svg>