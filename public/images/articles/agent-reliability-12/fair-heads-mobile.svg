<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1420" viewBox="0 0 540 1420" role="img" aria-labelledby="title desc"><title id="title">坏消息停下，其他流程继续</title><desc id="desc">领取机会，不等于业务完成</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="34" fill="#1d4ed8" font-weight="700">坏消息停下，其他流程继续</text><text x="32" y="108" font-size="30" fill="#64748b" font-weight="400">领取机会，不等于业务完成</text><rect x="32" y="150" width="476" height="230" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="54" y="196" font-size="32" fill="#9f1239" font-weight="700">流程 A：停在 A1</text><text x="54" y="244" font-size="30" fill="#1e3a5f" font-weight="400">A1：隔离待处置</text><text x="54" y="289" font-size="30" fill="#1e3a5f" font-weight="400">A2：仍等待 A1</text><text x="54" y="334" font-size="30" fill="#1e3a5f" font-weight="400">不删除，不跳过</text><rect x="32" y="415" width="476" height="210" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="54" y="461" font-size="32" fill="#166534" font-weight="700">流程 B：继续</text><text x="54" y="509" font-size="30" fill="#1e3a5f" font-weight="400">B1 获得一次机会</text><text x="54" y="554" font-size="30" fill="#1e3a5f" font-weight="400">领取后更新 served</text><text x="54" y="599" font-size="30" fill="#1e3a5f" font-weight="400">下一轮排到后面</text><path d="M270 630 L270 670" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="685" width="476" height="170" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="731" font-size="32" fill="#1d4ed8" font-weight="700">流程 C：下一个候选</text><text x="54" y="779" font-size="30" fill="#1e3a5f" font-weight="400">头部可用才能领取</text><text x="54" y="824" font-size="30" fill="#1e3a5f" font-weight="400">不陪 A 反复重试</text><rect x="32" y="900" width="476" height="270" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="946" font-size="32" fill="#1d4ed8" font-weight="700">一笔事务，一次机会</text><text x="54" y="994" font-size="30" fill="#1e3a5f" font-weight="400">先选可用的流程头部</text><text x="54" y="1039" font-size="30" fill="#1e3a5f" font-weight="400">增加票号，更新 served</text><text x="54" y="1084" font-size="30" fill="#1e3a5f" font-weight="400">写 inflight 与新代次</text><text x="54" y="1129" font-size="30" fill="#1e3a5f" font-weight="400">尝试数和租约一起保存</text><rect x="32" y="1215" width="476" height="170" rx="18" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="54" y="1261" font-size="32" fill="#713f12" font-weight="700">有限集合内的机会轮转</text><text x="54" y="1309" font-size="30" fill="#713f12" font-weight="400">不是耗时公平或最终必达</text><text x="54" y="1354" font-size="30" fill="#713f12" font-weight="400">持续新流量可能挤占旧流</text></g></svg>