<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1220" viewBox="0 0 540 1220" role="img" aria-labelledby="title desc"><title id="title">同意必须绑定到那一份计划</title><desc id="desc">移动版：批准三个与执行四个的对照</desc><rect width="540" height="1220" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="28" y="58" font-size="32" font-weight="700" fill="#1d4ed8">同意，绑定到那一份计划</text>
<text x="28" y="103" font-size="30" font-weight="400" fill="#475569">合成实验 · 批准 3 个名额</text>
<rect x="28" y="140" width="484" height="218" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="52" y="184" font-size="30" font-weight="700" fill="#1d4ed8">确认对象</text>
<text x="52" y="228" font-size="30" font-weight="400" fill="#475569">job-1 / A → B / 数量 3</text>
<text x="52" y="268" font-size="30" font-weight="400" fill="#475569">预期版本 A=1、B=1</text>
<text x="52" y="308" font-size="30" font-weight="400" fill="#475569">审批绑定操作 ID + 计划摘要</text>
<path d="M270 364 v36 m-8 -8 l8 8 8 -8" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="28" y="420" width="484" height="235" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<text x="52" y="464" font-size="30" font-weight="700" fill="#be123c">错误：approved=true</text>
<text x="52" y="508" font-size="30" font-weight="400" fill="#475569">计划数量后来改成 4</text>
<text x="52" y="548" font-size="30" font-weight="400" fill="#475569">执行器不核对确认对象</text>
<text x="52" y="588" font-size="30" font-weight="400" fill="#475569">实跑：A=6，B=4；效果 1 条</text>
<rect x="28" y="690" width="484" height="235" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="52" y="734" font-size="30" font-weight="700" fill="#047857">正确：绑定完整计划</text>
<text x="52" y="778" font-size="30" font-weight="400" fill="#475569">计划数量后来改成 4</text>
<text x="52" y="818" font-size="30" font-weight="400" fill="#475569">返回 approval_mismatch</text>
<text x="52" y="858" font-size="30" font-weight="400" fill="#475569">实跑：A=10，B=0；无效果</text>
<rect x="28" y="965" width="484" height="200" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="52" y="1009" font-size="30" font-weight="700" fill="#92400e">改计划，需要新的确认</text>
<text x="52" y="1053" font-size="30" font-weight="400" fill="#475569">换新操作 ID 不能刷新旧审批</text>
<text x="52" y="1093" font-size="30" font-weight="400" fill="#475569">摘要一致，不等于身份可信</text>
</g></svg>