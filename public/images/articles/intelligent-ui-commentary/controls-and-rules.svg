<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="980" viewBox="0 0 1080 980" role="img" aria-labelledby="title desc"><title id="title">可改数字与可改规则的区别</title><desc id="desc">合成账单示意：四人均摊360元为每人90元；餐费240元四人分、饮料120元三人分，则三人各100元、一人60元。两种分法总额相等，分摊规则需由参与者约定。</desc><rect width="1080" height="980" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="70" font-size="46" fill="#1554a3" font-weight="700">能改数字，也要能改规则</text><text x="48" y="119" font-size="29" fill="#526579" font-weight="400">同一张合成账单，两种约定；不是产品截图</text><rect x="48" y="157" width="984" height="124" rx="20" fill="#edf5ff" stroke="#b8d2ef" stroke-width="2"/><text x="76" y="204" font-size="34" fill="#1554a3" font-weight="700">账单：餐费 240 元 + 饮料 120 元 = 360 元</text><text x="76" y="252" font-size="30" fill="#21364c" font-weight="400">四人用餐，其中一人不喝饮料</text><rect x="48" y="325" width="450" height="347" rx="20" fill="#edf5ff" stroke="#b8d2ef" stroke-width="2"/><text x="76" y="379" font-size="35" fill="#1554a3" font-weight="700">方案 A｜全员均摊</text><text x="76" y="439" font-size="29" fill="#526579" font-weight="400">控制台上的变量</text><text x="76" y="488" font-size="32" fill="#21364c" font-weight="400">总额 360　人数 4</text><text x="76" y="564" font-size="45" fill="#1554a3" font-weight="700">每人 90 元</text><text x="76" y="627" font-size="29" fill="#21364c" font-weight="400">适用：大家同意均摊</text><rect x="530" y="325" width="502" height="347" rx="20" fill="#e9f8f4" stroke="#a9d9ce" stroke-width="2"/><text x="558" y="379" font-size="35" fill="#116855" font-weight="700">方案 B｜分开算饮料</text><text x="558" y="439" font-size="29" fill="#526579" font-weight="400">增加可修改的分摊范围</text><text x="558" y="488" font-size="29" fill="#21364c" font-weight="400">餐费每人 60；饮料每人 40</text><text x="558" y="550" font-size="40" fill="#116855" font-weight="700">三人各 100 元</text><text x="558" y="601" font-size="40" fill="#116855" font-weight="700">一人 60 元</text><text x="558" y="647" font-size="29" fill="#21364c" font-weight="400">适用：饮料只由三人分</text><rect x="48" y="709" width="984" height="118" rx="20" fill="#fff0ef" stroke="#e5b6b0" stroke-width="2"/><text x="76" y="756" font-size="31" fill="#8e3830" font-weight="700">合计都为 360 元，仍需核对分配是否符合约定</text><text x="76" y="800" font-size="29" fill="#21364c" font-weight="400">算术正确，只能回答一部分问题</text><rect x="48" y="865" width="984" height="74" rx="20" fill="#fff4bf" stroke="#e2ce78" stroke-width="2"/><text x="76" y="913" font-size="32" fill="#655017" font-weight="700">好界面让人看见假设，也留出改变假设的入口</text></g></svg>