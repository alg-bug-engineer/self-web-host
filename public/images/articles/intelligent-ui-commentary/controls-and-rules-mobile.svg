<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1500" viewBox="0 0 540 1500" role="img" aria-labelledby="title desc"><title id="title">改变数字之外也需要改变规则</title><desc id="desc">合成账单示意：四人均摊360元为每人90元；餐费240元四人分、饮料120元三人分，则三人各100元、一人60元。两种分法总额相等，分摊规则需由参与者约定。</desc><rect width="540" height="1500" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="62" font-size="40" fill="#1554a3" font-weight="700">能改数字，</text><text x="28" y="114" font-size="40" fill="#1554a3" font-weight="700">也要能改规则</text><text x="28" y="161" font-size="30" fill="#526579" font-weight="400">原创合成账单示意</text><text x="28" y="203" font-size="30" fill="#526579" font-weight="400">不是产品截图或实测</text><rect x="24" y="235" width="492" height="207" rx="20" fill="#edf5ff" stroke="#b8d2ef" stroke-width="2"/><text x="48" y="282" font-size="35" fill="#1554a3" font-weight="700">总额：360 元</text><text x="48" y="328" font-size="32" fill="#21364c" font-weight="400">餐费 240 + 饮料 120</text><text x="48" y="375" font-size="32" fill="#21364c" font-weight="400">四人用餐</text><text x="48" y="418" font-size="32" fill="#21364c" font-weight="400">其中一人不喝饮料</text><rect x="24" y="473" width="492" height="249" rx="20" fill="#edf5ff" stroke="#b8d2ef" stroke-width="2"/><text x="48" y="521" font-size="35" fill="#1554a3" font-weight="700">A｜大家同意均摊</text><text x="48" y="572" font-size="32" fill="#526579" font-weight="400">输入总额与人数</text><text x="48" y="632" font-size="43" fill="#1554a3" font-weight="700">每人 90 元</text><text x="48" y="689" font-size="32" fill="#21364c" font-weight="400">只改数字，沿用均摊</text><rect x="24" y="752" width="492" height="341" rx="20" fill="#e9f8f4" stroke="#a9d9ce" stroke-width="2"/><text x="48" y="803" font-size="35" fill="#116855" font-weight="700">B｜约定饮料分开算</text><text x="48" y="853" font-size="32" fill="#21364c" font-weight="400">餐费：四人各 60 元</text><text x="48" y="902" font-size="32" fill="#21364c" font-weight="400">饮料：三人各 40 元</text><text x="48" y="965" font-size="42" fill="#116855" font-weight="700">三人各 100 元</text><text x="48" y="1018" font-size="42" fill="#116855" font-weight="700">一人 60 元</text><text x="48" y="1065" font-size="32" fill="#21364c" font-weight="400">改变了分摊范围</text><rect x="24" y="1123" width="492" height="170" rx="20" fill="#fff0ef" stroke="#e5b6b0" stroke-width="2"/><text x="48" y="1175" font-size="34" fill="#8e3830" font-weight="700">合计都为 360 元</text><text x="48" y="1221" font-size="32" fill="#21364c" font-weight="400">仍需核对分配结果</text><text x="48" y="1267" font-size="32" fill="#21364c" font-weight="400">是否符合大家的约定</text><rect x="24" y="1323" width="492" height="136" rx="20" fill="#fff4bf" stroke="#e2ce78" stroke-width="2"/><text x="48" y="1377" font-size="36" fill="#655017" font-weight="700">让假设看得见</text><text x="48" y="1427" font-size="36" fill="#655017" font-weight="700">也让假设改得动</text></g></svg>