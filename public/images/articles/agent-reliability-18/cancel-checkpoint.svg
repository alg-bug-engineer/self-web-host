<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">取消请求不等于安全停靠</title><desc id="desc">取消阻止新的预留，已预留项仍可完成。unknown 阻止确认。没有未结预留才确认停靠，保留业务结果。</desc>
<rect width="1200" height="1100" fill="#fff"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif">
<text x="44" y="66" font-size="44" fill="#1d4ed8" font-weight="700">取消请求不等于安全停靠</text>
<text x="44" y="119" font-size="30" fill="#64748b">顺序执行协议：取消控制与业务结果分开保存</text>
<rect x="44" y="160" width="1112" height="140" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="72" y="205" font-size="32" fill="#1d4ed8" font-weight="700">① 持久接收取消请求</text>
<text x="72" y="251" font-size="28" fill="#334155">相同 job ID + 有序步骤清单：绑定同一个任务；先取消也留下墓碑</text>
<text x="582" y="345" font-size="38" fill="#64748b">↓</text>
<rect x="44" y="380" width="530" height="240" rx="20" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
<text x="72" y="430" font-size="32" fill="#b91c1c" font-weight="700">② 取消后：挡住新的预留</text>
<text x="72" y="480" font-size="28" fill="#334155">control = requested</text>
<text x="72" y="530" font-size="28" fill="#334155">尚未预留的下一项不能领取</text>
<text x="72" y="580" font-size="28" fill="#334155">已有预留仍可能发出或完成</text>
<rect x="626" y="380" width="530" height="240" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
<text x="654" y="430" font-size="32" fill="#0f766e" font-weight="700">③ 核验已有在途项</text>
<text x="654" y="480" font-size="28" fill="#334155">inflight / unknown：仍未结</text>
<text x="654" y="530" font-size="28" fill="#334155">可信合成回执 → ok / rejected</text>
<text x="654" y="580" font-size="28" fill="#334155">没有证据，不自动当作失败</text>
<text x="582" y="676" font-size="38" fill="#64748b">↓</text>
<rect x="44" y="710" width="1112" height="208" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="72" y="758" font-size="32" fill="#1d4ed8" font-weight="700">④ checkpoint：没有未结预留，才确认停靠</text>
<text x="72" y="812" font-size="28" fill="#334155">control = acknowledged：本协议不再预留新步骤</text>
<text x="72" y="867" font-size="28" fill="#334155">result 仍独立保存：open / succeeded / failed，不擦除迟到的成功</text>
<rect x="44" y="954" width="1112" height="108" rx="20" fill="#fef9c3" stroke="#fde68a" stroke-width="2"/>
<text x="72" y="997" font-size="32" fill="#854d0e" font-weight="700">确认不再继续 ≠ 撤销已发生的效果</text>
<text x="72" y="1038" font-size="28" fill="#854d0e">本地、合作式协议；不是杀死进程，也不是远端停止保证</text>
</g></svg>