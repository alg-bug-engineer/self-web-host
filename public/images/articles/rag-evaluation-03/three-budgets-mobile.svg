<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1140" viewBox="0 0 540 1140" role="img" aria-labelledby="title description"><title id="title">三个预算，三个不同问题</title><desc id="description">作者机制图 · 不展示模型性能或费用。每路候选深度：每条召回路径保留多少项；太浅：证据到不了融合层。重排候选数量：多少查询—文本对被检查；更多工作量不保证更好。最终上下文体积：按排名扫描，整块装入；超预算跳过，不暗中截断。单独核查失败：候选缺失 / 融合退化；预算挤出 / 资格不符。分别记录候选与最终证据覆盖。字符数与操作计数，不是计费 token</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="540" height="1140" fill="#FFFFFF"/><rect x="12" y="12" width="516" height="1116" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="66" font-size="31" fill="#2387DE" text-anchor="middle" font-weight="600">三个预算，三个不同问题</text><text x="270" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">作者机制图 · 不展示模型性能或费用</text><rect x="40" y="153" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="197" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">每路候选深度</text><text x="64" y="241" font-size="27" fill="#576574" text-anchor="start" font-weight="400">每条召回路径保留多少项</text><text x="64" y="279" font-size="27" fill="#576574" text-anchor="start" font-weight="400">太浅：证据到不了融合层</text><path d="M270 331 V352" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="360" width="460" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="64" y="404" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">重排候选数量</text><text x="64" y="448" font-size="27" fill="#576574" text-anchor="start" font-weight="400">多少查询—文本对被检查</text><text x="64" y="486" font-size="27" fill="#576574" text-anchor="start" font-weight="400">更多工作量不保证更好</text><path d="M270 538 V559" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="567" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="611" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">最终上下文体积</text><text x="64" y="655" font-size="27" fill="#576574" text-anchor="start" font-weight="400">按排名扫描，整块装入</text><text x="64" y="693" font-size="27" fill="#576574" text-anchor="start" font-weight="400">超预算跳过，不暗中截断</text><path d="M270 745 V766" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="774" width="460" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="64" y="818" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">单独核查失败</text><text x="64" y="862" font-size="27" fill="#576574" text-anchor="start" font-weight="400">候选缺失 / 融合退化</text><text x="64" y="900" font-size="27" fill="#576574" text-anchor="start" font-weight="400">预算挤出 / 资格不符</text><rect x="40" y="1000" width="460" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="270" y="1040" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">分别记录候选与最终证据覆盖</text><text x="270" y="1079" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">字符数与操作计数，不是计费 token</text></g></svg>
