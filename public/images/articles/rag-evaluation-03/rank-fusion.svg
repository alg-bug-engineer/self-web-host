<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="title description"><title id="title">两路词法，先合候选再排序</title><desc id="description">作者机制图 · 无向量模型或神经重排。A 路：BM25 原查询：保留精确词项与标识符；输出独立排名。B 路：BM25 扩展查询：使用固定全局扩展词表；扩展词也可能引入干扰。RRF 合并排名：同一身份跨路累加贡献；不把原始分数直接相加。规则重排与预算：只读查询与候选文本；不读取证据或答案标签。RRF 只改变已有候选的顺序。两路都漏掉的证据，不会凭空出现</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="1080" height="750" fill="#FFFFFF"/><rect x="12" y="12" width="1056" height="726" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="66" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">两路词法，先合候选再排序</text><text x="540" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">作者机制图 · 无向量模型或神经重排</text><rect x="56" y="158" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="80" y="202" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">A 路：BM25 原查询</text><text x="80" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">保留精确词项与标识符</text><text x="80" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">输出独立排名</text><rect x="560" y="158" width="464" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="584" y="202" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">B 路：BM25 扩展查询</text><text x="584" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">使用固定全局扩展词表</text><text x="584" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">扩展词也可能引入干扰</text><rect x="56" y="378" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="80" y="422" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">RRF 合并排名</text><text x="80" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">同一身份跨路累加贡献</text><text x="80" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不把原始分数直接相加</text><rect x="560" y="378" width="464" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="584" y="422" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">规则重排与预算</text><text x="584" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">只读查询与候选文本</text><text x="584" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不读取证据或答案标签</text><path d="M288 336 V368" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 336 V352 H420 V368" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M528 463 H550" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="620" width="1000" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="660" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">RRF 只改变已有候选的顺序</text><text x="540" y="699" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">两路都漏掉的证据，不会凭空出现</text></g></svg>
