<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1140" viewBox="0 0 540 1140" role="img" aria-labelledby="title description"><title id="title">两路词法，先合候选再排序</title><desc id="description">作者机制图 · 无向量模型或神经重排。A 路：BM25 原查询：保留精确词项与标识符；输出独立排名。B 路：BM25 扩展查询：使用固定全局扩展词表；扩展词也可能引入干扰。RRF 合并排名：同一身份跨路累加贡献；不把原始分数直接相加。规则重排与预算：只读查询与候选文本；不读取证据或答案标签。RRF 只改变已有候选的顺序。两路都漏掉的证据，不会凭空出现</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="540" height="1140" fill="#FFFFFF"/><rect x="12" y="12" width="516" height="1116" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="66" font-size="31" fill="#2387DE" text-anchor="middle" font-weight="600">两路词法，先合候选再排序</text><text x="270" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">作者机制图 · 无向量模型或神经重排</text><rect x="40" y="153" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="197" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">A 路：BM25 原查询</text><text x="64" y="241" font-size="27" fill="#576574" text-anchor="start" font-weight="400">保留精确词项与标识符</text><text x="64" y="279" font-size="27" fill="#576574" text-anchor="start" font-weight="400">输出独立排名</text><rect x="40" y="360" width="460" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="64" y="404" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">B 路：BM25 扩展查询</text><text x="64" y="448" font-size="27" fill="#576574" text-anchor="start" font-weight="400">使用固定全局扩展词表</text><text x="64" y="486" font-size="27" fill="#576574" text-anchor="start" font-weight="400">扩展词也可能引入干扰</text><path d="M270 538 V559" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="567" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="611" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">RRF 合并排名</text><text x="64" y="655" font-size="27" fill="#576574" text-anchor="start" font-weight="400">同一身份跨路累加贡献</text><text x="64" y="693" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不把原始分数直接相加</text><path d="M270 745 V766" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="774" width="460" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="64" y="818" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">规则重排与预算</text><text x="64" y="862" font-size="27" fill="#576574" text-anchor="start" font-weight="400">只读查询与候选文本</text><text x="64" y="900" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不读取证据或答案标签</text><path d="M40 238 H24 V548 H270 V560" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="1000" width="460" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="270" y="1040" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">RRF 只改变已有候选的顺序</text><text x="270" y="1079" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">两路都漏掉的证据，不会凭空出现</text></g></svg>
