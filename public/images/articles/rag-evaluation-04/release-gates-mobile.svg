<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1140" viewBox="0 0 540 1140" role="img" aria-labelledby="title description"><title id="title">总分上涨，仍可能拦截</title><desc id="description">合成实验 · 检查规则，不是生产认证。1 / 验证输入契约：同题配对，不漏题不重复；缺少记录就停止判断。2 / 展开逐题差值：保留平均变化与退化题；关键题不能藏在总分里。3 / 单独检查硬条件：上下文资格与拒答声明；按演示策略独立阻断。4 / 输出决定与证据：列出问题 ID 和阻断原因；通过也只覆盖已测条件。平均收益不能抵消硬性阻断。记录可信度，决定门禁可信度</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="540" height="1140" fill="#FFFFFF"/><rect x="12" y="12" width="516" height="1116" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="66" font-size="31" fill="#2387DE" text-anchor="middle" font-weight="600">总分上涨，仍可能拦截</text><text x="270" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">合成实验 · 检查规则，不是生产认证</text><rect x="40" y="153" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="197" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">1 / 验证输入契约</text><text x="64" y="241" font-size="27" fill="#576574" text-anchor="start" font-weight="400">同题配对，不漏题不重复</text><text x="64" y="279" font-size="27" fill="#576574" text-anchor="start" font-weight="400">缺少记录就停止判断</text><path d="M270 331 V352" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="360" width="460" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="64" y="404" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">2 / 展开逐题差值</text><text x="64" y="448" font-size="27" fill="#576574" text-anchor="start" font-weight="400">保留平均变化与退化题</text><text x="64" y="486" font-size="27" fill="#576574" text-anchor="start" font-weight="400">关键题不能藏在总分里</text><path d="M270 538 V559" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="567" width="460" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="64" y="611" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">3 / 单独检查硬条件</text><text x="64" y="655" font-size="27" fill="#576574" text-anchor="start" font-weight="400">上下文资格与拒答声明</text><text x="64" y="693" font-size="27" fill="#576574" text-anchor="start" font-weight="400">按演示策略独立阻断</text><path d="M270 745 V766" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="774" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="818" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">4 / 输出决定与证据</text><text x="64" y="862" font-size="27" fill="#576574" text-anchor="start" font-weight="400">列出问题 ID 和阻断原因</text><text x="64" y="900" font-size="27" fill="#576574" text-anchor="start" font-weight="400">通过也只覆盖已测条件</text><rect x="40" y="1000" width="460" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="270" y="1040" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">平均收益不能抵消硬性阻断</text><text x="270" y="1079" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">记录可信度，决定门禁可信度</text></g></svg>
