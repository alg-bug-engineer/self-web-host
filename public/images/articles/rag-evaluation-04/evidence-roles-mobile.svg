<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1140" viewBox="0 0 540 1140" role="img" aria-labelledby="title description"><title id="title">四类数据，各负其责</title><desc id="description">角色示意 · 本例不具备真实独立留出。开发区：用来改方案：定位失败与设计修复；已经参与方案选择。校准区：用来定规则：比较评审与参考标签；单独选择演示阈值。回放区：防旧错复发：保留已知失败案例；不能冒充未知测试。留出角色：检查新问题：真实项目须隔离选择过程；本例仍是手工合成数据。不能边看最终试卷，边改答案。不同 ID 不等于没有信息泄漏</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="540" height="1140" fill="#FFFFFF"/><rect x="12" y="12" width="516" height="1116" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="66" font-size="31" fill="#2387DE" text-anchor="middle" font-weight="600">四类数据，各负其责</text><text x="270" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">角色示意 · 本例不具备真实独立留出</text><rect x="40" y="153" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="197" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">开发区：用来改方案</text><text x="64" y="241" font-size="27" fill="#576574" text-anchor="start" font-weight="400">定位失败与设计修复</text><text x="64" y="279" font-size="27" fill="#576574" text-anchor="start" font-weight="400">已经参与方案选择</text><rect x="40" y="360" width="460" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="64" y="404" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">校准区：用来定规则</text><text x="64" y="448" font-size="27" fill="#576574" text-anchor="start" font-weight="400">比较评审与参考标签</text><text x="64" y="486" font-size="27" fill="#576574" text-anchor="start" font-weight="400">单独选择演示阈值</text><rect x="40" y="567" width="460" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="64" y="611" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">回放区：防旧错复发</text><text x="64" y="655" font-size="27" fill="#576574" text-anchor="start" font-weight="400">保留已知失败案例</text><text x="64" y="693" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不能冒充未知测试</text><rect x="40" y="774" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="818" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">留出角色：检查新问题</text><text x="64" y="862" font-size="27" fill="#576574" text-anchor="start" font-weight="400">真实项目须隔离选择过程</text><text x="64" y="900" font-size="27" fill="#576574" text-anchor="start" font-weight="400">本例仍是手工合成数据</text><rect x="40" y="1000" width="460" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="270" y="1040" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">不能边看最终试卷，边改答案</text><text x="270" y="1079" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">不同 ID 不等于没有信息泄漏</text></g></svg>
