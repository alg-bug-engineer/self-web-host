<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1470" viewBox="0 0 540 1470" role="img" aria-labelledby="title description">
<title id="title">看见了 → 传到了 → 用上了</title><desc id="description">作者假想的救援协作方案：二娃发现风险，把含来源、时间和未知项的情报交给下一位。出发前确认信息，调整计划后执行，再按爷爷是否安全回来验收。路线变化或失败要反馈给交接与确认环节。不是动画剧情复述或实测结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="540" height="1470" fill="#FFFFFF"/>
<rect x="12" y="12" width="516" height="1446" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="62" font-size="35" fill="#2387DE" text-anchor="middle" font-weight="600">看见了 → 传到了</text><text x="270" y="108" font-size="35" fill="#2387DE" text-anchor="middle" font-weight="600">→ 用上了</text><text x="270" y="154" font-size="25" fill="#79838D" text-anchor="middle" font-weight="400">假想方案，非剧情或实测</text><rect x="80" y="200" width="404" height="130" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="104" y="248" font-size="28" fill="#165DA2" text-anchor="start" font-weight="600">看见了：侦察发现</text><text x="104" y="297" font-size="27" fill="#576574" text-anchor="start" font-weight="400">位置 · 时间 · 未知项</text><path d="M282 338 V366" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="80" y="376" width="404" height="130" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="104" y="424" font-size="28" fill="#146E73" text-anchor="start" font-weight="600">传到了：带来源交接</text><text x="104" y="473" font-size="27" fill="#576574" text-anchor="start" font-weight="400">目标 · 证据 · 已知的坑</text><path d="M282 514 V542" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="80" y="552" width="404" height="130" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="104" y="600" font-size="28" fill="#165DA2" text-anchor="start" font-weight="600">用上了：出发前确认</text><text x="104" y="649" font-size="27" fill="#576574" text-anchor="start" font-weight="400">按新情报调整计划</text><path d="M282 690 V718" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="80" y="728" width="404" height="130" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="104" y="776" font-size="28" fill="#146E73" text-anchor="start" font-weight="600">执行</text><text x="104" y="825" font-size="27" fill="#576574" text-anchor="start" font-weight="400">按确认的方案行动</text><path d="M282 866 V894" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="80" y="904" width="404" height="130" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="104" y="952" font-size="28" fill="#165DA2" text-anchor="start" font-weight="600">验收</text><text x="104" y="1001" font-size="27" fill="#576574" text-anchor="start" font-weight="400">爷爷安全回来了吗？</text><path d="M282 1042 V1080" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><text x="316" y="1068" font-size="24" fill="#A45461" text-anchor="start" font-weight="400">未达成时</text><rect x="80" y="1094" width="404" height="142" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="104" y="1143" font-size="29" fill="#AC3345" text-anchor="start" font-weight="600">路线变化 / 失败</text><text x="104" y="1194" font-size="27" fill="#576574" text-anchor="start" font-weight="400">带着原因，更新后再确认</text><path d="M72 1165 H36 V441 H72" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><rect x="20" y="647" width="32" height="171" fill="#FFFFFF"/><text x="36" y="674" font-size="25" fill="#A45461" text-anchor="middle" font-weight="400">反</text><text x="36" y="708" font-size="25" fill="#A45461" text-anchor="middle" font-weight="400">馈</text><text x="36" y="742" font-size="25" fill="#A45461" text-anchor="middle" font-weight="400">与</text><text x="36" y="776" font-size="25" fill="#A45461" text-anchor="middle" font-weight="400">更</text><text x="36" y="810" font-size="25" fill="#A45461" text-anchor="middle" font-weight="400">新</text><rect x="36" y="1280" width="468" height="156" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="270" y="1325" font-size="28" fill="#986319" text-anchor="middle" font-weight="500">下一步用得上上一步，</text><text x="270" y="1370" font-size="28" fill="#986319" text-anchor="middle" font-weight="500">最后核对共同目标，</text><text x="270" y="1412" font-size="28" fill="#986319" text-anchor="middle" font-weight="500">而不是只把任务打勾。</text></g>
</svg>
