<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="864" viewBox="0 0 1080 864" role="img" aria-labelledby="title description">
<title id="title">看见了 → 传到了 → 用上了</title><desc id="description">作者假想的救援协作方案：二娃发现风险，把含来源、时间和未知项的情报交给下一位。出发前确认信息，调整计划后执行，再按爷爷是否安全回来验收。路线变化或失败要反馈给交接与确认环节。不是动画剧情复述或实测结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="864" fill="#FFFFFF"/>
<rect x="12" y="12" width="1056" height="840" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="40" fill="#2387DE" text-anchor="middle" font-weight="600">看见了 → 传到了 → 用上了</text><text x="540" y="114" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">假想的协作方案，不是剧情复述或实测结果</text><rect x="48" y="182" width="280" height="198" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="188" y="230" font-size="32" fill="#165DA2" text-anchor="middle" font-weight="600">看见了</text><text x="188" y="286" font-size="29" fill="#576574" text-anchor="middle" font-weight="400">侦察发现风险</text><text x="188" y="339" font-size="24" fill="#79838D" text-anchor="middle" font-weight="400">位置 · 时间 · 未知项</text><rect x="400" y="182" width="280" height="198" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="540" y="230" font-size="32" fill="#146E73" text-anchor="middle" font-weight="600">传到了</text><text x="540" y="286" font-size="29" fill="#576574" text-anchor="middle" font-weight="400">带来源交接</text><text x="540" y="339" font-size="24" fill="#79838D" text-anchor="middle" font-weight="400">目标 · 证据 · 已知的坑</text><rect x="752" y="182" width="280" height="198" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="892" y="230" font-size="32" fill="#165DA2" text-anchor="middle" font-weight="600">用上了</text><text x="892" y="286" font-size="29" fill="#576574" text-anchor="middle" font-weight="400">出发前确认</text><text x="892" y="339" font-size="24" fill="#79838D" text-anchor="middle" font-weight="400">按新情报调整计划</text><path d="M336 280 H390" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><path d="M688 280 H742" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><path d="M892 388 V470" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="484" width="280" height="158" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="892" y="535" font-size="32" fill="#165DA2" text-anchor="middle" font-weight="600">执行</text><text x="892" y="589" font-size="27" fill="#576574" text-anchor="middle" font-weight="400">按确认的方案行动</text><path d="M742 563 H690" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="450" y="484" width="230" height="158" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="565" y="535" font-size="32" fill="#146E73" text-anchor="middle" font-weight="600">验收</text><text x="565" y="589" font-size="24" fill="#576574" text-anchor="middle" font-weight="400">爷爷安全回来了吗？</text><rect x="48" y="484" width="280" height="158" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="188" y="533" font-size="28" fill="#AC3345" text-anchor="middle" font-weight="600">路线变化 / 失败</text><text x="188" y="586" font-size="27" fill="#576574" text-anchor="middle" font-weight="400">把原因交回去</text><path d="M440 563 H338" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><text x="389" y="542" font-size="24" fill="#A45461" text-anchor="middle" font-weight="400">未达成时</text><path d="M188 476 V430 H540 V390" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><rect x="235" y="405" width="219" height="44" fill="#FFFFFF"/><text x="344" y="435" font-size="24" fill="#A45461" text-anchor="middle" font-weight="400">更新情报，再确认</text><rect x="48" y="714" width="984" height="112" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="540" y="758" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">救援不是把任务全部打勾。</text><text x="540" y="802" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">要让下一步用得上上一步，最后核对共同目标。</text></g>
</svg>
