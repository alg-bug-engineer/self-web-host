<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1190" viewBox="0 0 540 1190" role="img" aria-labelledby="title description">
<title id="title">七种本事，缺一张协作单</title><desc id="description">七兄弟各有本领。能力清单不会自动决定任务如何分解、情报如何共享、失败如何回退和结果由谁验收。作者借角色设定说明协作问题，不是模型内部专家结构图。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="540" height="1190" fill="#FFFFFF"/>
<rect x="12" y="12" width="516" height="1166" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="62" font-size="36" fill="#2387DE" text-anchor="middle" font-weight="600">七种本事，</text><text x="270" y="108" font-size="36" fill="#2387DE" text-anchor="middle" font-weight="600">缺一张协作单</text><text x="270" y="153" font-size="25" fill="#79838D" text-anchor="middle" font-weight="400">协作类比，非 MoE 模型结构</text><rect x="36" y="189" width="228" height="108" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="56" y="229" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">大娃</text><text x="56" y="271" font-size="24" fill="#576574" text-anchor="start" font-weight="400">力大无穷</text><rect x="276" y="189" width="228" height="108" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="296" y="229" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">二娃</text><text x="296" y="271" font-size="24" fill="#576574" text-anchor="start" font-weight="400">千里眼 · 顺风耳</text><rect x="36" y="313" width="228" height="108" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="56" y="353" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">三娃</text><text x="56" y="395" font-size="24" fill="#576574" text-anchor="start" font-weight="400">铜头铁臂</text><rect x="276" y="313" width="228" height="108" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="296" y="353" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">四娃</text><text x="296" y="395" font-size="24" fill="#576574" text-anchor="start" font-weight="400">喷火</text><rect x="36" y="437" width="228" height="108" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="56" y="477" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">五娃</text><text x="56" y="519" font-size="24" fill="#576574" text-anchor="start" font-weight="400">控水</text><rect x="276" y="437" width="228" height="108" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="296" y="477" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">六娃</text><text x="296" y="519" font-size="24" fill="#576574" text-anchor="start" font-weight="400">隐身</text><rect x="36" y="561" width="228" height="108" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="56" y="601" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">七娃</text><text x="56" y="643" font-size="24" fill="#576574" text-anchor="start" font-weight="400">宝葫芦</text><text x="390" y="601" font-size="28" fill="#165DA2" text-anchor="middle" font-weight="500">本领齐全</text><text x="390" y="643" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">配合待补</text><path d="M270 684 V724" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="36" y="738" width="468" height="272" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="64" y="786" font-size="31" fill="#146E73" text-anchor="start" font-weight="600">谁来把它们接起来？</text><text x="64" y="836" font-size="28" fill="#576574" text-anchor="start" font-weight="400">任务拆解 · 条件调度</text><text x="64" y="881" font-size="28" fill="#576574" text-anchor="start" font-weight="400">共享情报 · 明确交接</text><text x="64" y="926" font-size="28" fill="#576574" text-anchor="start" font-weight="400">失败回退 · 及时止损</text><text x="64" y="971" font-size="28" fill="#576574" text-anchor="start" font-weight="400">统一目标 · 最后验收</text><rect x="36" y="1044" width="468" height="114" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="270" y="1087" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">能力表写得再满，</text><text x="270" y="1132" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">也不会自己长出配合。</text></g>
</svg>
