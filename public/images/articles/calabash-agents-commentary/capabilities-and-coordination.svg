<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="782" viewBox="0 0 1080 782" role="img" aria-labelledby="title description">
<title id="title">七种本事，缺一张协作单</title><desc id="description">七兄弟各有本领。能力清单不会自动决定任务如何分解、情报如何共享、失败如何回退和结果由谁验收。作者借角色设定说明协作问题，不是模型内部专家结构图。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="782" fill="#FFFFFF"/>
<rect x="12" y="12" width="1056" height="758" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">七种本事，缺一张协作单</text><text x="540" y="115" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">协作类比，非 MoE 模型结构</text><rect x="48" y="154" width="260" height="104" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="72" y="193" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">大娃</text><text x="72" y="233" font-size="26" fill="#576574" text-anchor="start" font-weight="400">力大无穷</text><rect x="328" y="154" width="260" height="104" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="352" y="193" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">二娃</text><text x="352" y="233" font-size="26" fill="#576574" text-anchor="start" font-weight="400">千里眼 · 顺风耳</text><rect x="48" y="276" width="260" height="104" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="72" y="315" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">三娃</text><text x="72" y="355" font-size="26" fill="#576574" text-anchor="start" font-weight="400">铜头铁臂</text><rect x="328" y="276" width="260" height="104" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="352" y="315" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">四娃</text><text x="352" y="355" font-size="26" fill="#576574" text-anchor="start" font-weight="400">喷火</text><rect x="48" y="398" width="260" height="104" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="72" y="437" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">五娃</text><text x="72" y="477" font-size="26" fill="#576574" text-anchor="start" font-weight="400">控水</text><rect x="328" y="398" width="260" height="104" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="352" y="437" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">六娃</text><text x="352" y="477" font-size="26" fill="#576574" text-anchor="start" font-weight="400">隐身</text><rect x="48" y="520" width="260" height="104" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="72" y="559" font-size="29" fill="#165DA2" text-anchor="start" font-weight="600">七娃</text><text x="72" y="599" font-size="26" fill="#576574" text-anchor="start" font-weight="400">宝葫芦</text><text x="458" y="565" font-size="28" fill="#165DA2" text-anchor="middle" font-weight="500">单项能力齐全</text><text x="458" y="608" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">协作仍要设计</text><path d="M600 386 H661" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="674" y="240" width="358" height="334" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="704" y="286" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">谁来把它们接起来？</text><text x="704" y="342" font-size="26" fill="#576574" text-anchor="start" font-weight="400">任务拆解 · 条件调度</text><text x="704" y="396" font-size="26" fill="#576574" text-anchor="start" font-weight="400">共享情报 · 明确交接</text><text x="704" y="450" font-size="26" fill="#576574" text-anchor="start" font-weight="400">失败回退 · 及时止损</text><text x="704" y="504" font-size="26" fill="#576574" text-anchor="start" font-weight="400">统一目标 · 最后验收</text><rect x="48" y="682" width="984" height="70" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="540" y="726" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">能力表写得再满，也不会自己长出配合。</text></g>
</svg>
