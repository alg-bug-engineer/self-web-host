<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc"><title id="title">缺回音，不等于可以撤销</title><desc id="desc">两步预留：明确结果推动状态</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="42" fill="#1d4ed8" font-weight="700">缺回音，不等于可以撤销</text><text x="32" y="110" font-size="30" fill="#64748b" font-weight="400">两步预留：明确结果推动状态</text><rect x="32" y="160" width="490" height="170" rx="18" fill="#eff6ff" stroke="#94a3b8"/><text x="56" y="206" font-size="30" fill="#1e3a5f" font-weight="600">库存预留成功</text><text x="56" y="249" font-size="30" fill="#1e3a5f" font-weight="400">进入 slot_pending</text><text x="56" y="292" font-size="30" fill="#1e3a5f" font-weight="400">继续申请安装时段</text><rect x="558" y="160" width="490" height="170" rx="18" fill="#ecfeff" stroke="#94a3b8"/><text x="582" y="206" font-size="30" fill="#1e3a5f" font-weight="600">时段明确拒绝</text><text x="582" y="249" font-size="30" fill="#1e3a5f" font-weight="400">进入 release_pending</text><text x="582" y="292" font-size="30" fill="#1e3a5f" font-weight="400">开始释放库存预留</text><rect x="32" y="400" width="490" height="170" rx="18" fill="#fef2f2" stroke="#94a3b8"/><text x="56" y="446" font-size="30" fill="#1e3a5f" font-weight="600">任何一步缺回音</text><text x="56" y="489" font-size="30" fill="#1e3a5f" font-weight="400">保留当前阶段</text><text x="56" y="532" font-size="30" fill="#1e3a5f" font-weight="400">等待恢复与核查</text><rect x="558" y="400" width="490" height="170" rx="18" fill="#ecfdf5" stroke="#94a3b8"/><text x="582" y="446" font-size="30" fill="#1e3a5f" font-weight="600">库存释放确认成功</text><text x="582" y="489" font-size="30" fill="#1e3a5f" font-weight="400">才进入 aborted</text><text x="582" y="532" font-size="30" fill="#1e3a5f" font-weight="400">重复补偿不多释放</text><rect x="32" y="778" width="1016" height="96" rx="16" fill="#fef3c7" stroke="#e5c96d"/><text x="50" y="818" font-size="30" fill="#713f12" font-weight="600">释放已提交、回执丢失 → 用同一 ID 重放</text><text x="50" y="856" font-size="30" fill="#713f12" font-weight="600">三个数据库分别提交，没有跨库原子事务</text></g></svg>