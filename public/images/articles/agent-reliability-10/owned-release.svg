<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc"><title id="title">补偿只释放自己的预留</title><desc id="desc">合成设备容量：10 套</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="42" fill="#1d4ed8" font-weight="700">补偿只释放自己的预留</text><text x="32" y="110" font-size="30" fill="#64748b" font-weight="400">合成设备容量：10 套</text><rect x="32" y="160" width="490" height="170" rx="18" fill="#eff6ff" stroke="#94a3b8"/><text x="56" y="206" font-size="30" fill="#1e3a5f" font-weight="600">A 先预留 3 套</text><text x="56" y="249" font-size="30" fill="#1e3a5f" font-weight="400">B 随后预留 2 套</text><text x="56" y="292" font-size="30" fill="#1e3a5f" font-weight="400">此时可用：5 套</text><rect x="558" y="160" width="490" height="170" rx="18" fill="#ecfeff" stroke="#94a3b8"/><text x="582" y="206" font-size="30" fill="#1e3a5f" font-weight="600">A 的第二步失败</text><text x="582" y="249" font-size="30" fill="#1e3a5f" font-weight="400">只撤销 A 的预留</text><text x="582" y="292" font-size="30" fill="#1e3a5f" font-weight="400">B 的预留仍然有效</text><rect x="32" y="380" width="490" height="170" rx="18" fill="#fef2f2" stroke="#94a3b8"/><text x="56" y="426" font-size="30" fill="#1e3a5f" font-weight="600">错误：恢复旧快照</text><text x="56" y="469" font-size="30" fill="#1e3a5f" font-weight="400">把可用量写回 10</text><text x="56" y="512" font-size="30" fill="#1e3a5f" font-weight="400">覆盖了 B 的占用</text><rect x="558" y="380" width="490" height="170" rx="18" fill="#ecfdf5" stroke="#94a3b8"/><text x="582" y="426" font-size="30" fill="#1e3a5f" font-weight="600">正确：按 ID 释放</text><text x="582" y="469" font-size="30" fill="#1e3a5f" font-weight="400">可用量恢复为 8</text><text x="582" y="512" font-size="30" fill="#1e3a5f" font-weight="400">保留 A 的释放墓碑</text><rect x="32" y="638" width="1016" height="96" rx="16" fill="#fef3c7" stroke="#e5c96d"/><text x="50" y="678" font-size="30" fill="#713f12" font-weight="600">补偿改自己的记录，不把整个世界拨回旧状态</text></g></svg>