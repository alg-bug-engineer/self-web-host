<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1160" viewBox="0 0 540 1160" role="img" aria-labelledby="title desc"><title id="title">撤回的是哪一笔？</title><desc id="desc">合成设备容量：10 套</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="34" fill="#1d4ed8" font-weight="700">撤回的是哪一笔？</text><text x="32" y="110" font-size="30" fill="#64748b" font-weight="400">合成设备容量：10 套</text><rect x="32" y="150" width="476" height="180" rx="18" fill="#eff6ff" stroke="#94a3b8"/><text x="56" y="196" font-size="30" fill="#1e3a5f" font-weight="600">A 预留 3，B 预留 2</text><text x="56" y="239" font-size="30" fill="#1e3a5f" font-weight="400">现在可用：5 套</text><text x="56" y="282" font-size="30" fill="#1e3a5f" font-weight="400">A 的第二步失败</text><rect x="32" y="380" width="476" height="180" rx="18" fill="#fef2f2" stroke="#94a3b8"/><text x="56" y="426" font-size="30" fill="#1e3a5f" font-weight="600">错误：恢复旧快照</text><text x="56" y="469" font-size="30" fill="#1e3a5f" font-weight="400">把可用量写回 10</text><text x="56" y="512" font-size="30" fill="#1e3a5f" font-weight="400">B 的占用被覆盖</text><rect x="32" y="610" width="476" height="180" rx="18" fill="#ecfdf5" stroke="#94a3b8"/><text x="56" y="656" font-size="30" fill="#1e3a5f" font-weight="600">正确：仅释放 A</text><text x="56" y="699" font-size="30" fill="#1e3a5f" font-weight="400">可用量恢复为 8</text><text x="56" y="742" font-size="30" fill="#1e3a5f" font-weight="400">B 仍占用 2 套</text><rect x="32" y="840" width="476" height="160" rx="18" fill="#ecfeff" stroke="#94a3b8"/><text x="56" y="886" font-size="30" fill="#1e3a5f" font-weight="600">保留 A 的释放墓碑</text><text x="56" y="929" font-size="30" fill="#1e3a5f" font-weight="400">旧请求不能重新占用</text><rect x="32" y="1038" width="476" height="96" rx="16" fill="#fef3c7" stroke="#e5c96d"/><text x="50" y="1078" font-size="30" fill="#713f12" font-weight="600">只撤自己的预留</text><text x="50" y="1116" font-size="30" fill="#713f12" font-weight="600">别覆盖别人的新状态</text></g></svg>