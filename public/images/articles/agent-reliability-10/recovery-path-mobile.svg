<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1360" viewBox="0 0 540 1360" role="img" aria-labelledby="title desc"><title id="title">哪一步真的结束了？</title><desc id="desc">明确结果推动状态</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="32" y="62" font-size="34" fill="#1d4ed8" font-weight="700">哪一步真的结束了？</text><text x="32" y="110" font-size="30" fill="#64748b" font-weight="400">明确结果推动状态</text><rect x="32" y="150" width="476" height="180" rx="18" fill="#eff6ff" stroke="#94a3b8"/><text x="56" y="196" font-size="30" fill="#1e3a5f" font-weight="600">库存预留成功</text><text x="56" y="239" font-size="30" fill="#1e3a5f" font-weight="400">slot_pending</text><text x="56" y="282" font-size="30" fill="#1e3a5f" font-weight="400">继续申请安装时段</text><rect x="32" y="390" width="476" height="180" rx="18" fill="#ecfeff" stroke="#94a3b8"/><text x="56" y="436" font-size="30" fill="#1e3a5f" font-weight="600">时段明确拒绝</text><text x="56" y="479" font-size="30" fill="#1e3a5f" font-weight="400">release_pending</text><text x="56" y="522" font-size="30" fill="#1e3a5f" font-weight="400">开始释放库存预留</text><rect x="32" y="630" width="476" height="180" rx="18" fill="#fef2f2" stroke="#94a3b8"/><text x="56" y="676" font-size="30" fill="#1e3a5f" font-weight="600">缺回音：留在原阶段</text><text x="56" y="719" font-size="30" fill="#1e3a5f" font-weight="400">不能当作业务拒绝</text><text x="56" y="762" font-size="30" fill="#1e3a5f" font-weight="400">不能宣布补偿成功</text><rect x="32" y="870" width="476" height="180" rx="18" fill="#ecfdf5" stroke="#94a3b8"/><text x="56" y="916" font-size="30" fill="#1e3a5f" font-weight="600">库存释放确认成功</text><text x="56" y="959" font-size="30" fill="#1e3a5f" font-weight="400">aborted</text><text x="56" y="1002" font-size="30" fill="#1e3a5f" font-weight="400">重复释放不多退</text><rect x="32" y="1238" width="476" height="96" rx="16" fill="#fef3c7" stroke="#e5c96d"/><text x="50" y="1278" font-size="30" fill="#713f12" font-weight="600">分别提交，允许暂时不一致</text><text x="50" y="1316" font-size="30" fill="#713f12" font-weight="600">持久记录，让恢复有据可循</text></g></svg>