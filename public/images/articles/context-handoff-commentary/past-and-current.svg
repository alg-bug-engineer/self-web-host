<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc"><title id="title">交接之后，旧文档该站在哪里</title><desc id="desc">旧文档保留历史；当前职责需核实有效范围与来源；不知道时待核实，知道也不代表获准行动。</desc>
<rect width="1080" height="900" fill="#fff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#63829b"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="48" y="73" font-size="44" fill="#1762aa" font-weight="700">人交班了，信息也要交班</text>
<text x="48" y="124" font-size="30" fill="#6b7785">原创机制示意 · 历史出处、现行职责与行动授权要分开</text>
<rect x="48" y="180" width="420" height="230" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/>
<text x="72" y="233" font-size="32" fill="#1762aa" font-weight="700">旧文档：曾经由谁负责</text>
<text x="72" y="291" font-size="30" fill="#28465c">保留出处与历史用途</text>
<text x="72" y="347" font-size="30" fill="#28465c">不能直接当作现行安排</text>
<path d="M481,292 L574,292" stroke="#63829b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="595" y="180" width="437" height="230" rx="18" fill="#eaf8f5" stroke="#8ac2b7" stroke-width="2"/>
<text x="619" y="233" font-size="32" fill="#1762aa" font-weight="700">另查现行职责</text>
<text x="619" y="291" font-size="30" fill="#28465c">职责范围 · 生效时间</text>
<text x="619" y="347" font-size="30" fill="#28465c">有权维护的来源与接手人</text>
<path d="M813,423 L813,447 L286,447 L286,473 M794,447 L794,473" fill="none" stroke="#63829b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M286,459 L286,473" stroke="#63829b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="483" width="476" height="156" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/>
<text x="72" y="537" font-size="32" fill="#1762aa" font-weight="700">可确认：作为派单候选</text>
<text x="72" y="592" font-size="30" fill="#28465c">仍须检查本次行动授权</text>
<rect x="556" y="483" width="476" height="156" rx="18" fill="#fff0ef" stroke="#dda6a2" stroke-width="2"/>
<text x="580" y="537" font-size="32" fill="#a34540" font-weight="700">不可确认：保留待核实</text>
<text x="580" y="592" font-size="30" fill="#28465c">不要用历史人名补空白</text>
<rect x="48" y="684" width="984" height="100" rx="18" fill="#fff8d8" stroke="#d9c77a" stroke-width="2"/>
<text x="72" y="745" font-size="35" fill="#635523" font-weight="700">找到出处 ≠ 仍然有效；知道职责 ≠ 获准行动</text>
<text x="48" y="850" font-size="29" fill="#6b7785">按任务授权读取必要信息，不要求开放全部私聊或人事资料</text>
</g></svg>