<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="title description"><title id="title">每个分数，先找对对象</title><desc id="description">历史存档重算 · 没有重跑语义模型。1 / 引用标记：检查数字编号与记录形状；只能说明引用结构存在。2 / 句子与证据集合：读取既有完整支持标签；不由正则推断语义真假。3 / 单条引用贡献：无支持、部分或完整；部分贡献依赖整句判断。4 / 命题级审查边界：本次没有命题级新标注；不能从句子标签倒推。结构、语义、分母分开报告。重算统计不等于重跑模型</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="1080" height="750" fill="#FFFFFF"/><rect x="12" y="12" width="1056" height="726" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="66" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">每个分数，先找对对象</text><text x="540" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">历史存档重算 · 没有重跑语义模型</text><rect x="56" y="158" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="80" y="202" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">1 / 引用标记</text><text x="80" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">检查数字编号与记录形状</text><text x="80" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">只能说明引用结构存在</text><rect x="560" y="158" width="464" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="584" y="202" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">2 / 句子与证据集合</text><text x="584" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">读取既有完整支持标签</text><text x="584" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不由正则推断语义真假</text><rect x="56" y="378" width="464" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="80" y="422" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">3 / 单条引用贡献</text><text x="80" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">无支持、部分或完整</text><text x="80" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">部分贡献依赖整句判断</text><rect x="560" y="378" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="584" y="422" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">4 / 命题级审查边界</text><text x="584" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">本次没有命题级新标注</text><text x="584" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不能从句子标签倒推</text><path d="M528 243 H550" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 336 V352 H288 V368" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M528 463 H550" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="620" width="1000" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="660" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">结构、语义、分母分开报告</text><text x="540" y="699" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">重算统计不等于重跑模型</text></g></svg>
