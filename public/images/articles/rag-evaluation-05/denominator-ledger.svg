<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="title description"><title id="title">别把分母藏进百分比</title><desc id="description">固定 ALCE 切片 · 本次实际运行统计。100 题 / 1 题空输出：空答案保留在问题分母；不被当成安全拒答。236 句 / 168 句获支持：上游人工句子标签；微平均：168 ÷ 236。306 次数字引用标记：按出现次数计，不去重；有 2 句重复引用编号。290 个已评分引用记录：每句最多前三次的形状；另有 16 次没有计分记录。题、句子、引用是不同单位。百分比必须附对象与分母</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="1080" height="750" fill="#FFFFFF"/><rect x="12" y="12" width="1056" height="726" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="66" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">别把分母藏进百分比</text><text x="540" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">固定 ALCE 切片 · 本次实际运行统计</text><rect x="56" y="158" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="80" y="202" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">100 题 / 1 题空输出</text><text x="80" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">空答案保留在问题分母</text><text x="80" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不被当成安全拒答</text><rect x="560" y="158" width="464" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="584" y="202" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">236 句 / 168 句获支持</text><text x="584" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">上游人工句子标签</text><text x="584" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">微平均：168 ÷ 236</text><rect x="56" y="378" width="464" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="80" y="422" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">306 次数字引用标记</text><text x="80" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">按出现次数计，不去重</text><text x="80" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">有 2 句重复引用编号</text><rect x="560" y="378" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="584" y="422" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">290 个已评分引用记录</text><text x="584" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">每句最多前三次的形状</text><text x="584" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">另有 16 次没有计分记录</text><rect x="40" y="620" width="1000" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="660" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">题、句子、引用是不同单位</text><text x="540" y="699" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">百分比必须附对象与分母</text></g></svg>
