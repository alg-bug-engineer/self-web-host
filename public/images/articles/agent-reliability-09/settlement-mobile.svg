<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1340" viewBox="0 0 540 1340" role="img" aria-labelledby="title desc">
<title id="title">先占额度，再等账单</title><desc id="desc">真实本地协议实验|供应商账单为合成输入</desc>
<rect width="540" height="1340" fill="white"/>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<text x="30" y="58" font-size="34" fill="#1458a5" font-weight="700">先占额度，再等账单</text>
<text x="30" y="108" font-size="30" fill="#64748b" font-weight="400">真实本地协议实验</text>
<text x="30" y="150" font-size="30" fill="#64748b" font-weight="400">供应商账单为合成输入</text>
<rect x="24" y="200" width="492" height="292.6666666666667" rx="18" fill="#eff6ff" stroke="#b9cddd" stroke-width="2"/>
<text x="44" y="248" font-size="32" fill="#1458a5" font-weight="700">预留 → 领取</text>
<text x="44" y="300" font-size="30" fill="#334155" font-weight="400">原子检查总占用</text>
<text x="44" y="344" font-size="30" fill="#334155" font-weight="400">领取提交为 unknown</text>
<text x="44" y="388" font-size="30" fill="#334155" font-weight="400">每次至多派发一次</text>
<path d="M270 502.6666666666667 V531.6666666666667 m-9 -9 l9 9 9 -9" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="24" y="548.6666666666667" width="492" height="292.6666666666667" rx="18" fill="#eafaf7" stroke="#b9cddd" stroke-width="2"/>
<text x="44" y="596.6666666666667" font-size="32" fill="#1458a5" font-weight="700">等待最终账单</text>
<text x="44" y="648.6666666666667" font-size="30" fill="#334155" font-weight="400">超时仍保留上界</text>
<text x="44" y="692.6666666666667" font-size="30" fill="#334155" font-weight="400">重复对账不重复释放</text>
<text x="44" y="736.6666666666667" font-size="30" fill="#334155" font-weight="400">部分账单不能结清</text>
<path d="M270 851.3333333333335 V880.3333333333335 m-9 -9 l9 9 9 -9" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="24" y="897.3333333333335" width="492" height="292.6666666666667" rx="18" fill="#fff1f2" stroke="#b9cddd" stroke-width="2"/>
<text x="44" y="945.3333333333335" font-size="32" fill="#1458a5" font-weight="700">上界被打破</text>
<text x="44" y="997.3333333333335" font-size="30" fill="#334155" font-weight="400">预留 60，实报 120</text>
<text x="44" y="1041.3333333333335" font-size="30" fill="#334155" font-weight="400">记录真实费用并冻结</text>
<text x="44" y="1085.3333333333335" font-size="30" fill="#334155" font-weight="400">已领取调用不能撤回</text>
<rect x="24" y="1225" width="492" height="90" rx="14" fill="#fff7d6" stroke="#ead69a"/>
<text x="40" y="1263" font-size="30" fill="#6b5520" font-weight="400">冻结不能倒追回收费</text>
<text x="40" y="1300" font-size="30" fill="#6b5520" font-weight="400">本地账本不是远端硬限额</text>
</svg>