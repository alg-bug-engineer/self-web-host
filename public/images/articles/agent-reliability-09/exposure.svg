<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" role="img" aria-labelledby="title desc">
<title id="title">钱没扣，不等于额度没被占</title><desc id="desc">合成 USD 美分｜A / B 是互斥情况，不是连续步骤</desc>
<rect width="1080" height="800" fill="white"/>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<text x="30" y="58" font-size="42" fill="#1458a5" font-weight="700">钱没扣，不等于额度没被占</text>
<text x="30" y="108" font-size="30" fill="#64748b" font-weight="400">合成 USD 美分｜A / B 是互斥情况，不是连续步骤</text>
<rect x="30" y="190" width="320" height="430" rx="18" fill="#eff6ff" stroke="#b9cddd" stroke-width="2"/>
<text x="48" y="244" font-size="31" fill="#1458a5" font-weight="700">起点：预留 60</text>
<text x="48" y="306" font-size="29" fill="#334155" font-weight="400">总预算 100 美分</text>
<text x="48" y="354" font-size="29" fill="#334155" font-weight="400">未结算占用 60</text>
<text x="48" y="402" font-size="29" fill="#334155" font-weight="400">可用额度 40</text>
<rect x="380" y="190" width="320" height="430" rx="18" fill="#eafaf7" stroke="#b9cddd" stroke-width="2"/>
<text x="398" y="244" font-size="31" fill="#1458a5" font-weight="700">分支 A：已核清</text>
<text x="398" y="306" font-size="29" fill="#334155" font-weight="400">最终费用 20</text>
<text x="398" y="354" font-size="29" fill="#334155" font-weight="400">只释放差额 40</text>
<text x="398" y="402" font-size="29" fill="#334155" font-weight="400">可用额度 80</text>
<rect x="730" y="190" width="320" height="430" rx="18" fill="#fff1f2" stroke="#b9cddd" stroke-width="2"/>
<text x="748" y="244" font-size="31" fill="#1458a5" font-weight="700">分支 B：未核清</text>
<text x="748" y="306" font-size="29" fill="#334155" font-weight="400">超时 ≠ 免费</text>
<text x="748" y="354" font-size="29" fill="#334155" font-weight="400">仍按上界占 60</text>
<text x="748" y="402" font-size="29" fill="#334155" font-weight="400">查清前不能释放</text>
<rect x="24" y="685" width="1032" height="90" rx="14" fill="#fff7d6" stroke="#ead69a"/>
<text x="40" y="723" font-size="30" fill="#6b5520" font-weight="400">占用 = 已结算费用 + 未结算上界；不能把已花的钱也释放</text>
</svg>