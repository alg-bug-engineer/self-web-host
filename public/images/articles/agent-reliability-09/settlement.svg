<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="840" viewBox="0 0 1080 840" role="img" aria-labelledby="title desc">
<title id="title">先占额度，再等账单把话说完</title><desc id="desc">真实本地协议实验｜供应商账单为合成输入</desc>
<rect width="1080" height="840" fill="white"/>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<text x="30" y="58" font-size="42" fill="#1458a5" font-weight="700">先占额度，再等账单把话说完</text>
<text x="30" y="108" font-size="30" fill="#64748b" font-weight="400">真实本地协议实验｜供应商账单为合成输入</text>
<rect x="30" y="190" width="320" height="470" rx="18" fill="#eff6ff" stroke="#b9cddd" stroke-width="2"/>
<text x="48" y="244" font-size="31" fill="#1458a5" font-weight="700">预留 → 领取</text>
<text x="48" y="306" font-size="29" fill="#334155" font-weight="400">原子检查总占用</text>
<text x="48" y="354" font-size="29" fill="#334155" font-weight="400">领取提交为 unknown</text>
<text x="48" y="402" font-size="29" fill="#334155" font-weight="400">每次至多派发一次</text>
<path d="M354 340 h22 m-8 -8 l8 8 -8 8" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="380" y="190" width="320" height="470" rx="18" fill="#eafaf7" stroke="#b9cddd" stroke-width="2"/>
<text x="398" y="244" font-size="31" fill="#1458a5" font-weight="700">等待最终账单</text>
<text x="398" y="306" font-size="29" fill="#334155" font-weight="400">超时仍保留上界</text>
<text x="398" y="354" font-size="29" fill="#334155" font-weight="400">重复对账不重复释放</text>
<text x="398" y="402" font-size="29" fill="#334155" font-weight="400">部分账单不能结清</text>
<path d="M704 340 h22 m-8 -8 l8 8 -8 8" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="730" y="190" width="320" height="470" rx="18" fill="#fff1f2" stroke="#b9cddd" stroke-width="2"/>
<text x="748" y="244" font-size="31" fill="#1458a5" font-weight="700">上界被打破</text>
<text x="748" y="306" font-size="29" fill="#334155" font-weight="400">预留 60，实报 120</text>
<text x="748" y="354" font-size="29" fill="#334155" font-weight="400">记录真实费用并冻结</text>
<text x="748" y="402" font-size="29" fill="#334155" font-weight="400">已领取调用不能撤回</text>
<rect x="24" y="725" width="1032" height="90" rx="14" fill="#fff7d6" stroke="#ead69a"/>
<text x="40" y="763" font-size="30" fill="#6b5520" font-weight="400">冻结不能倒追回收费；应用账本不等于供应商硬限额</text>
</svg>