<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960" role="img" aria-labelledby="title desc">
<title id="title">本地模型与工具的数据边界</title><desc id="desc">假想架构，非 Beam 默认配置。模型提出请求，执行层检查目标、数据和授权，再选择内部工具、获准外部服务或拒绝。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#7891ac" stroke-width="1.4"/></marker></defs>
<rect width="1080" height="960" fill="white"/>
<text x="40" y="62" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" fill="#2457a6" font-weight="700">模型在内部，工具去哪里？</text>
<text x="40" y="110" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">假想架构 · 非 Beam 实现图或默认配置</text>
<rect x="40" y="166" width="440" height="216" rx="20" fill="#eef5ff" stroke="#b8c9db" stroke-width="1.5"/>
<text x="62" y="211" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">内部材料 → 本地推理</text>
<text x="62" y="259" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">模型可以提出工具请求</text>
<text x="62" y="300" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">工具与联网能力由部署决定</text>
<text x="62" y="341" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">权重不会凭空获得外联权限</text>
<path d="M480 274 L550 274" fill="none" stroke="#7891ac" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570" y="166" width="470" height="216" rx="20" fill="#eaf5f4" stroke="#b8c9db" stroke-width="1.5"/>
<text x="592" y="211" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">执行层：执行前检查</text>
<text x="592" y="259" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">请求发给谁？会带出什么？</text>
<text x="592" y="300" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">是否拥有相应授权？</text>
<text x="592" y="341" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">模型不能替系统签发权限</text>
<path d="M800 382 L800 422 L200 422 L200 473" fill="none" stroke="#7891ac" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M800 422 L540 422 L540 473" fill="none" stroke="#7891ac" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M800 422 L880 422 L880 473" fill="none" stroke="#7891ac" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="490" width="320" height="211" rx="20" fill="#eaf5f4" stroke="#b8c9db" stroke-width="1.5"/>
<text x="62" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">内部工具</text>
<text x="62" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">内部 OCR / 检索</text>
<text x="62" y="624" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">核对处理位置</text>
<text x="62" y="665" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">及工具实际依赖</text>
<rect x="380" y="490" width="320" height="211" rx="20" fill="#eef5ff" stroke="#b8c9db" stroke-width="1.5"/>
<text x="402" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">获准的外部服务</text>
<text x="402" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">接收方、材料与用途</text>
<text x="402" y="624" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">在许可范围内</text>
<text x="402" y="665" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">此路径会外发数据</text>
<rect x="720" y="490" width="320" height="211" rx="20" fill="#fff0ef" stroke="#b8c9db" stroke-width="1.5"/>
<text x="742" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">未获准的请求</text>
<text x="742" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">未知或不允许的去向</text>
<text x="742" y="624" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">拒绝执行并说明原因</text>
<text x="742" y="665" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">不自动改走其他出口</text>
<rect x="40" y="753" width="1000" height="130" rx="20" fill="#fff5cf" stroke="#b8c9db" stroke-width="1.5"/>
<text x="64" y="802" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" fill="#2457a6" font-weight="600">模型放在哪里，与资料送给谁，分开验收</text>
<text x="64" y="849" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">“只读”也可能外发 · 其他网络路径同样需要控制</text>
<text x="40" y="933" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">AI 辅助原创架构示意 · 非实测结果 · 不构成完整安全保证</text>
</svg>