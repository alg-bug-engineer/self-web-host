<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1680" viewBox="0 0 540 1680" role="img" aria-labelledby="title desc">
<title id="title">本地模型与工具的数据边界</title><desc id="desc">假想架构，非 Beam 默认配置。模型提出请求，执行层检查目标、数据和授权，再选择内部工具、获准外部服务或拒绝。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#7891ac" stroke-width="1.4"/></marker></defs>
<rect width="540" height="1680" fill="white"/>
<text x="35" y="58" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" fill="#2457a6" font-weight="700">模型在内部，工具去哪里？</text>
<text x="35" y="104" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">假想架构 · 非 Beam 默认配置</text>
<rect x="35" y="151" width="470" height="210" rx="20" fill="#eef5ff" stroke="#b8c9db" stroke-width="1.5"/>
<text x="57" y="196" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">内部材料 → 本地推理</text>
<text x="57" y="244" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">模型可以提出工具请求</text>
<text x="57" y="285" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">工具与网络权限由部署决定</text>
<text x="57" y="326" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">权重不会凭空获得外联能力</text>
<path d="M270 361 L270 405" fill="none" stroke="#7891ac" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35" y="420" width="470" height="210" rx="20" fill="#eaf5f4" stroke="#b8c9db" stroke-width="1.5"/>
<text x="57" y="465" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">执行层：执行前检查</text>
<text x="57" y="513" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">请求发给谁？会带出什么？</text>
<text x="57" y="554" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">是否拥有相应授权？</text>
<text x="57" y="595" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">模型不能替系统签发权限</text>
<path d="M270 630 L270 672" fill="none" stroke="#7891ac" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="35" y="718" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" fill="#2457a6" font-weight="600">按具体请求选择下列路径</text>
<rect x="35" y="755" width="470" height="171" rx="20" fill="#eaf5f4" stroke="#b8c9db" stroke-width="1.5"/>
<text x="57" y="800" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">内部工具</text>
<text x="57" y="848" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">内部 OCR / 检索</text>
<text x="57" y="889" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">核对处理位置与实际依赖</text>
<rect x="35" y="955" width="470" height="171" rx="20" fill="#eef5ff" stroke="#b8c9db" stroke-width="1.5"/>
<text x="57" y="1000" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">获准的外部服务</text>
<text x="57" y="1048" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">接收方、材料与用途获准</text>
<text x="57" y="1089" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">此路径会向外发送数据</text>
<rect x="35" y="1155" width="470" height="171" rx="20" fill="#fff0ef" stroke="#b8c9db" stroke-width="1.5"/>
<text x="57" y="1200" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2457a6" font-weight="600">未知或未获准的请求</text>
<text x="57" y="1248" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">拒绝执行，并说明原因</text>
<text x="57" y="1289" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">不自动改走其他网络出口</text>
<rect x="35" y="1370" width="470" height="190" rx="20" fill="#fff5cf" stroke="#b8c9db" stroke-width="1.5"/>
<text x="55" y="1417" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#2457a6" font-weight="600">模型放在哪，资料送给谁</text>
<text x="55" y="1458" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#2457a6" font-weight="600">需要分开验收</text>
<text x="55" y="1504" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">“只读”也可能向外发送数据</text>
<text x="55" y="1543" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">其他网络路径同样需要控制</text>
<text x="35" y="1616" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">AI 辅助原创示意 · 非实测结果</text>
<text x="35" y="1657" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" fill="#526275" font-weight="400">不构成完整安全保证</text>
</svg>