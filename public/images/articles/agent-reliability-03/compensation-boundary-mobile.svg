<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1170" viewBox="0 0 540 1170" role="img" aria-labelledby="title description"><title id="title">补偿是另一项业务操作</title><desc id="description">它也会成功、失败或结果不明。确认原始副作用：明确是哪一条记录；保留原事实与审计历史。核验补偿授权：动作、对象和版本匹配；越界或过期就拒绝。补偿回执也可能丢：先记录独立尝试；结果不明继续对账。别把补偿叫撤销历史：已发通知不能被遗忘；不承诺回到原始世界。自动重试不是通用恢复。不确定性不能用新动作掩盖</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9CA9B5"/></marker></defs><rect width="540" height="1170" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="68" font-size="30" fill="#2387DE" text-anchor="middle" font-weight="600">补偿是另一项业务操作</text><text x="270" y="118" font-size="30" fill="#79838D" text-anchor="middle" font-weight="400">它也会成功、失败或结果不明</text><rect x="40" y="164" width="460" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="64" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">确认原始副作用</text><text x="64" y="262" font-size="30" fill="#334155" text-anchor="start" font-weight="400">明确是哪一条记录</text><text x="64" y="304" font-size="30" fill="#334155" text-anchor="start" font-weight="400">保留原事实与审计历史</text><path d="M270 354 V368" stroke="#9CA9B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="374" width="460" height="184" rx="16" fill="#EDF9F5" stroke="#B6DDCD"/><text x="64" y="421" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">核验补偿授权</text><text x="64" y="472" font-size="30" fill="#334155" text-anchor="start" font-weight="400">动作、对象和版本匹配</text><text x="64" y="514" font-size="30" fill="#334155" text-anchor="start" font-weight="400">越界或过期就拒绝</text><path d="M270 564 V578" stroke="#9CA9B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="584" width="460" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="64" y="631" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">补偿回执也可能丢</text><text x="64" y="682" font-size="30" fill="#334155" text-anchor="start" font-weight="400">先记录独立尝试</text><text x="64" y="724" font-size="30" fill="#334155" text-anchor="start" font-weight="400">结果不明继续对账</text><path d="M270 774 V788" stroke="#9CA9B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="794" width="460" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="64" y="841" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">别把补偿叫撤销历史</text><text x="64" y="892" font-size="30" fill="#334155" text-anchor="start" font-weight="400">已发通知不能被遗忘</text><text x="64" y="934" font-size="30" fill="#334155" text-anchor="start" font-weight="400">不承诺回到原始世界</text><rect x="40" y="1020" width="460" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="270" y="1063" font-size="30" fill="#986319" text-anchor="middle" font-weight="400">自动重试不是通用恢复</text><text x="270" y="1103" font-size="30" fill="#986319" text-anchor="middle" font-weight="400">不确定性不能用新动作掩盖</text></g></svg>
