<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1170" viewBox="0 0 540 1170" role="img" aria-labelledby="title description"><title id="title">人工对账也需要提交协议</title><desc id="description">防止两个人各自改对一半。01 固定证据：操作范围与参数摘要；候选结果及查询能力。02 固定决策版本：审核人看到版本 v；提交时必须仍为 v。03 冲突就重新核对：另一人已更新账本；旧页面不能覆盖新决定。04 授权单独检查：确认事实不等于授权；补偿需指定对象与动作。人来判断，系统守住边界。证据、版本和权限一起留痕</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9CA9B5"/></marker></defs><rect width="540" height="1170" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="68" font-size="30" fill="#2387DE" text-anchor="middle" font-weight="600">人工对账也需要提交协议</text><text x="270" y="118" font-size="30" fill="#79838D" text-anchor="middle" font-weight="400">防止两个人各自改对一半</text><rect x="40" y="164" width="460" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="64" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">01 固定证据</text><text x="64" y="262" font-size="30" fill="#334155" text-anchor="start" font-weight="400">操作范围与参数摘要</text><text x="64" y="304" font-size="30" fill="#334155" text-anchor="start" font-weight="400">候选结果及查询能力</text><path d="M270 354 V368" stroke="#9CA9B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="374" width="460" height="184" rx="16" fill="#EDF9F5" stroke="#B6DDCD"/><text x="64" y="421" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">02 固定决策版本</text><text x="64" y="472" font-size="30" fill="#334155" text-anchor="start" font-weight="400">审核人看到版本 v</text><text x="64" y="514" font-size="30" fill="#334155" text-anchor="start" font-weight="400">提交时必须仍为 v</text><path d="M270 564 V578" stroke="#9CA9B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="584" width="460" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="64" y="631" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">03 冲突就重新核对</text><text x="64" y="682" font-size="30" fill="#334155" text-anchor="start" font-weight="400">另一人已更新账本</text><text x="64" y="724" font-size="30" fill="#334155" text-anchor="start" font-weight="400">旧页面不能覆盖新决定</text><path d="M270 774 V788" stroke="#9CA9B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="794" width="460" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="64" y="841" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">04 授权单独检查</text><text x="64" y="892" font-size="30" fill="#334155" text-anchor="start" font-weight="400">确认事实不等于授权</text><text x="64" y="934" font-size="30" fill="#334155" text-anchor="start" font-weight="400">补偿需指定对象与动作</text><rect x="40" y="1020" width="460" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="270" y="1063" font-size="30" fill="#986319" text-anchor="middle" font-weight="400">人来判断，系统守住边界</text><text x="270" y="1103" font-size="30" fill="#986319" text-anchor="middle" font-weight="400">证据、版本和权限一起留痕</text></g></svg>
