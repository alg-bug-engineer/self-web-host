<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title description"><title id="title">查到了什么，能证明什么</title><desc id="description">查询能力决定结论强度。找到匹配记录：证明至少发生一次；不完整查询不证明唯一。暂时没有记录：索引可能延迟；旧请求仍可能在路上。权威终态快照：范围完整且请求已封口；之后拒绝原操作新写入。重复或参数冲突：保存全部候选记录；交由业务方核验处置。查无记录不等于从未执行。还要排除未来的迟到写入</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9CA9B5"/></marker></defs><rect width="1080" height="790" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">查到了什么，能证明什么</text><text x="540" y="118" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">查询能力决定结论强度</text><rect x="52" y="164" width="474" height="184" rx="16" fill="#EDF9F5" stroke="#B6DDCD"/><text x="76" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">找到匹配记录</text><text x="76" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">证明至少发生一次</text><text x="76" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">不完整查询不证明唯一</text><rect x="554" y="164" width="474" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="578" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">暂时没有记录</text><text x="578" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">索引可能延迟</text><text x="578" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">旧请求仍可能在路上</text><rect x="52" y="390" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="76" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">权威终态快照</text><text x="76" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">范围完整且请求已封口</text><text x="76" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">之后拒绝原操作新写入</text><rect x="554" y="390" width="474" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="578" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">重复或参数冲突</text><text x="578" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">保存全部候选记录</text><text x="578" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">交由业务方核验处置</text><rect x="40" y="655" width="1000" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="698" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">查无记录不等于从未执行</text><text x="540" y="738" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">还要排除未来的迟到写入</text></g></svg>
