<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title description"><title id="title">回执丢了，事实还在远端</title><desc id="description">示意：两本账，各自提交。01 持久化意图：保存操作与参数；发送前留下尝试记录。02 远端已经执行：合成工单已提交；回复之前进程退出。03 本地只能 unknown：超时说明没拿到回执；不能推出业务失败。04 先核对再决策：暂停自动再次执行；保存查询与人工证据。重试会再次改变远端。恢复先要减少不确定性</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9CA9B5"/></marker></defs><rect width="1080" height="790" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">回执丢了，事实还在远端</text><text x="540" y="118" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">示意：两本账，各自提交</text><rect x="52" y="164" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="76" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">01 持久化意图</text><text x="76" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">保存操作与参数</text><text x="76" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">发送前留下尝试记录</text><rect x="554" y="164" width="474" height="184" rx="16" fill="#EDF9F5" stroke="#B6DDCD"/><text x="578" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">02 远端已经执行</text><text x="578" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">合成工单已提交</text><text x="578" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">回复之前进程退出</text><rect x="52" y="390" width="474" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="76" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">03 本地只能 unknown</text><text x="76" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">超时说明没拿到回执</text><text x="76" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">不能推出业务失败</text><rect x="554" y="390" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="578" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">04 先核对再决策</text><text x="578" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">暂停自动再次执行</text><text x="578" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">保存查询与人工证据</text><rect x="40" y="655" width="1000" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="698" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">重试会再次改变远端</text><text x="540" y="738" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">恢复先要减少不确定性</text></g></svg>
