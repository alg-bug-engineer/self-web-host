<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1010" viewBox="0 0 540 1010" role="img" aria-labelledby="title description">
<title id="title">工单怎么越做越大</title><desc id="description">工单先解决按钮故障，再补充必要的证据与测试。未经确认的额外重构扩大了评审范围。必要的跨文件修改可以保留，增加协作也需要守住工单边界。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="540" height="1010" fill="#FFFFFF"/>
<rect x="12" y="12" width="516" height="986" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="64" font-size="34" fill="#2387DE" text-anchor="middle" font-weight="600">工单怎么越做越大</text><text x="270" y="108" font-size="25" fill="#79838D" text-anchor="middle" font-weight="400">必要的深入 ≠ 无关的扩张</text><rect x="36" y="160" width="424" height="178" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="64" y="210" font-size="31" fill="#165DA2" text-anchor="start" font-weight="600">修好按钮</text><text x="64" y="256" font-size="27" fill="#576574" text-anchor="start" font-weight="400">复现故障 · 找到原因</text><text x="64" y="302" font-size="25" fill="#165DA2" text-anchor="start" font-weight="400">先交好这张工单</text><path d="M246 342 V366 H270 V388" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="58" y="398" width="424" height="178" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="86" y="447" font-size="28" fill="#146E73" text-anchor="start" font-weight="600">补上必要的证据与测试</text><text x="86" y="494" font-size="27" fill="#576574" text-anchor="start" font-weight="400">确需跨文件</text><text x="86" y="538" font-size="27" fill="#576574" text-anchor="start" font-weight="400">说明理由再修改</text><path d="M270 580 V606 H294 V630" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><text x="322" y="609" font-size="24" fill="#A45461" text-anchor="start" font-weight="400">若继续加码</text><rect x="80" y="640" width="424" height="178" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="108" y="689" font-size="28" fill="#AC3345" text-anchor="start" font-weight="600">未经确认的额外扩张</text><text x="108" y="736" font-size="27" fill="#576574" text-anchor="start" font-weight="400">改得越多</text><text x="108" y="779" font-size="27" fill="#576574" text-anchor="start" font-weight="400">待评审的也越多</text><rect x="36" y="866" width="468" height="110" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="270" y="907" font-size="27" fill="#986319" text-anchor="middle" font-weight="500">多叫几个帮手，</text><text x="270" y="948" font-size="27" fill="#986319" text-anchor="middle" font-weight="500">也得守住这张工单的边界。</text></g>
</svg>
