<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title description">
<title id="title">AI省下的时间，去了谁身上？</title><desc id="description">AI生成改动后，需要人工核对范围与风险，符合要求才能验收。需要修改时进入返工并重新评审。这是责任与流程示意，不代表各环节耗时比例。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="690" fill="#FFFFFF"/>
<rect x="12" y="12" width="1056" height="666" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="40" fill="#2387DE" text-anchor="middle" font-weight="600">AI省下的时间，去了谁身上？</text><text x="540" y="114" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">生成代码之后，还有评审、返工与验收</text><rect x="52" y="185" width="260" height="158" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="182" y="240" font-size="32" fill="#165DA2" text-anchor="middle" font-weight="600">AI 生成</text><text x="182" y="289" font-size="27" fill="#576574" text-anchor="middle" font-weight="400">写出改动</text><path d="M320 265 H400" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="410" y="185" width="260" height="158" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="540" y="240" font-size="32" fill="#146E73" text-anchor="middle" font-weight="600">人工评审</text><text x="540" y="289" font-size="26" fill="#576574" text-anchor="middle" font-weight="400">核对范围与风险</text><path d="M678 265 H758" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><text x="719" y="228" font-size="25" fill="#79838D" text-anchor="middle" font-weight="400">通过</text><rect x="768" y="185" width="260" height="158" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="898" y="240" font-size="32" fill="#165DA2" text-anchor="middle" font-weight="600">验收通过</text><text x="898" y="289" font-size="26" fill="#576574" text-anchor="middle" font-weight="400">交回可接受的结果</text><path d="M540 350 V402" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><text x="568" y="387" font-size="25" fill="#A45461" text-anchor="start" font-weight="400">需要修改时</text><rect x="410" y="414" width="400" height="132" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="440" y="464" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">必要时返工</text><text x="440" y="512" font-size="26" fill="#576574" text-anchor="start" font-weight="400">拆改动、补测试、重新检查</text><path d="M402 480 H352 V315 H400" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><text x="323" y="398" font-size="25" fill="#79838D" text-anchor="end" font-weight="400">再评审</text><rect x="52" y="594" width="976" height="64" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="540" y="635" font-size="28" fill="#986319" text-anchor="middle" font-weight="500">提效，要算到有人敢接下这份改动。</text></g>
</svg>
