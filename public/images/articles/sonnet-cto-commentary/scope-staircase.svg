<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="712" viewBox="0 0 1080 712" role="img" aria-labelledby="title description">
<title id="title">工单怎么越做越大</title><desc id="description">工单先解决按钮故障，再补充必要的证据与测试。未经确认的额外重构扩大了评审范围。必要的跨文件修改可以保留，增加协作也需要守住工单边界。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="712" fill="#FFFFFF"/>
<rect x="12" y="12" width="1056" height="688" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">工单怎么越做越大</text><text x="540" y="113" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">必要的深入 ≠ 无关的扩张</text><rect x="52" y="154" width="520" height="120" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="82" y="200" font-size="31" fill="#165DA2" text-anchor="start" font-weight="600">修好按钮</text><text x="82" y="242" font-size="26" fill="#576574" text-anchor="start" font-weight="400">复现故障 · 找到原因</text><text x="539" y="198" font-size="24" fill="#165DA2" text-anchor="end" font-weight="400">工单起点</text><path d="M292 278 V290 H308 V301" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="278" y="308" width="576" height="120" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="308" y="354" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">补上必要的证据与测试</text><text x="308" y="396" font-size="26" fill="#576574" text-anchor="start" font-weight="400">确需跨文件，说明理由再修改</text><path d="M536 432 V444 H554 V456" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><text x="586" y="457" font-size="24" fill="#A45461" text-anchor="start" font-weight="400">若未经确认继续加码</text><rect x="500" y="466" width="528" height="120" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="530" y="512" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">未经确认的额外扩张</text><text x="530" y="554" font-size="26" fill="#576574" text-anchor="start" font-weight="400">改得越多，待评审的也越多</text><rect x="52" y="620" width="976" height="62" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="540" y="659" font-size="27" fill="#986319" text-anchor="middle" font-weight="500">多叫几个帮手，也得守住这张工单的边界。</text></g>
</svg>
