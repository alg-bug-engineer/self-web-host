<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1108" viewBox="0 0 540 1108" role="img" aria-labelledby="title description">
<title id="title">AI省下的时间，去了谁身上？</title><desc id="description">AI生成改动后，需要人工核对范围与风险，符合要求才能验收。需要修改时进入返工并重新评审。这是责任与流程示意，不代表各环节耗时比例。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#C96A77" stroke-width="1.5"/></marker></defs>
<rect width="540" height="1108" fill="#FFFFFF"/>
<rect x="12" y="12" width="516" height="1084" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="62" font-size="34" fill="#2387DE" text-anchor="middle" font-weight="600">AI省下的时间，</text><text x="270" y="106" font-size="34" fill="#2387DE" text-anchor="middle" font-weight="600">去了谁身上？</text><text x="270" y="154" font-size="25" fill="#79838D" text-anchor="middle" font-weight="400">流程示意，不代表耗时比例</text><rect x="80" y="190" width="380" height="134" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="108" y="240" font-size="31" fill="#165DA2" text-anchor="start" font-weight="600">AI 生成</text><text x="108" y="286" font-size="27" fill="#576574" text-anchor="start" font-weight="400">写出改动</text><path d="M270 332 V362" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="80" y="372" width="380" height="134" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="108" y="422" font-size="31" fill="#146E73" text-anchor="start" font-weight="600">人工评审</text><text x="108" y="468" font-size="27" fill="#576574" text-anchor="start" font-weight="400">核对范围与风险</text><path d="M270 514 V558" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><text x="302" y="548" font-size="24" fill="#A45461" text-anchor="start" font-weight="400">需要修改</text><rect x="80" y="568" width="380" height="164" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="108" y="618" font-size="31" fill="#AC3345" text-anchor="start" font-weight="600">必要时返工</text><text x="108" y="663" font-size="27" fill="#576574" text-anchor="start" font-weight="400">拆改动 · 补测试</text><text x="108" y="704" font-size="26" fill="#A45461" text-anchor="start" font-weight="400">改完，再回到评审</text><path d="M72 650 H36 V439 H72" fill="none" stroke="#C96A77" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/><rect x="80" y="800" width="380" height="134" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="108" y="850" font-size="31" fill="#165DA2" text-anchor="start" font-weight="600">验收通过</text><text x="108" y="896" font-size="27" fill="#576574" text-anchor="start" font-weight="400">交回可接受的结果</text><path d="M468 439 H504 V867 H468" fill="none" stroke="#A1ADB8" stroke-width="2"  marker-end="url(#arrow)"/><rect x="484" y="571" width="40" height="144" fill="#FFFFFF"/><text x="504" y="602" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">无</text><text x="504" y="636" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">需</text><text x="504" y="670" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">修</text><text x="504" y="704" font-size="26" fill="#79838D" text-anchor="middle" font-weight="400">改</text><rect x="36" y="972" width="468" height="104" rx="12" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.3"/><text x="270" y="1014" font-size="27" fill="#986319" text-anchor="middle" font-weight="500">提效，要算到有人</text><text x="270" y="1052" font-size="27" fill="#986319" text-anchor="middle" font-weight="500">敢接下这份改动。</text></g>
</svg>
