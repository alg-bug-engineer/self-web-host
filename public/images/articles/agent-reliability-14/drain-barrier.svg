<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1640" viewBox="0 0 1920 1640" role="img" aria-labelledby="title desc">
<title id="title">持久排空：停止接单，不是停止履约</title><desc id="desc">三个控制状态和版本检查；所有未结任务阻止暂停。本地屏障不代表进程退出或数据库独占。</desc>
<defs><marker id="arrow" markerWidth="20" markerHeight="20" refX="16" refY="6" orient="auto"><path d="M0 0 L16 6 L0 12" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1920" height="1640" fill="white"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="84" y="116" font-size="64" fill="#1d4ed8" font-weight="bold">持久排空：停止接单，不是停止履约</text>
<text x="84" y="192" font-size="44" fill="#64748b" font-weight="normal">一个写事务里关门；另一个写事务里核对全部未结承诺。</text>
<rect x="84" y="300" width="496" height="380" rx="64" fill="#eff6ff" stroke="#93c5fd"/>
<text x="118" y="384" font-size="52" fill="#1e40af" font-weight="bold">open · 开放</text>
<text x="118" y="492" font-size="42" fill="#334155" font-weight="normal">新身份可以受理</text>
<text x="118" y="578" font-size="42" fill="#334155" font-weight="normal">存量任务可以领取</text>
<rect x="712" y="300" width="496" height="380" rx="64" fill="#ecfeff" stroke="#67e8f9"/>
<text x="746" y="384" font-size="52" fill="#1e40af" font-weight="bold">draining · 排空中</text>
<text x="746" y="492" font-size="42" fill="#334155" font-weight="normal">拒新身份 / 可回放</text>
<text x="746" y="578" font-size="42" fill="#334155" font-weight="normal">继续领取并完成存量</text>
<rect x="1340" y="300" width="496" height="380" rx="64" fill="#f0fdfa" stroke="#5eead4"/>
<text x="1374" y="384" font-size="52" fill="#1e40af" font-weight="bold">paused · 暂停</text>
<text x="1374" y="492" font-size="42" fill="#334155" font-weight="normal">未结归零才可进入</text>
<text x="1374" y="578" font-size="42" fill="#334155" font-weight="normal">拒新任务 / 不领取</text>
<path d="M588 480 L692 480" fill="none" stroke="#64748b" stroke-width="8" marker-end="url(#arrow)"/>
<path d="M1216 480 L1320 480" fill="none" stroke="#64748b" stroke-width="8" marker-end="url(#arrow)"/>
<text x="84" y="776" font-size="46" fill="#b91c1c" font-weight="normal">queued、inflight、quarantined 都属于未结，不能被“队列空了”抹掉。</text>
<rect x="84" y="858" width="1752" height="266" rx="64" fill="#fff1f2" stroke="#fda4af"/>
<text x="132" y="940" font-size="52" fill="#9f1239" font-weight="bold">每次转换都检查控制版本，再递增版本。</text>
<text x="132" y="1028" font-size="44" fill="#334155" font-weight="normal">旧 resume 不得打开新一轮排空的门；主动恢复 draining = 放弃排空。</text>
<rect x="84" y="1210" width="1752" height="330" rx="64" fill="#fef9c3" stroke="#fde68a"/>
<text x="132" y="1292" font-size="52" fill="#854d0e" font-weight="bold">本地任务屏障 ≠ 工作进程退出 ≠ 数据库独占维护权</text>
<text x="132" y="1382" font-size="46" fill="#334155" font-weight="normal">没有远端副作用完成证明，也没有授权改表、删库或停止机器。</text>
<text x="132" y="1470" font-size="46" fill="#334155" font-weight="normal">观察到 paused 之后，仍要为具体维护操作建立自己的保护。</text>
</g></svg>