<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title description"><title id="title">传下去的是剩余时间</title><desc id="description">逻辑时间示意 · 不代表真实耗时。入口确定截止点：任务开始时确定 D；后续调用不能向后续期。排队和准备也计时：先消耗部分任务窗口；调用前重新计算剩余量。尝试与退避共用窗口：单次上限取剩余量约束；退避不能免费重置时钟。到期就停止新派发：等于截止点已过期；结果不明仍保留证据。每次都有 timeout 还不够。整条任务需要同一个终点</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9CA9B5"/></marker></defs><rect width="1080" height="790" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">传下去的是剩余时间</text><text x="540" y="118" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">逻辑时间示意 · 不代表真实耗时</text><rect x="52" y="164" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="76" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">入口确定截止点</text><text x="76" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">任务开始时确定 D</text><text x="76" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">后续调用不能向后续期</text><rect x="554" y="164" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="578" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">排队和准备也计时</text><text x="578" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">先消耗部分任务窗口</text><text x="578" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">调用前重新计算剩余量</text><rect x="52" y="390" width="474" height="184" rx="16" fill="#EDF9F5" stroke="#B6DDCD"/><text x="76" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">尝试与退避共用窗口</text><text x="76" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">单次上限取剩余量约束</text><text x="76" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">退避不能免费重置时钟</text><rect x="554" y="390" width="474" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="578" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">到期就停止新派发</text><text x="578" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">等于截止点已过期</text><text x="578" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">结果不明仍保留证据</text><rect x="40" y="655" width="1000" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="698" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">每次都有 timeout 还不够</text><text x="540" y="738" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">整条任务需要同一个终点</text></g></svg>
