<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title description"><title id="title">取消等待，不会撤销提交</title><desc id="description">机制示意 · 两个维度分开记录。接收端接受操作：业务效果已经提交；远端事实独立存在。回执没有抵达：调用方停止等待；本地结果仍可能未知。取消后停止新尝试：释放可释放的资源；不把已提交效果删除。结果另行核验：只读查询收集证据；补偿必须单独获授权。停止原因不是业务结果。cancelled 可以伴随 unknown</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9CA9B5"/></marker></defs><rect width="1080" height="790" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">取消等待，不会撤销提交</text><text x="540" y="118" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">机制示意 · 两个维度分开记录</text><rect x="52" y="164" width="474" height="184" rx="16" fill="#EDF9F5" stroke="#B6DDCD"/><text x="76" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">接收端接受操作</text><text x="76" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">业务效果已经提交</text><text x="76" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">远端事实独立存在</text><rect x="554" y="164" width="474" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="578" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">回执没有抵达</text><text x="578" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">调用方停止等待</text><text x="578" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">本地结果仍可能未知</text><rect x="52" y="390" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="76" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">取消后停止新尝试</text><text x="76" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">释放可释放的资源</text><text x="76" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">不把已提交效果删除</text><rect x="554" y="390" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="578" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">结果另行核验</text><text x="578" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">只读查询收集证据</text><text x="578" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">补偿必须单独获授权</text><rect x="40" y="655" width="1000" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="698" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">停止原因不是业务结果</text><text x="540" y="738" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">cancelled 可以伴随 unknown</text></g></svg>
