<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title description"><title id="title">三层重试，把一次放大到多少次</title><desc id="description">合成失败场景 · 每层最多尝试 3 次。外层任务：一次业务意图；允许 3 次调用适配器。中层适配器：每次又尝试 3 次；下层被进入 9 次。内层客户端：每次再尝试 3 次；末端实际派发 27 次。共享派发预算：总额度含第一次派发；耗尽后全链路停止。别只数最外层的重试日志。计数应落到实际派发边界</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9CA9B5"/></marker></defs><rect width="1080" height="790" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="68" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">三层重试，把一次放大到多少次</text><text x="540" y="118" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">合成失败场景 · 每层最多尝试 3 次</text><rect x="52" y="164" width="474" height="184" rx="16" fill="#EEF6FF" stroke="#B8D5F2"/><text x="76" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">外层任务</text><text x="76" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">一次业务意图</text><text x="76" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">允许 3 次调用适配器</text><rect x="554" y="164" width="474" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="578" y="211" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">中层适配器</text><text x="578" y="262" font-size="27" fill="#334155" text-anchor="start" font-weight="400">每次又尝试 3 次</text><text x="578" y="304" font-size="27" fill="#334155" text-anchor="start" font-weight="400">下层被进入 9 次</text><rect x="52" y="390" width="474" height="184" rx="16" fill="#FFF0F0" stroke="#E7C3C3"/><text x="76" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">内层客户端</text><text x="76" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">每次再尝试 3 次</text><text x="76" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">末端实际派发 27 次</text><rect x="554" y="390" width="474" height="184" rx="16" fill="#EDF9F5" stroke="#B6DDCD"/><text x="578" y="437" font-size="30" fill="#245B8C" text-anchor="start" font-weight="600">共享派发预算</text><text x="578" y="488" font-size="27" fill="#334155" text-anchor="start" font-weight="400">总额度含第一次派发</text><text x="578" y="530" font-size="27" fill="#334155" text-anchor="start" font-weight="400">耗尽后全链路停止</text><rect x="40" y="655" width="1000" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="698" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">别只数最外层的重试日志</text><text x="540" y="738" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">计数应落到实际派发边界</text></g></svg>
