<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img" aria-labelledby="title desc"><title id="title">成果的装箱单，要写清什么</title><desc id="desc">作者提出的分析示意：稿件、结果家族和命题不能直接换算。复用结果须检查条件、依赖版本及验证范围，上游修订后检查下游。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="52" y="76" font-size="44" fill="#185ba0" font-weight="700">成果的装箱单，要写清什么</text><text x="52" y="127" font-size="29" fill="#627182" font-weight="400">三种不同口径，不能直接换算</text><rect x="52" y="178" width="296" height="186" rx="18" fill="#eaf3ff" stroke="#c8d9e6" stroke-width="2"/><text x="74" y="226" font-size="34" fill="#185ba0" font-weight="700">稿件</text><text x="74" y="280" font-size="29" fill="#253b50" font-weight="400">文件怎样拆分</text><text x="74" y="328" font-size="27" fill="#253b50" font-weight="400">一份主文或配套论证</text><rect x="392" y="178" width="296" height="186" rx="18" fill="#e7f7f2" stroke="#c8d9e6" stroke-width="2"/><text x="414" y="226" font-size="34" fill="#185ba0" font-weight="700">结果家族</text><text x="414" y="280" font-size="29" fill="#253b50" font-weight="400">材料怎样归组</text><text x="414" y="328" font-size="27" fill="#253b50" font-weight="400">可包含不同研究主张</text><rect x="732" y="178" width="296" height="186" rx="18" fill="#fff0ef" stroke="#c8d9e6" stroke-width="2"/><text x="754" y="226" font-size="34" fill="#185ba0" font-weight="700">可引用结论</text><text x="754" y="280" font-size="29" fill="#253b50" font-weight="400">命题说了什么</text><text x="754" y="328" font-size="27" fill="#253b50" font-weight="400">还须检查条件与证据</text><text x="52" y="426" font-size="35" fill="#185ba0" font-weight="700">准备复用时，把标签展开</text><rect x="52" y="462" width="976" height="82" rx="18" fill="#f6f9fc" stroke="#d6e0e9" stroke-width="2"/><text x="77" y="515" font-size="29" fill="#527392" font-weight="700">01</text><text x="143" y="515" font-size="30" fill="#253b50" font-weight="700">命题条件</text><text x="351" y="515" font-size="29" fill="#253b50" font-weight="400">对象、范围与仍需成立的假设</text><rect x="52" y="562" width="976" height="82" rx="18" fill="#f6f9fc" stroke="#d6e0e9" stroke-width="2"/><text x="77" y="615" font-size="29" fill="#527392" font-weight="700">02</text><text x="143" y="615" font-size="30" fill="#253b50" font-weight="700">依赖版本</text><text x="351" y="615" font-size="29" fill="#253b50" font-weight="400">用到哪份结果、哪一版论证</text><rect x="52" y="662" width="976" height="82" rx="18" fill="#f6f9fc" stroke="#d6e0e9" stroke-width="2"/><text x="77" y="715" font-size="29" fill="#527392" font-weight="700">03</text><text x="143" y="715" font-size="30" fill="#253b50" font-weight="700">验证范围</text><text x="351" y="715" font-size="29" fill="#253b50" font-weight="400">覆盖主定理，还是支持性结果</text><rect x="52" y="790" width="976" height="78" rx="18" fill="#fff3c4" stroke="#e7d58b" stroke-width="2"/><text x="80" y="840" font-size="34" fill="#705515" font-weight="700">上游修订后，沿依赖检查下游</text></g></svg>