<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1440" viewBox="0 0 540 1440" role="img" aria-labelledby="title desc"><title id="title">成果的装箱单，要写清什么</title><desc id="desc">作者提出的分析示意：稿件、结果家族和命题不能直接换算。复用结果须检查条件、依赖版本及验证范围，上游修订后检查下游。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="65" font-size="38" fill="#185ba0" font-weight="700">成果的装箱单</text><text x="30" y="115" font-size="30" fill="#627182" font-weight="400">三种口径，不能直接换算</text><rect x="30" y="160" width="480" height="165" rx="18" fill="#eaf3ff" stroke="#c8d9e6" stroke-width="2"/><text x="54" y="205" font-size="34" fill="#185ba0" font-weight="700">稿件</text><text x="54" y="252" font-size="30" fill="#253b50" font-weight="400">文件怎样拆分</text><text x="54" y="295" font-size="30" fill="#253b50" font-weight="400">主文或配套论证</text><rect x="30" y="355" width="480" height="165" rx="18" fill="#e7f7f2" stroke="#c8d9e6" stroke-width="2"/><text x="54" y="400" font-size="34" fill="#185ba0" font-weight="700">结果家族</text><text x="54" y="447" font-size="30" fill="#253b50" font-weight="400">材料怎样归组</text><text x="54" y="490" font-size="30" fill="#253b50" font-weight="400">可包含不同研究主张</text><rect x="30" y="550" width="480" height="165" rx="18" fill="#fff0ef" stroke="#c8d9e6" stroke-width="2"/><text x="54" y="595" font-size="34" fill="#185ba0" font-weight="700">可引用结论</text><text x="54" y="642" font-size="30" fill="#253b50" font-weight="400">命题说了什么</text><text x="54" y="685" font-size="30" fill="#253b50" font-weight="400">还须检查条件与证据</text><text x="30" y="780" font-size="34" fill="#185ba0" font-weight="700">准备复用，把标签展开</text><rect x="30" y="815" width="480" height="115" rx="18" fill="#f6f9fc" stroke="#d6e0e9" stroke-width="2"/><text x="54" y="861" font-size="32" fill="#253b50" font-weight="700">01  命题条件</text><text x="54" y="906" font-size="30" fill="#253b50" font-weight="400">对象、范围、所需假设</text><rect x="30" y="955" width="480" height="115" rx="18" fill="#f6f9fc" stroke="#d6e0e9" stroke-width="2"/><text x="54" y="1001" font-size="32" fill="#253b50" font-weight="700">02  依赖版本</text><text x="54" y="1046" font-size="30" fill="#253b50" font-weight="400">哪份结果、哪一版论证</text><rect x="30" y="1095" width="480" height="115" rx="18" fill="#f6f9fc" stroke="#d6e0e9" stroke-width="2"/><text x="54" y="1141" font-size="32" fill="#253b50" font-weight="700">03  验证范围</text><text x="54" y="1186" font-size="30" fill="#253b50" font-weight="400">主定理或支持性结果</text><rect x="30" y="1260" width="480" height="130" rx="18" fill="#fff3c4" stroke="#e7d58b" stroke-width="2"/><text x="54" y="1313" font-size="33" fill="#705515" font-weight="700">上游修订后</text><text x="54" y="1363" font-size="33" fill="#705515" font-weight="700">沿依赖检查下游</text></g></svg>