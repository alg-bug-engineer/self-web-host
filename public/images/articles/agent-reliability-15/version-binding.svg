<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">旧任务绑定旧定义，新默认只影响新任务</title><desc id="desc">任务保存定义摘要；执行者必须支持；仅无已提交步骤的就绪任务允许显式迁移。哈希不证明代码兼容。</desc>
<rect width="1200" height="1120" fill="white"/>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#64748b"/></marker></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="48" y="80" font-size="46" fill="#1d4ed8" font-weight="bold">升级代码，不偷换旧任务的执行语义</text>
<text x="48" y="140" font-size="30" fill="#64748b" font-weight="normal">本地定义绑定 + 能力匹配 + 显式迁移；非生产工作流引擎</text>
<rect x="48" y="204" width="520" height="240" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="76" y="264" font-size="34" fill="#1e40af" font-weight="bold">旧任务：保存 V1 摘要</text>
<text x="76" y="324" font-size="30" fill="#334155" font-weight="normal">默认切到 V2 后，仍绑定 V1</text>
<text x="76" y="378" font-size="30" fill="#334155" font-weight="normal">V1 定义与分步进度一起保留</text>
<rect x="632" y="204" width="520" height="240" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
<text x="660" y="264" font-size="34" fill="#1e40af" font-weight="bold">新任务：保存 V2 摘要</text>
<text x="660" y="324" font-size="30" fill="#334155" font-weight="normal">默认切换与受理共用事务</text>
<text x="660" y="378" font-size="30" fill="#334155" font-weight="normal">不会读完默认再分开入库</text>
<path d="M308 465 L308 512" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<path d="M892 465 L892 512" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<rect x="48" y="542" width="520" height="240" rx="24" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="76" y="602" font-size="34" fill="#1e40af" font-weight="bold">支持 V1 的 worker 执行</text>
<text x="76" y="662" font-size="30" fill="#334155" font-weight="normal">每步核对绑定 / 代次 / 游标</text>
<text x="76" y="716" font-size="30" fill="#334155" font-weight="normal">本地效果与进度同事务提交</text>
<rect x="632" y="542" width="520" height="240" rx="24" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="660" y="602" font-size="34" fill="#1e40af" font-weight="bold">支持 V2 的 worker 执行</text>
<text x="660" y="662" font-size="30" fill="#334155" font-weight="normal">不把 V2 步序套在旧游标上</text>
<text x="660" y="716" font-size="30" fill="#334155" font-weight="normal">缺旧版能力时等待，不猜测</text>
<rect x="48" y="832" width="1104" height="220" rx="24" fill="#fef9c3" stroke="#fde68a" stroke-width="2"/>
<text x="76" y="892" font-size="34" fill="#1e40af" font-weight="bold">显式迁移只接受 ready 且 cursor = 0</text>
<text x="76" y="952" font-size="30" fill="#334155" font-weight="normal">校验预期绑定版本；变更绑定与审计同事务。部分执行则拒绝。</text>
<text x="76" y="1006" font-size="30" fill="#334155" font-weight="normal">摘要不证明代码兼容；本例不覆盖远端副作用和真实迁移授权。</text>
</g></svg>