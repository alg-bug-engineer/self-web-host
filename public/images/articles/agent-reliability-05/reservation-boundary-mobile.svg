<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1190" viewBox="0 0 540 1190" role="img" aria-labelledby="title desc">
<title id="title">预留、派发与效果|不是同一个数字</title><desc id="desc">本地事务实验 · 合成工单</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="30" fill="#334155">
<text x="30" y="62" font-size="34" fill="#1768b5" font-weight="700">预留、派发与效果</text>
<text x="30" y="110" font-size="34" fill="#1768b5" font-weight="700">不是同一个数字</text>
<text x="30" y="162">本地事务实验 · 合成工单</text>
<rect x="30" y="204" width="480" height="212" rx="18" fill="#eaf4ff" stroke="#a8cff4" stroke-width="2"/>
<text x="50" y="251" font-size="30" fill="#1768b5" font-weight="700">1 先提交预留</text>
<text x="50" y="302">上限检查 + 增加计数</text>
<text x="50" y="345">写入本次预留记录</text>
<path d="M270 423 v24 m-9 -9 9 9 9 -9" stroke="#63809d" stroke-width="3" fill="none"/>
<rect x="30" y="455" width="480" height="212" rx="18" fill="#e8f8f5" stroke="#90cfc3" stroke-width="2"/>
<text x="50" y="502" font-size="30" fill="#1768b5" font-weight="700">2 再进入接收端</text>
<text x="50" y="553">同一意图可以重放</text>
<text x="50" y="596">业务效果由接收端去重</text>
<path d="M270 674 v24 m-9 -9 9 9 9 -9" stroke="#63809d" stroke-width="3" fill="none"/>
<rect x="30" y="706" width="480" height="212" rx="18" fill="#fff0ee" stroke="#e8b2a9" stroke-width="2"/>
<text x="50" y="753" font-size="30" fill="#1768b5" font-weight="700">3 最后记录确认</text>
<text x="50" y="804">缺确认不能证明没发</text>
<text x="50" y="847">旧预留不能重复使用</text>
<rect x="30" y="990" width="480" height="150" rx="16" fill="#fff5c7" stroke="#e4cd71" stroke-width="2"/>
<text x="50" y="1037" font-size="30" fill="#615017" font-weight="700">预留后退出：可以花券却没发送</text>
<text x="50" y="1080" font-size="30" fill="#615017">上限守住，不等于任务必达</text>
</g></svg>
