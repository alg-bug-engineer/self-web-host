<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="title description"><title id="title">能否重试，先看工具契约</title><desc id="description">结果未知不等于业务失败。有接收端幂等：原 ID、原参数重放；读取已提交的相同结果。支持结果查询：先按稳定业务 ID 对账；再决定后续动作。无幂等、无查询：保留 unknown 状态；不能安全地盲目重试。需要人工核验：保存请求与尝试线索；补偿动作另按业务授权。本地日志不能替远端撤销动作。不知道时，保留可核验的不确定性</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="1080" height="750" fill="#FFFFFF"/><rect x="12" y="12" width="1056" height="726" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="66" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">能否重试，先看工具契约</text><text x="540" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">结果未知不等于业务失败</text><rect x="56" y="158" width="464" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="80" y="202" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">有接收端幂等</text><text x="80" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">原 ID、原参数重放</text><text x="80" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">读取已提交的相同结果</text><rect x="560" y="158" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="584" y="202" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">支持结果查询</text><text x="584" y="246" font-size="27" fill="#576574" text-anchor="start" font-weight="400">先按稳定业务 ID 对账</text><text x="584" y="284" font-size="27" fill="#576574" text-anchor="start" font-weight="400">再决定后续动作</text><rect x="56" y="378" width="464" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="80" y="422" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">无幂等、无查询</text><text x="80" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">保留 unknown 状态</text><text x="80" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不能安全地盲目重试</text><rect x="560" y="378" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="584" y="422" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">需要人工核验</text><text x="584" y="466" font-size="27" fill="#576574" text-anchor="start" font-weight="400">保存请求与尝试线索</text><text x="584" y="504" font-size="27" fill="#576574" text-anchor="start" font-weight="400">补偿动作另按业务授权</text><rect x="40" y="620" width="1000" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="660" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">本地日志不能替远端撤销动作</text><text x="540" y="699" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">不知道时，保留可核验的不确定性</text></g></svg>
