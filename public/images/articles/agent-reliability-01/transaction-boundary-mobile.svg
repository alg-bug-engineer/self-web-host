<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1140" viewBox="0 0 540 1140" role="img" aria-labelledby="title description"><title id="title">意图和结果，分开记账</title><desc id="description">本地合成工单 · 独立数据库事务。发送端 / 持久意图：先保存稳定请求 ID；没有回执不等于没执行。接收端 / 同一事务：工单、参数与结果一起提交；同 ID 同参数返回旧结果。故障 / 回执丢失：接收端已提交，进程退出；调用方只知道结果未收到。恢复 / 原 ID 重放：不生成新的业务意图；参数冲突必须拒绝。outbox 保住意图，不包办远端去重。事务边界之外仍需明确契约</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="540" height="1140" fill="#FFFFFF"/><rect x="12" y="12" width="516" height="1116" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="66" font-size="31" fill="#2387DE" text-anchor="middle" font-weight="600">意图和结果，分开记账</text><text x="270" y="112" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">本地合成工单 · 独立数据库事务</text><rect x="40" y="153" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="197" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">发送端 / 持久意图</text><text x="64" y="241" font-size="27" fill="#576574" text-anchor="start" font-weight="400">先保存稳定请求 ID</text><text x="64" y="279" font-size="27" fill="#576574" text-anchor="start" font-weight="400">没有回执不等于没执行</text><path d="M270 331 V352" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="360" width="460" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="64" y="404" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">接收端 / 同一事务</text><text x="64" y="448" font-size="27" fill="#576574" text-anchor="start" font-weight="400">工单、参数与结果一起提交</text><text x="64" y="486" font-size="27" fill="#576574" text-anchor="start" font-weight="400">同 ID 同参数返回旧结果</text><path d="M270 538 V559" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="567" width="460" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="64" y="611" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">故障 / 回执丢失</text><text x="64" y="655" font-size="27" fill="#576574" text-anchor="start" font-weight="400">接收端已提交，进程退出</text><text x="64" y="693" font-size="27" fill="#576574" text-anchor="start" font-weight="400">调用方只知道结果未收到</text><path d="M270 745 V766" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="774" width="460" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="64" y="818" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">恢复 / 原 ID 重放</text><text x="64" y="862" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不生成新的业务意图</text><text x="64" y="900" font-size="27" fill="#576574" text-anchor="start" font-weight="400">参数冲突必须拒绝</text><rect x="40" y="1000" width="460" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="270" y="1040" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">outbox 保住意图，不包办远端去重</text><text x="270" y="1079" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">事务边界之外仍需明确契约</text></g></svg>
