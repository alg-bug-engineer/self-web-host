<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1200" viewBox="0 0 540 1200" role="img" aria-labelledby="title description"><title id="title">性能优化验收约定移动版</title><desc id="description">先固定终点，分辨工作减少或延后，保留兼容入口，再验收。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="60" font-size="32" fill="#1d4ed8" font-weight="700">优化前，先写完整车票</text><text x="28" y="104" font-size="30" fill="#64748b" font-weight="400">作者分析 · 不替代应用测试</text><rect x="28" y="145" width="484" height="184" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="50" y="190" font-size="30" fill="#334155" font-weight="700">01  谁在等待？</text><text x="50" y="240" font-size="30" fill="#334155" font-weight="400">冷进程 / 长驻进程</text><text x="50" y="283" font-size="30" fill="#334155" font-weight="400">等到哪一个完成事件？</text><path d="M270 339 L270 358" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="369" width="484" height="184" rx="20" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/><text x="50" y="414" font-size="30" fill="#334155" font-weight="700">02  工作去了哪里？</text><text x="50" y="464" font-size="30" fill="#334155" font-weight="400">真正省掉 / 延后执行</text><text x="50" y="507" font-size="30" fill="#334155" font-weight="400">是否在目标负载兑现？</text><path d="M270 563 L270 582" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="593" width="484" height="184" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="50" y="638" font-size="30" fill="#334155" font-weight="700">03  哪些入口要保留？</text><text x="50" y="688" font-size="30" fill="#334155" font-weight="400">模块名称与替换位置</text><text x="50" y="731" font-size="30" fill="#334155" font-weight="400">由支持范围决定兼容约定</text><path d="M270 787 L270 806" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="817" width="484" height="184" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="50" y="862" font-size="30" fill="#334155" font-weight="700">04  怎样确认收益？</text><text x="50" y="912" font-size="30" fill="#334155" font-weight="400">端到端计时 + 兼容测试</text><text x="50" y="955" font-size="30" fill="#334155" font-weight="400">交代未改善的路径</text><rect x="28" y="1050" width="484" height="116" rx="20" fill="#FFFAE7" stroke="#fcd34d" stroke-width="2"/><text x="50" y="1095" font-size="30" fill="#854d0e" font-weight="700">局部快了，整体还要验</text><text x="50" y="1138" font-size="30" fill="#713f12" font-weight="400">保留没有改善的数字</text></g></svg>