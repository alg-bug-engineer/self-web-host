<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" role="img" aria-labelledby="title description"><title id="title">启动计时终点</title><desc id="description">项目报告冷导入更快，首次请求基本持平；框宽不代表比例。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="75" font-size="42" fill="#1d4ed8" font-weight="700">启动快了，秒表停在哪里？</text><text x="48" y="128" font-size="28" fill="#64748b" font-weight="400">ADK 1754b3e · 项目方报告，非本文实测</text><rect x="48" y="175" width="448" height="205" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="74" y="224" font-size="32" fill="#334155" font-weight="700">终点 A：导入包完成</text><text x="74" y="280" font-size="40" fill="#1d4ed8" font-weight="700">1.22 s → 0.97 s</text><text x="74" y="335" font-size="30" fill="#334155" font-weight="400">约减少 21%</text><rect x="584" y="175" width="448" height="205" rx="20" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/><text x="610" y="224" font-size="30" fill="#334155" font-weight="700">终点 B：首次模型请求</text><text x="610" y="280" font-size="40" fill="#0f766e" font-weight="700">3.07 s → 3.09 s</text><text x="610" y="335" font-size="30" fill="#334155" font-weight="400">没有显示提速</text><path d="M505 278 L574 278" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="425" width="984" height="150" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="76" y="475" font-size="32" fill="#334155" font-weight="700">懒加载：部分工作推迟到真正使用时</text><text x="76" y="525" font-size="32" fill="#334155" font-weight="400">导入结束 ≠ 请求发出 ≠ 收到答案</text><path d="M808 390 L808 414" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="625" width="984" height="125" rx="20" fill="#FFFAE7" stroke="#fcd34d" stroke-width="2"/><text x="76" y="674" font-size="34" fill="#854d0e" font-weight="700">先约定等待终点，再谈提速</text><text x="76" y="720" font-size="27" fill="#713f12" font-weight="400">框宽不代表耗时；不同基准不可相减为分段实测</text></g></svg>