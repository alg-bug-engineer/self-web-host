<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" role="img" aria-labelledby="title description"><title id="title">性能优化验收约定</title><desc id="description">计时终点、工作位置、兼容入口与目标负载须共同审查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="75" font-size="42" fill="#1d4ed8" font-weight="700">给性能改动写一张完整车票</text><text x="48" y="128" font-size="28" fill="#64748b" font-weight="400">作者提出的验收约定 · 不是官方流程或无回归保证</text><rect x="48" y="185" width="470" height="195" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="72" y="233" font-size="30" fill="#334155" font-weight="700">01  谁在等待？</text><text x="72" y="288" font-size="28" fill="#334155" font-weight="400">冷进程 / 长驻进程</text><text x="72" y="332" font-size="28" fill="#334155" font-weight="400">等到哪一个完成事件？</text><rect x="562" y="185" width="470" height="195" rx="20" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/><text x="586" y="233" font-size="30" fill="#334155" font-weight="700">02  工作去了哪里？</text><text x="586" y="288" font-size="28" fill="#334155" font-weight="400">真正省掉 / 延后执行</text><text x="586" y="332" font-size="28" fill="#334155" font-weight="400">是否在目标负载兑现？</text><rect x="48" y="445" width="470" height="195" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="72" y="493" font-size="30" fill="#334155" font-weight="700">03  哪些入口要保留？</text><text x="72" y="548" font-size="28" fill="#334155" font-weight="400">模块名称与替换位置</text><text x="72" y="592" font-size="28" fill="#334155" font-weight="400">由支持范围决定兼容约定</text><rect x="562" y="445" width="470" height="195" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="586" y="493" font-size="30" fill="#334155" font-weight="700">04  怎样确认收益？</text><text x="586" y="548" font-size="28" fill="#334155" font-weight="400">端到端计时 + 兼容测试</text><text x="586" y="592" font-size="28" fill="#334155" font-weight="400">交代未改善的路径</text><path d="M527 282 L552 282" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M797 393 L797 412 L283 412 L283 433" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M527 540 L552 540" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="700" width="984" height="125" rx="20" fill="#FFFAE7" stroke="#fcd34d" stroke-width="2"/><text x="76" y="750" font-size="32" fill="#854d0e" font-weight="700">局部收益可以成立，整体收益仍需自己的证据</text><text x="76" y="793" font-size="27" fill="#713f12" font-weight="400">保留没有改善的数字，才知道优化停在了哪一站</text></g></svg>