<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1100" viewBox="0 0 540 1100" role="img" aria-labelledby="title description"><title id="title">启动计时终点移动版</title><desc id="description">项目报告数据，非本文实测；导入与首次请求计时终点不同。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="61" font-size="34" fill="#1d4ed8" font-weight="700">秒表停在哪里？</text><text x="28" y="106" font-size="30" fill="#64748b" font-weight="400">ADK 1754b3e · 项目方报告</text><rect x="28" y="145" width="484" height="210" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="50" y="193" font-size="30" fill="#334155" font-weight="700">终点 A：导入包完成</text><text x="50" y="256" font-size="38" fill="#1d4ed8" font-weight="700">1.22 s → 0.97 s</text><text x="50" y="314" font-size="30" fill="#334155" font-weight="400">约减少 21%</text><path d="M270 368 L270 408" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="424" width="484" height="210" rx="20" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/><text x="50" y="472" font-size="30" fill="#334155" font-weight="700">终点 B：首次模型请求</text><text x="50" y="535" font-size="38" fill="#0f766e" font-weight="700">3.07 s → 3.09 s</text><text x="50" y="590" font-size="30" fill="#334155" font-weight="400">没有显示提速</text><rect x="28" y="680" width="484" height="180" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="50" y="726" font-size="30" fill="#334155" font-weight="700">懒加载将部分工作延后</text><text x="50" y="778" font-size="30" fill="#334155" font-weight="400">首次请求仍不是收到答案</text><text x="50" y="824" font-size="30" fill="#334155" font-weight="400">框宽不代表耗时比例</text><rect x="28" y="905" width="484" height="150" rx="20" fill="#FFFAE7" stroke="#fcd34d" stroke-width="2"/><text x="50" y="951" font-size="30" fill="#854d0e" font-weight="700">先约定终点，再谈提速</text><text x="50" y="997" font-size="30" fill="#713f12" font-weight="400">不同基准不可相减为</text><text x="50" y="1032" font-size="30" fill="#713f12" font-weight="400">经过验证的分阶段耗时</text></g></svg>