<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img" aria-labelledby="title desc"><title id="title">给审核的人留出时间</title><desc id="desc">原创建议示意，无实测数据。需要人工接手的结果进入待审队列，附依据与问题，按紧急程度和人的可用时间接手，确认后交付。队列拥堵时可暂缓非紧急任务。自动验收任务可另行处理。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6695BA"/></marker></defs><rect width="1080" height="920" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540.0" y="65" font-size="44" fill="#2387DE" text-anchor="middle" font-weight="600">给审核的人留出时间</text><text x="540.0" y="114" font-size="27" fill="#788797" text-anchor="middle" font-weight="400">作者建议 · 非实测流程</text><rect x="40" y="160" width="310" height="130" rx="18" fill="#EAF5FF" stroke="#94BFE5"/><text x="64" y="208" font-size="31" fill="#236FB8" text-anchor="start" font-weight="600">任务 A</text><text x="64" y="257" font-size="28" fill="#536579" text-anchor="start" font-weight="400">生成完成 ≠ 交付</text><rect x="385" y="160" width="310" height="130" rx="18" fill="#EAF5FF" stroke="#94BFE5"/><text x="409" y="208" font-size="31" fill="#236FB8" text-anchor="start" font-weight="600">任务 B</text><text x="409" y="257" font-size="28" fill="#536579" text-anchor="start" font-weight="400">生成完成 ≠ 交付</text><rect x="730" y="160" width="310" height="130" rx="18" fill="#EAF5FF" stroke="#94BFE5"/><text x="754" y="208" font-size="31" fill="#236FB8" text-anchor="start" font-weight="600">任务 C</text><text x="754" y="257" font-size="28" fill="#536579" text-anchor="start" font-weight="400">生成完成 ≠ 交付</text><path d="M195 301 L195 348" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 301 L540 348" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><path d="M885 301 L885 348" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="365" width="1000" height="176" rx="18" fill="#FFF0F1" stroke="#DCA6AB"/><text x="64" y="413" font-size="31" fill="#A84E5C" text-anchor="start" font-weight="600">待审队列</text><text x="64" y="462" font-size="28" fill="#536579" text-anchor="start" font-weight="400">附上依据与未决问题；区分紧急程度与截止时间</text><text x="64" y="506" font-size="28" fill="#536579" text-anchor="start" font-weight="400">队列拥堵时，可暂缓新的非紧急任务</text><path d="M270 552 L270 593" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="610" width="460" height="180" rx="18" fill="#EAF5FF" stroke="#94BFE5"/><text x="64" y="658" font-size="31" fill="#236FB8" text-anchor="start" font-weight="600">安排人的接手时间</text><text x="64" y="707" font-size="28" fill="#536579" text-anchor="start" font-weight="400">普通结果集中处理</text><text x="64" y="751" font-size="28" fill="#536579" text-anchor="start" font-weight="400">紧急异常按约定升级</text><path d="M511 700 L562 700" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="610" width="460" height="180" rx="18" fill="#EAF8F4" stroke="#9BCFBD"/><text x="604" y="658" font-size="31" fill="#297A68" text-anchor="start" font-weight="600">确认可交付</text><text x="604" y="707" font-size="28" fill="#536579" text-anchor="start" font-weight="400">查看依据，作出判断</text><text x="604" y="751" font-size="28" fill="#536579" text-anchor="start" font-weight="400">需要修改则继续处理</text><rect x="40" y="827" width="1000" height="65" rx="15" fill="#FFF8DC" stroke="#E2CC75"/><text x="540" y="870" font-size="30" fill="#916623" text-anchor="middle" font-weight="600">生成、待审、交付分别记录；人的注意力也需要排班</text></g></svg>