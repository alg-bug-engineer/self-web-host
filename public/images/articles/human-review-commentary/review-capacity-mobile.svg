<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1450" viewBox="0 0 540 1450" role="img" aria-labelledby="title desc"><title id="title">给审核的人留出时间</title><desc id="desc">原创建议示意，无实测数据。需要人工接手的结果进入待审队列，附依据与问题，按紧急程度和人的可用时间接手，确认后交付。队列拥堵时可暂缓非紧急任务。自动验收任务可另行处理。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6695BA"/></marker></defs><rect width="540" height="1450" fill="white"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270.0" y="65" font-size="34" fill="#2387DE" text-anchor="middle" font-weight="600">给审核的人留出时间</text><text x="270.0" y="114" font-size="27" fill="#788797" text-anchor="middle" font-weight="400">作者建议 · 非实测流程</text><rect x="40" y="155" width="460" height="192" rx="18" fill="#EAF5FF" stroke="#94BFE5"/><text x="64" y="203" font-size="31" fill="#236FB8" text-anchor="start" font-weight="600">多项任务可以并行</text><text x="64" y="252" font-size="28" fill="#536579" text-anchor="start" font-weight="400">完成生成后，仍可能待审</text><text x="64" y="296" font-size="28" fill="#536579" text-anchor="start" font-weight="400">需要人接手的结果先排队</text><path d="M270 359 L270 397" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="412" width="460" height="236" rx="18" fill="#FFF0F1" stroke="#DCA6AB"/><text x="64" y="460" font-size="31" fill="#A84E5C" text-anchor="start" font-weight="600">待审队列</text><text x="64" y="509" font-size="28" fill="#536579" text-anchor="start" font-weight="400">附上依据与未决问题</text><text x="64" y="553" font-size="28" fill="#536579" text-anchor="start" font-weight="400">区分紧急程度与截止时间</text><text x="64" y="597" font-size="28" fill="#536579" text-anchor="start" font-weight="400">拥堵时暂缓非紧急新任务</text><path d="M270 660 L270 698" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="713" width="460" height="192" rx="18" fill="#EAF5FF" stroke="#94BFE5"/><text x="64" y="761" font-size="31" fill="#236FB8" text-anchor="start" font-weight="600">安排人的接手时间</text><text x="64" y="810" font-size="28" fill="#536579" text-anchor="start" font-weight="400">普通结果集中处理</text><text x="64" y="854" font-size="28" fill="#536579" text-anchor="start" font-weight="400">紧急异常按约定升级</text><path d="M270 917 L270 955" fill="none" stroke="#6695BA" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="970" width="460" height="192" rx="18" fill="#EAF8F4" stroke="#9BCFBD"/><text x="64" y="1018" font-size="31" fill="#297A68" text-anchor="start" font-weight="600">确认可交付</text><text x="64" y="1067" font-size="28" fill="#536579" text-anchor="start" font-weight="400">查看依据，作出判断</text><text x="64" y="1111" font-size="28" fill="#536579" text-anchor="start" font-weight="400">需要修改则继续处理</text><rect x="40" y="1210" width="460" height="190" rx="18" fill="#FFF8DC" stroke="#E2CC75"/><text x="270" y="1256" font-size="29" fill="#916623" text-anchor="middle" font-weight="600">生成、待审、交付</text><text x="270" y="1301" font-size="29" fill="#916623" text-anchor="middle" font-weight="600">分别记录，分别安排</text><text x="270" y="1353" font-size="29" fill="#916623" text-anchor="middle" font-weight="600">人的注意力也需要排班</text></g></svg>