<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1752" viewBox="0 0 540 1752" role="img" aria-labelledby="title desc">
<title id="title">到达乱序，应用有序</title>
<desc id="desc">合成工作流事件定义为 1=reserved（预留）、2=confirmed（确认）、3=released（释放），实际按 3、1、2 到达。3 先持久入 inbox 等待，last_seq 为 0；1 到达后应用 1，last_seq 为 1；2 到达后依次应用 2 和 3，最终 released 且 last_seq 为 3。只应用 next_seq=last_seq+1。事件 2 缺失或其 schema 版本未知时，该工作流等待，其他工作流可独立推进。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="64" font-size="36" fill="#1d4ed8" font-weight="700">到达乱序，应用有序</text><text x="32" y="111" font-size="30" fill="#64748b" font-weight="400">合成事件：预留 → 确认 → 释放</text><rect x="32" y="150" width="476" height="286" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="56" y="196" font-size="32" fill="#1d4ed8" font-weight="700">先收到 3 / released</text><text x="56" y="238" font-size="30" fill="#1e3a5f" font-weight="400">3 入库后先等待</text><text x="56" y="280" font-size="30" fill="#1e3a5f" font-weight="400">last_seq = 0</text><text x="56" y="322" font-size="30" fill="#1e3a5f" font-weight="400">缺 1，不能应用 3</text><rect x="126" y="354" width="82" height="56" rx="10" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="167.0" y="393" font-size="32" fill="#64748b" font-weight="700" text-anchor="middle">1</text><rect x="228" y="354" width="82" height="56" rx="10" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="269.0" y="393" font-size="32" fill="#64748b" font-weight="700" text-anchor="middle">2</text><rect x="330" y="354" width="82" height="56" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="371.0" y="393" font-size="32" fill="#1d4ed8" font-weight="700" text-anchor="middle">3</text><path d="M270 437 L270 467" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="32" y="474" width="476" height="286" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="56" y="520" font-size="32" fill="#1d4ed8" font-weight="700">再收到 1 / reserved</text><text x="56" y="562" font-size="30" fill="#1e3a5f" font-weight="400">应用 1：预留</text><text x="56" y="604" font-size="30" fill="#1e3a5f" font-weight="400">last_seq = 1</text><text x="56" y="646" font-size="30" fill="#1e3a5f" font-weight="400">3 仍等待 2</text><rect x="126" y="678" width="82" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="167.0" y="717" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">1</text><rect x="228" y="678" width="82" height="56" rx="10" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="269.0" y="717" font-size="32" fill="#64748b" font-weight="700" text-anchor="middle">2</text><rect x="330" y="678" width="82" height="56" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="371.0" y="717" font-size="32" fill="#1d4ed8" font-weight="700" text-anchor="middle">3</text><path d="M270 761 L270 791" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="32" y="798" width="476" height="286" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="56" y="844" font-size="32" fill="#166534" font-weight="700">最后收到 2 / confirmed</text><text x="56" y="886" font-size="30" fill="#1e3a5f" font-weight="400">依次应用 2 → 3</text><text x="56" y="928" font-size="30" fill="#1e3a5f" font-weight="400">last_seq = 3</text><text x="56" y="970" font-size="30" fill="#1e3a5f" font-weight="400">最终状态：released</text><rect x="126" y="1002" width="82" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="167.0" y="1041" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">1</text><rect x="228" y="1002" width="82" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="269.0" y="1041" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">2</text><rect x="330" y="1002" width="82" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="371.0" y="1041" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">3</text><text x="32" y="1130" font-size="30" fill="#64748b" font-weight="400">绿色已应用 · 蓝色已收件</text><text x="32" y="1175" font-size="30" fill="#64748b" font-weight="400">虚线：尚未收到</text><rect x="32" y="1208" width="476" height="178" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="56" y="1252" font-size="32" fill="#9f1239" font-weight="700">流程 A：卡在序号 2</text><text x="56" y="1301" font-size="30" fill="#1e3a5f" font-weight="400">2 缺失 / schema 未知</text><text x="56" y="1350" font-size="30" fill="#1e3a5f" font-weight="400">后续 3 继续等待</text><rect x="32" y="1418" width="476" height="150" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="56" y="1464" font-size="32" fill="#166534" font-weight="700">流程 B：独立推进</text><text x="56" y="1517" font-size="30" fill="#1e3a5f" font-weight="400">只检查自己的连续序号</text><rect x="32" y="1600" width="476" height="120" rx="16" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="56" y="1648" font-size="30" fill="#713f12" font-weight="600">只应用 last_seq + 1</text><text x="56" y="1694" font-size="30" fill="#713f12" font-weight="600">缺口未补，就不跳步</text>
</g></svg>
