<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="996" viewBox="0 0 1080 996" role="img" aria-labelledby="title desc">
<title id="title">乱序到达，按连续序号应用</title>
<desc id="desc">合成工作流事件定义为 1=reserved（预留）、2=confirmed（确认）、3=released（释放），实际按 3、1、2 到达。3 先持久入 inbox 等待，last_seq 为 0；1 到达后应用 1，last_seq 为 1；2 到达后依次应用 2 和 3，最终 released 且 last_seq 为 3。只应用 next_seq=last_seq+1。事件 2 缺失或其 schema 版本未知时，该工作流等待，其他工作流可独立推进。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="64" font-size="42" fill="#1d4ed8" font-weight="700">乱序到达，按连续序号应用</text><text x="32" y="111" font-size="30" fill="#64748b" font-weight="400">合成事件：1 预留 → 2 确认 → 3 释放</text><rect x="32" y="174" width="320" height="360" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="56" y="220" font-size="32" fill="#1d4ed8" font-weight="700">先收到 3</text><text x="56" y="266" font-size="30" fill="#1e3a5f" font-weight="400">3 入库后先等待</text><text x="56" y="310" font-size="30" fill="#1e3a5f" font-weight="400">last_seq = 0</text><text x="56" y="354" font-size="30" fill="#1e3a5f" font-weight="400">缺 1，先不应用</text><rect x="56" y="450" width="76" height="56" rx="10" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="94.0" y="489" font-size="32" fill="#64748b" font-weight="700" text-anchor="middle">1</text><rect x="147" y="450" width="76" height="56" rx="10" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="185.0" y="489" font-size="32" fill="#64748b" font-weight="700" text-anchor="middle">2</text><rect x="238" y="450" width="76" height="56" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="276.0" y="489" font-size="32" fill="#1d4ed8" font-weight="700" text-anchor="middle">3</text><rect x="380" y="174" width="320" height="360" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="404" y="220" font-size="32" fill="#1d4ed8" font-weight="700">再收到 1</text><text x="404" y="266" font-size="30" fill="#1e3a5f" font-weight="400">应用 1：reserved</text><text x="404" y="310" font-size="30" fill="#1e3a5f" font-weight="400">last_seq = 1</text><text x="404" y="354" font-size="30" fill="#1e3a5f" font-weight="400">3 仍等待 2</text><rect x="404" y="450" width="76" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="442.0" y="489" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">1</text><rect x="495" y="450" width="76" height="56" rx="10" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="533.0" y="489" font-size="32" fill="#64748b" font-weight="700" text-anchor="middle">2</text><rect x="586" y="450" width="76" height="56" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="624.0" y="489" font-size="32" fill="#1d4ed8" font-weight="700" text-anchor="middle">3</text><rect x="728" y="174" width="320" height="360" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="752" y="220" font-size="32" fill="#166534" font-weight="700">最后收到 2</text><text x="752" y="266" font-size="30" fill="#1e3a5f" font-weight="400">依次应用 2 → 3</text><text x="752" y="310" font-size="30" fill="#1e3a5f" font-weight="400">last_seq = 3</text><text x="752" y="354" font-size="30" fill="#1e3a5f" font-weight="400">状态：released</text><rect x="752" y="450" width="76" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="790.0" y="489" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">1</text><rect x="843" y="450" width="76" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="881.0" y="489" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">2</text><rect x="934" y="450" width="76" height="56" rx="10" fill="#dcfce7" stroke="#86cba2" stroke-width="2"/><text x="972.0" y="489" font-size="32" fill="#166534" font-weight="700" text-anchor="middle">3</text><path d="M353 352 L374 352" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><path d="M701 352 L722 352" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><text x="66" y="588" font-size="28" fill="#166534" font-weight="400">绿色：已应用</text><text x="361" y="588" font-size="28" fill="#1d4ed8" font-weight="400">蓝色：已收件</text><text x="685" y="588" font-size="28" fill="#64748b" font-weight="400">虚线：尚未收到</text><rect x="32" y="628" width="490" height="190" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="56" y="674" font-size="32" fill="#9f1239" font-weight="700">流程 A 卡在序号 2</text><text x="56" y="726" font-size="28" fill="#1e3a5f" font-weight="400">2 缺失 / schema 版本未知</text><text x="56" y="776" font-size="30" fill="#1e3a5f" font-weight="400">后续 3 继续等待</text><rect x="558" y="628" width="490" height="190" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="582" y="674" font-size="32" fill="#166534" font-weight="700">流程 B 独立推进</text><text x="582" y="726" font-size="30" fill="#1e3a5f" font-weight="400">只检查自己的连续序号</text><text x="582" y="776" font-size="30" fill="#1e3a5f" font-weight="400">不被 A 的缺口阻塞</text><rect x="32" y="858" width="1016" height="106" rx="16" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="56" y="901" font-size="30" fill="#713f12" font-weight="600">只应用 next_seq = last_seq + 1</text><text x="56" y="944" font-size="30" fill="#713f12" font-weight="600">不跳过缺口，不把高序号当成已完成</text>
</g></svg>
