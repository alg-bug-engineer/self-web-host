<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="940" viewBox="0 0 1080 940" role="img" aria-labelledby="title desc">
<title id="title">三个核心事务边界</title>
<desc id="desc">生产端 producer.db 与消费端 consumer.db 是两个独立 SQLite 文件，没有跨库原子事务。生产事务同时提交工作流状态和 Outbox 事件。Relay 可能重复投递。收件事务持久化 inbox 后才 ACK，ACK 仅代表已接收；独立的应用事务按序原子更新本地投影、执行历史和 inbox 状态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="64" font-size="42" fill="#1d4ed8" font-weight="700">三个核心事务边界</text><text x="32" y="111" font-size="30" fill="#64748b" font-weight="400">生产、收件、应用：只保证各自数据库内原子性</text><rect x="32" y="156" width="420" height="550" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="55" y="202" font-size="30" fill="#1d4ed8" font-weight="600">生产端 · producer.db</text><rect x="56" y="232" width="372" height="360" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="80" y="279" font-size="32" fill="#1d4ed8" font-weight="700">① 生产事务</text><rect x="80" y="309" width="324" height="76" rx="12" fill="white" stroke="#bfdbfe" stroke-width="2"/><text x="242" y="358" font-size="30" fill="#1e3a5f" font-weight="400" text-anchor="middle">工作流状态</text><text x="242" y="423" font-size="36" fill="#1d4ed8" font-weight="700" text-anchor="middle">+</text><rect x="80" y="449" width="324" height="76" rx="12" fill="white" stroke="#bfdbfe" stroke-width="2"/><text x="242" y="498" font-size="30" fill="#1e3a5f" font-weight="400" text-anchor="middle">Outbox 事件</text><text x="242" y="568" font-size="30" fill="#1d4ed8" font-weight="600" text-anchor="middle">一起提交</text><text x="242" y="651" font-size="30" fill="#64748b" font-weight="500" text-anchor="middle">同成同败</text><path d="M429 392 L462 392" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="467" y="319" width="136" height="148" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="535" y="367" font-size="32" fill="#1d4ed8" font-weight="600" text-anchor="middle">Relay</text><text x="535" y="418" font-size="30" fill="#1e3a5f" font-weight="400" text-anchor="middle">可重发</text><path d="M604 392 L637 392" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="618" y="156" width="430" height="550" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="640" y="202" font-size="30" fill="#1d4ed8" font-weight="600">消费端 · consumer.db</text><rect x="642" y="232" width="382" height="192" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="666" y="278" font-size="32" fill="#1d4ed8" font-weight="700">② 收件事务</text><text x="666" y="329" font-size="30" fill="#1e3a5f" font-weight="400">inbox 持久入库</text><text x="666" y="379" font-size="30" fill="#1e3a5f" font-weight="400">提交后才 ACK</text><path d="M833 425 L833 477" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><text x="1007" y="458" font-size="27" fill="#64748b" font-weight="400" text-anchor="end">按序取件</text><rect x="642" y="485" width="382" height="197" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="666" y="531" font-size="32" fill="#166534" font-weight="700">③ 应用事务</text><text x="666" y="576" font-size="30" fill="#1e3a5f" font-weight="400">投影 + 执行历史</text><text x="666" y="618" font-size="30" fill="#1e3a5f" font-weight="400">inbox → applied</text><text x="666" y="660" font-size="28" fill="#166534" font-weight="600">同一事务提交</text><path d="M604 392 L637 392" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="32" y="736" width="1016" height="78" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="540" y="786" font-size="32" fill="#9f1239" font-weight="600" text-anchor="middle">ACK = 已接收；不代表业务已应用</text><rect x="32" y="846" width="1016" height="70" rx="16" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="540" y="891" font-size="30" fill="#713f12" font-weight="600" text-anchor="middle">两份 SQLite 文件，没有跨库原子事务</text>
</g></svg>
