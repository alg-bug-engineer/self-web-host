<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1520" viewBox="0 0 540 1520" role="img" aria-labelledby="title desc">
<title id="title">三个核心事务边界</title>
<desc id="desc">生产端 producer.db 与消费端 consumer.db 是两个独立 SQLite 文件，没有跨库原子事务。生产事务同时提交工作流状态和 Outbox 事件。Relay 可能重复投递。收件事务持久化 inbox 后才 ACK，ACK 仅代表已接收；独立的应用事务按序原子更新本地投影、执行历史和 inbox 状态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="64" font-size="36" fill="#1d4ed8" font-weight="700">三个核心事务边界</text><text x="32" y="111" font-size="30" fill="#64748b" font-weight="400">两个独立 SQLite 文件</text><rect x="32" y="158" width="476" height="352" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="54" y="205" font-size="30" fill="#1d4ed8" font-weight="600">生产端 · producer.db</text><rect x="52" y="226" width="436" height="260" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="76" y="271" font-size="32" fill="#1d4ed8" font-weight="700">① 生产事务</text><text x="76" y="323" font-size="32" fill="#1e3a5f" font-weight="400">工作流状态</text><text x="76" y="371" font-size="32" fill="#1e3a5f" font-weight="400">+ Outbox 事件</text><rect x="76" y="398" width="388" height="62" rx="12" fill="white" stroke="#bfdbfe" stroke-width="2"/><text x="270" y="441" font-size="30" fill="#1d4ed8" font-weight="600" text-anchor="middle">同一事务提交</text><path d="M270 511 L270 554" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="118" y="564" width="304" height="92" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="270" y="623" font-size="32" fill="#1d4ed8" font-weight="600" text-anchor="middle">Relay 可重发</text><path d="M270 657 L270 704" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="32" y="716" width="476" height="620" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="54" y="763" font-size="30" fill="#1d4ed8" font-weight="600">消费端 · consumer.db</text><rect x="52" y="786" width="436" height="232" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="76" y="831" font-size="32" fill="#1d4ed8" font-weight="700">② 收件事务</text><text x="76" y="881" font-size="30" fill="#1e3a5f" font-weight="400">inbox 持久入库</text><text x="76" y="928" font-size="30" fill="#1e3a5f" font-weight="400">提交后才 ACK</text><text x="76" y="979" font-size="30" fill="#9f1239" font-weight="600">ACK：已收，未必应用</text><path d="M270 1019 L270 1061" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="52" y="1072" width="436" height="240" rx="18" fill="#ecfdf5" stroke="#86cba2" stroke-width="2"/><text x="76" y="1118" font-size="32" fill="#166534" font-weight="700">③ 按序应用事务</text><text x="76" y="1170" font-size="30" fill="#1e3a5f" font-weight="400">投影 + 执行历史</text><text x="76" y="1220" font-size="30" fill="#1e3a5f" font-weight="400">inbox → applied</text><text x="76" y="1272" font-size="30" fill="#166534" font-weight="600">三项一起提交</text><rect x="32" y="1372" width="476" height="116" rx="16" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="56" y="1419" font-size="30" fill="#713f12" font-weight="600">本地原子提交</text><text x="56" y="1465" font-size="30" fill="#713f12" font-weight="600">没有跨库原子事务</text>
</g></svg>
