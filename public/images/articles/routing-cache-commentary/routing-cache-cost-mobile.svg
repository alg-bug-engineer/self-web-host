<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1640" viewBox="0 0 540 1640" role="img" aria-labelledby="title description">
<title id="title">切换模型，也要算搬家费</title><desc id="description">长会话逐轮换模时，若目标模型没有可用缓存，就要重读历史前缀；后续工作省下的费用能否覆盖重建，需要按整项任务核对。新任务或独立短请求可以在任务边界选择模型，并按质量、费用与耗时评估整项任务。作者机制示意，不是实测成本比较。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker></defs>
<rect width="540" height="1640" fill="#FFFFFF"/><rect x="12" y="12" width="516" height="1616" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="66" font-size="32" fill="#2387DE" font-weight="600" text-anchor="middle">切换模型，也要算搬家费</text><text x="270" y="108" font-size="25" fill="#79838D" font-weight="400" text-anchor="middle">作者机制示意 · 不是实测对比</text><text x="40" y="163" font-size="29" fill="#AC3345" font-weight="600" text-anchor="start">长会话里逐轮换模</text><rect x="36" y="192" width="468" height="123" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="62" y="237" font-size="29" fill="#165DA2" font-weight="600" text-anchor="start">模型 A 已有长会话</text><text x="62" y="284" font-size="27" fill="#576574" font-weight="400" text-anchor="start">先前输入可能命中缓存</text><path d="M270 324 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="375" width="468" height="160" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="62" y="421" font-size="29" fill="#AC3345" font-weight="600" text-anchor="start">切到模型 B</text><text x="62" y="468" font-size="27" fill="#576574" font-weight="400" text-anchor="start">若无可用缓存</text><text x="62" y="511" font-size="27" fill="#576574" font-weight="400" text-anchor="start">历史前缀需要重新处理</text><path d="M270 544 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="595" width="468" height="126" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="62" y="641" font-size="29" fill="#165DA2" font-weight="600" text-anchor="start">后续工作够长吗？</text><text x="62" y="690" font-size="27" fill="#576574" font-weight="400" text-anchor="start">省下的费用能否覆盖重建</text><path d="M36 761 H504" stroke="#B7C0C8" stroke-dasharray="6 6"/><text x="40" y="813" font-size="29" fill="#146E73" font-weight="600" text-anchor="start">在适合的任务边界选择</text><rect x="36" y="843" width="468" height="123" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="62" y="888" font-size="29" fill="#165DA2" font-weight="600" text-anchor="start">新任务 / 独立短请求</text><text x="62" y="935" font-size="27" fill="#576574" font-weight="400" text-anchor="start">先看能力、质量与预算</text><path d="M270 975 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="1026" width="468" height="160" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="62" y="1072" font-size="29" fill="#146E73" font-weight="600" text-anchor="start">选择适合的模型</text><text x="62" y="1119" font-size="27" fill="#576574" font-weight="400" text-anchor="start">长会话继续使用时</text><text x="62" y="1162" font-size="27" fill="#576574" font-weight="400" text-anchor="start">把缓存状态纳入决策</text><path d="M270 1195 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="1246" width="468" height="162" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="62" y="1292" font-size="29" fill="#146E73" font-weight="600" text-anchor="start">按整项任务验收</text><text x="62" y="1339" font-size="27" fill="#576574" font-weight="400" text-anchor="start">质量达标后</text><text x="62" y="1382" font-size="27" fill="#576574" font-weight="400" text-anchor="start">再比较费用与耗时</text><rect x="36" y="1450" width="468" height="156" rx="14" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="270" y="1495" font-size="28" fill="#986319" font-weight="500" text-anchor="middle">单价便宜 ≠ 总任务便宜</text><text x="270" y="1539" font-size="25" fill="#986319" font-weight="400" text-anchor="middle">也不是每次切换都会亏</text><text x="270" y="1578" font-size="25" fill="#986319" font-weight="400" text-anchor="middle">先看会话、缓存和任务边界</text></g>
</svg>
