<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="936" viewBox="0 0 1080 936" role="img" aria-labelledby="title description">
<title id="title">切换模型，也要算搬家费</title><desc id="description">长会话逐轮换模时，若目标模型没有可用缓存，就要重读历史前缀；后续工作省下的费用能否覆盖重建，需要按整项任务核对。新任务或独立短请求可以在任务边界选择模型，并按质量、费用与耗时评估整项任务。作者机制示意，不是实测成本比较。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="936" fill="#FFFFFF"/><rect x="12" y="12" width="1056" height="912" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="70" font-size="42" fill="#2387DE" font-weight="600" text-anchor="middle">切换模型，也要算搬家费</text><text x="540" y="120" font-size="26" fill="#79838D" font-weight="400" text-anchor="middle">作者机制示意 · 不代表实测成本或耗时</text><text x="66" y="181" font-size="30" fill="#AC3345" font-weight="600" text-anchor="start">长会话里逐轮换模</text><text x="586" y="181" font-size="30" fill="#146E73" font-weight="600" text-anchor="start">在适合的任务边界选择</text><rect x="56" y="208" width="448" height="124" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><rect x="576" y="208" width="448" height="124" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="82" y="253" font-size="29" fill="#165DA2" font-weight="600" text-anchor="start">模型 A 已有长会话</text><text x="82" y="302" font-size="27" fill="#576574" font-weight="400" text-anchor="start">先前输入可能命中缓存</text><text x="602" y="253" font-size="29" fill="#165DA2" font-weight="600" text-anchor="start">新任务 / 独立短请求</text><text x="602" y="302" font-size="27" fill="#576574" font-weight="400" text-anchor="start">先看能力、质量与预算</text><path d="M280 340 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 340 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="390" width="448" height="164" rx="14" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="82" y="437" font-size="29" fill="#AC3345" font-weight="600" text-anchor="start">切到模型 B</text><text x="82" y="483" font-size="27" fill="#576574" font-weight="400" text-anchor="start">若无可用缓存</text><text x="82" y="527" font-size="27" fill="#576574" font-weight="400" text-anchor="start">历史前缀需要重新处理</text><rect x="576" y="390" width="448" height="164" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="602" y="437" font-size="29" fill="#146E73" font-weight="600" text-anchor="start">选择适合的模型</text><text x="602" y="483" font-size="27" fill="#576574" font-weight="400" text-anchor="start">长会话继续使用时</text><text x="602" y="527" font-size="27" fill="#576574" font-weight="400" text-anchor="start">把缓存状态纳入决策</text><path d="M280 562 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 562 v34" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="612" width="448" height="138" rx="14" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="82" y="657" font-size="29" fill="#165DA2" font-weight="600" text-anchor="start">后续工作够长吗？</text><text x="82" y="706" font-size="27" fill="#576574" font-weight="400" text-anchor="start">省下的费用能否覆盖重建</text><rect x="576" y="612" width="448" height="138" rx="14" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="602" y="657" font-size="29" fill="#146E73" font-weight="600" text-anchor="start">按整项任务验收</text><text x="602" y="706" font-size="25" fill="#576574" font-weight="400" text-anchor="start">质量达标后，再比较费用与耗时</text><rect x="56" y="790" width="968" height="112" rx="14" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="540" y="836" font-size="29" fill="#986319" font-weight="500" text-anchor="middle">单价便宜 ≠ 总任务便宜</text><text x="540" y="877" font-size="25" fill="#986319" font-weight="400" text-anchor="middle">也不是每次切换都会亏：会话长度、缓存状态和任务边界都重要</text></g>
</svg>
