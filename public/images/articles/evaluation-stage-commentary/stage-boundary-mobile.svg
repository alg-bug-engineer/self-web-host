<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1420" viewBox="0 0 540 1420" role="img" aria-labelledby="title desc"><title id="title">练习副本坏了，测试授权不能跟着搬家</title><desc id="desc">练习副本失效后记录环境故障，修复受控副本后可继续。真实网站须另行明确授权和影响范围。分别记录任务结果与外部副作用。</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6b85a1"/></marker></defs><text x="28" y="58" fill="#155a9c" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700"><tspan x="28" dy="0">练习副本坏了，</tspan><tspan x="28" dy="55.800000000000004">测试授权不能跟着搬家</tspan></text><text x="28" y="164" fill="#64748b" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400"><tspan x="28" dy="0">原创分析示意 · 非实测结果</tspan></text><rect x="28" y="204" width="484" height="180" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="52" y="252" fill="#164e87" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700"><tspan x="52" dy="0">练习副本失效</tspan></text><text x="52" y="304" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400"><tspan x="52" dy="0">记录环境故障</tspan><tspan x="52" dy="46.5">保留目标与实际动作证据</tspan></text><path d="M270,384 L270,426" stroke="#6b85a1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="438" width="484" height="222" rx="16" fill="#ecfdf5" stroke="#a7d8c5"/><text x="52" y="486" fill="#164e87" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700"><tspan x="52" dy="0">受控片场内恢复</tspan></text><text x="52" y="538" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400"><tspan x="52" dy="0">修复或重建已授权副本</tspan><tspan x="52" dy="46.5">核验实际依赖与出口</tspan><tspan x="52" dy="46.5">确认后重跑</tspan></text><rect x="28" y="696" width="484" height="222" rx="16" fill="#fff1f2" stroke="#fecdd3"/><text x="52" y="744" fill="#164e87" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700"><tspan x="52" dy="0">转向真实网站：另需授权</tspan></text><text x="52" y="796" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400"><tspan x="52" dy="0">不能自动沿用测试许可</tspan><tspan x="52" dy="46.5">先明确服务方许可</tspan><tspan x="52" dy="46.5">并明确实际影响范围</tspan></text><text x="28" y="979" fill="#155a9c" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700"><tspan x="28" dy="0">成绩之外，分别记录</tspan></text><text x="28" y="1035" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400"><tspan x="28" dy="0">任务结果</tspan><tspan x="28" dy="46.5">完成 / 模型失败 / 环境故障</tspan><tspan x="28" dy="46.5">外部副作用</tspan><tspan x="28" dy="46.5">发给谁、写入哪里、是否获准</tspan></text><rect x="28" y="1240" width="484" height="142" rx="12" fill="#fef3c7"/><text x="50" y="1296" fill="#785a12" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700"><tspan x="50" dy="0">逼真可以追求</tspan><tspan x="50" dy="49.6">第三方不能默认参加排练</tspan></text></svg>