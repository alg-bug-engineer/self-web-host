<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc"><title id="title">练习副本坏了，测试授权不能跟着搬家</title><desc id="desc">练习副本失效后记录环境故障，修复受控副本后可继续。真实网站须另行明确授权和影响范围。分别记录任务结果与外部副作用。</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6b85a1"/></marker></defs><text x="48" y="64" fill="#155a9c" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700"><tspan x="48" dy="0">练习副本坏了，测试授权不能跟着搬家</tspan></text><text x="48" y="112" fill="#64748b" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400"><tspan x="48" dy="0">原创评测设计示意 · 非具体产品实现或实验结果</tspan></text><rect x="48" y="156" width="984" height="174" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="72" y="204" fill="#164e87" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700"><tspan x="72" dy="0">练习副本失效</tspan></text><text x="72" y="256" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400"><tspan x="72" dy="0">记录环境故障，保留目标与动作证据</tspan><tspan x="72" dy="41.85">不要为了完成任务，自动更换接收方</tspan></text><path d="M280,330 L280,378" stroke="#6b85a1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M800,330 L800,378" stroke="#6b85a1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="388" width="464" height="216" rx="16" fill="#ecfdf5" stroke="#a7d8c5"/><text x="72" y="436" fill="#164e87" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700"><tspan x="72" dy="0">受控片场内恢复</tspan></text><text x="72" y="488" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400"><tspan x="72" dy="0">修复或重建已授权副本</tspan><tspan x="72" dy="41.85">核验实际依赖与出口</tspan><tspan x="72" dy="41.85">确认后重跑</tspan></text><rect x="568" y="388" width="464" height="216" rx="16" fill="#fff1f2" stroke="#fecdd3"/><text x="592" y="436" fill="#164e87" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700"><tspan x="592" dy="0">转向真实网站</tspan></text><text x="592" y="488" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400"><tspan x="592" dy="0">测试授权不会自动延伸</tspan><tspan x="592" dy="41.85">先明确服务方许可</tspan><tspan x="592" dy="41.85">并明确实际影响范围</tspan></text><text x="48" y="664" fill="#155a9c" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700"><tspan x="48" dy="0">成绩之外，分别记录</tspan></text><text x="48" y="711" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400"><tspan x="48" dy="0">任务结果：完成 / 模型失败 / 环境故障</tspan><tspan x="48" dy="41.85">外部副作用：发给谁、写入哪里、是否获准</tspan></text><rect x="48" y="800" width="984" height="68" rx="12" fill="#fef3c7"/><text x="72" y="844" fill="#785a12" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700"><tspan x="72" dy="0">逼真可以追求，第三方不能被默认安排成测试参与者</tspan></text></svg>