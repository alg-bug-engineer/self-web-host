<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description"><title id="title">重启后，先找上一张小票</title><desc id="description">假想采购场景。意图保存、外部操作与回执落盘之间可能中断。请求去重、工具重放、外部核验是不同层次。Pi Durable 为实验性软件；安全重放声明不是外部业务保证。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8"/></marker></defs><rect width="1080" height="1080" fill="#FFFFFF"/><rect x="12" y="12" width="1056" height="1056" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="65" font-size="42" fill="#2387DE" text-anchor="middle" font-weight="600">重启后，先找上一张小票</text><text x="540" y="111" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">假想场景 · 三层不同的账</text><text x="288" y="158" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">故障窗口</text><text x="792" y="158" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">恢复时分别核对</text><rect x="56" y="190" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="80" y="234" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">先保存执行意图</text><text x="80" y="278" font-size="27" fill="#576574" text-anchor="start" font-weight="400">本地：准备提交订单</text><text x="80" y="316" font-size="27" fill="#576574" text-anchor="start" font-weight="400">保存后再开始外部操作</text><rect x="56" y="425" width="464" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="80" y="469" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">商家受理了订单</text><text x="80" y="513" font-size="27" fill="#576574" text-anchor="start" font-weight="400">外部：操作可能已生效</text><text x="80" y="551" font-size="27" fill="#576574" text-anchor="start" font-weight="400">此时进程突然中断</text><rect x="56" y="660" width="464" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="80" y="704" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">成功回执还没保存</text><text x="80" y="748" font-size="27" fill="#576574" text-anchor="start" font-weight="400">本地：结果仍然未知</text><text x="80" y="786" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不能直接判断为失败</text><rect x="560" y="190" width="464" height="170" rx="16" fill="#EAF7FF" stroke="#70B8EC"/><text x="584" y="234" font-size="30" fill="#165DA2" text-anchor="start" font-weight="600">请求去重</text><text x="584" y="278" font-size="27" fill="#576574" text-anchor="start" font-weight="400">同会话 + 同 requestId</text><text x="584" y="316" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不重复登记原提交</text><rect x="560" y="425" width="464" height="170" rx="16" fill="#E9FBF8" stroke="#68C8C0"/><text x="584" y="469" font-size="30" fill="#146E73" text-anchor="start" font-weight="600">工具恢复</text><text x="584" y="513" font-size="27" fill="#576574" text-anchor="start" font-weight="400">旧策略与现策略均 safe</text><text x="584" y="551" font-size="27" fill="#576574" text-anchor="start" font-weight="400">才自动重跑旧调用</text><rect x="560" y="660" width="464" height="170" rx="16" fill="#FFF2F2" stroke="#E999A2"/><text x="584" y="704" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">外部核验</text><text x="584" y="748" font-size="27" fill="#576574" text-anchor="start" font-weight="400">查订单 / 幂等 / 人工处理</text><text x="584" y="786" font-size="27" fill="#576574" text-anchor="start" font-weight="400">新调用也认同一笔生意</text><path d="M288 368 V412" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M288 603 V647" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="932" width="1000" height="105" rx="14" fill="#FFFAE7" stroke="#EDDB90"/><text x="540" y="971" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">本地没有成功记录</text><text x="540" y="1010" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">不等于外面没有发生</text></g></svg>
