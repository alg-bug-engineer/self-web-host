<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1010" viewBox="0 0 1080 1010" role="img" aria-labelledby="title description">
<title id="title">让验收台有机会说不</title><desc id="description">作者机制示意：候选结果与未参与拟合、独立路径得到的参考值进入事先确定的检查。核查精度稳定性，要求已知坏样本被拦下，并对照验证文件与参考数据的固定哈希。改动或检查失效要停止核查；通过只提供有限条件下的数值证据，不等于数学证明或同行评审。固定哈希用于发现改动，不代表完整权限控制。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="1010" fill="#FFFFFF"/><rect x="12" y="12" width="1056" height="986" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="540" y="72" font-size="43" fill="#2387DE" text-anchor="middle" font-weight="600">让验收台有机会说不</text><text x="540" y="121" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">作者机制示意 · 聚焦留出数值验证</text><rect x="56" y="166" width="448" height="158" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="82" y="216" font-size="31" fill="#165DA2" text-anchor="start" font-weight="600">Agent 交来的候选结果</text><text x="82" y="264" font-size="28" fill="#576574" text-anchor="start" font-weight="400">待验证的公式、输出数值</text><text x="82" y="305" font-size="27" fill="#576574" text-anchor="start" font-weight="400">不能用拟合点代替留出验证</text><rect x="576" y="166" width="448" height="158" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="602" y="216" font-size="31" fill="#146E73" text-anchor="start" font-weight="600">独立路径的参考值</text><text x="602" y="264" font-size="28" fill="#576574" text-anchor="start" font-weight="400">使用未参与拟合的点</text><text x="602" y="305" font-size="27" fill="#576574" text-anchor="start" font-weight="400">追溯来源，排查共用错误</text><path d="M280 334 V370 H410 V402" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 334 V370 H670 V402" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="414" width="968" height="198" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="540" y="465" font-size="34" fill="#165DA2" text-anchor="middle" font-weight="600">按事先确定的标准核对</text><text x="84" y="516" font-size="28" fill="#576574" text-anchor="start" font-weight="400">变更精度：结果是否稳定？</text><text x="586" y="516" font-size="28" fill="#576574" text-anchor="start" font-weight="400">已知坏样本：必须被拦下</text><text x="540" y="571" font-size="28" fill="#165DA2" text-anchor="middle" font-weight="400">验证文件与参考数据做哈希对照，发现改动须停下核查</text><path d="M410 620 V650 H280 V678" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 620 V650 H800 V678" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="690" width="448" height="158" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="82" y="739" font-size="31" fill="#146E73" text-anchor="start" font-weight="600">通过</text><text x="82" y="786" font-size="28" fill="#576574" text-anchor="start" font-weight="400">得到有限条件下的数值证据</text><text x="82" y="827" font-size="27" fill="#576574" text-anchor="start" font-weight="400">强度仍依赖参考值的独立性</text><rect x="576" y="690" width="448" height="158" rx="16" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="602" y="739" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">发现改动 / 坏样本漏检</text><text x="602" y="786" font-size="28" fill="#576574" text-anchor="start" font-weight="400">停止，检查验收标准与实现</text><text x="602" y="827" font-size="27" fill="#576574" text-anchor="start" font-weight="400">固定哈希不等于权限控制</text><rect x="56" y="888" width="968" height="90" rx="14" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="540" y="925" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">数值证据 ≠ 数学证明 ≠ 同行评审</text><text x="540" y="960" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">尺子固定了，刻度本身仍然需要审查</text></g>
</svg>
