<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1534" viewBox="0 0 540 1534" role="img" aria-labelledby="title description">
<title id="title">让验收台有机会说不</title><desc id="description">作者机制示意：候选结果与未参与拟合、独立路径得到的参考值进入事先确定的检查。核查精度稳定性，要求已知坏样本被拦下，并对照验证文件与参考数据的固定哈希。改动或检查失效要停止核查；通过只提供有限条件下的数值证据，不等于数学证明或同行评审。固定哈希用于发现改动，不代表完整权限控制。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A1ADB8" stroke-width="1.5"/></marker></defs>
<rect width="540" height="1534" fill="#FFFFFF"/><rect x="12" y="12" width="516" height="1510" rx="18" fill="none" stroke="#B7C0C8" stroke-dasharray="6 6"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="65" font-size="37" fill="#2387DE" text-anchor="middle" font-weight="600">让验收台有机会说不</text><text x="270" y="110" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">作者机制示意 · 留出数值验证</text><text x="270" y="149" font-size="27" fill="#79838D" text-anchor="middle" font-weight="400">不是独立复现实验</text><rect x="40" y="185" width="460" height="164" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="66" y="235" font-size="31" fill="#165DA2" text-anchor="start" font-weight="600">Agent 交来的候选结果</text><text x="66" y="281" font-size="28" fill="#576574" text-anchor="start" font-weight="400">待验证的公式、输出数值</text><text x="66" y="323" font-size="27" fill="#576574" text-anchor="start" font-weight="400">拟合点不能代替留出验证</text><rect x="40" y="389" width="460" height="164" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="66" y="439" font-size="31" fill="#146E73" text-anchor="start" font-weight="600">独立路径的参考值</text><text x="66" y="485" font-size="28" fill="#576574" text-anchor="start" font-weight="400">使用未参与拟合的点</text><text x="66" y="527" font-size="27" fill="#576574" text-anchor="start" font-weight="400">追溯来源，排查共用错误</text><path d="M40 267 H25 V595 H155 V623" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M270 561 V623" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="635" width="460" height="267" rx="16" fill="#EAF7FF" stroke="#70B8EC" stroke-width="1.5"/><text x="66" y="687" font-size="31" fill="#165DA2" text-anchor="start" font-weight="600">按事先确定的标准核对</text><text x="66" y="733" font-size="28" fill="#576574" text-anchor="start" font-weight="400">变更精度：结果是否稳定？</text><text x="66" y="779" font-size="28" fill="#576574" text-anchor="start" font-weight="400">已知坏样本：必须被拦下</text><text x="66" y="825" font-size="27" fill="#576574" text-anchor="start" font-weight="400">验证文件与参考数据哈希对照</text><text x="66" y="868" font-size="27" fill="#165DA2" text-anchor="start" font-weight="400">发现改动须停下核查</text><path d="M182 910 V944 H95 V975" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><path d="M357 910 V944 H515 V1210 H501" fill="none" stroke="#A1ADB8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="987" width="460" height="139" rx="16" fill="#E9FBF8" stroke="#68C8C0" stroke-width="1.5"/><text x="66" y="1035" font-size="28" fill="#146E73" text-anchor="start" font-weight="600">通过：有限条件下的数值证据</text><text x="66" y="1082" font-size="27" fill="#576574" text-anchor="start" font-weight="400">强度仍依赖参考值的独立性</text><rect x="40" y="1166" width="460" height="151" rx="16" fill="#FFF2F2" stroke="#E999A2" stroke-width="1.5"/><text x="66" y="1213" font-size="30" fill="#AC3345" text-anchor="start" font-weight="600">发现改动 / 坏样本漏检</text><text x="66" y="1255" font-size="27" fill="#576574" text-anchor="start" font-weight="400">停止，检查验收标准与实现</text><text x="66" y="1297" font-size="27" fill="#576574" text-anchor="start" font-weight="400">固定哈希不等于权限控制</text><rect x="40" y="1351" width="460" height="151" rx="14" fill="#FFFAE7" stroke="#EDDB90" stroke-width="1.5"/><text x="270" y="1394" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">数值证据 ≠ 数学证明</text><text x="270" y="1438" font-size="29" fill="#986319" text-anchor="middle" font-weight="500">也不等于同行评审</text><text x="270" y="1480" font-size="27" fill="#986319" text-anchor="middle" font-weight="400">刻度本身仍然需要审查</text></g>
</svg>
