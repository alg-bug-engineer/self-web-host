<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1450" viewBox="0 0 540 1450" role="img" aria-labelledby="title description"><title id="title">剪工作稿，留得住来历</title><desc id="description">原创机制示意，非性能实验。蓝绿卡片为CLM所核对实现：系统与初始任务受保护，模型编辑工作上下文，实现保存每次调用快照。红色卡片为本文建议：关键证据来源与修改来历可追溯，整理稿不能替代原始授权，按需要控制访问和留存。未声称代码提供完整审计或安全保证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6593B9"/></marker></defs><rect width="540" height="1450" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="270" y="65" font-size="32" fill="#2387DE" text-anchor="middle" font-weight="600">剪工作稿，留得住来历</text><text x="270" y="114" font-size="26" fill="#7B8793" text-anchor="middle" font-weight="400">机制示意 · 不含性能数据</text><rect x="40" y="150" width="460" height="180" rx="18" fill="#EAF5FF" stroke="#91BDEA"/><text x="64" y="196" font-size="30" fill="#206CB5" text-anchor="start" font-weight="600">固定的任务边界</text><text x="64" y="244" font-size="26" fill="#526477" text-anchor="start" font-weight="400">系统与初始任务受保护</text><text x="64" y="286" font-size="26" fill="#526477" text-anchor="start" font-weight="400">不进入模型的编辑区域</text><path d="M 270 338 L 270 378" fill="none" stroke="#6593B9" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="395" width="460" height="245" rx="18" fill="#EAF5FF" stroke="#91BDEA"/><text x="64" y="441" font-size="30" fill="#206CB5" text-anchor="start" font-weight="600">模型编辑工作上下文</text><text x="64" y="489" font-size="26" fill="#526477" text-anchor="start" font-weight="400">删旧输出、压缩过程</text><text x="64" y="531" font-size="26" fill="#526477" text-anchor="start" font-weight="400">整理后用于下一轮输入</text><text x="64" y="573" font-size="26" fill="#526477" text-anchor="start" font-weight="400">通过解析与编辑门控</text><path d="M 270 652 L 270 690" fill="none" stroke="#6593B9" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="705" width="460" height="220" rx="18" fill="#EAF8F4" stroke="#8CC9B5"/><text x="64" y="751" font-size="30" fill="#267769" text-anchor="start" font-weight="600">实现记录调用快照</text><text x="64" y="799" font-size="26" fill="#526477" text-anchor="start" font-weight="400">每次调用的上下文留痕</text><text x="64" y="841" font-size="26" fill="#526477" text-anchor="start" font-weight="400">快照不等于完整审计</text><text x="64" y="883" font-size="26" fill="#526477" text-anchor="start" font-weight="400">以上为所核对实现</text><rect x="40" y="978" width="460" height="218" rx="18" fill="#FFF0F1" stroke="#DCA6AB"/><text x="64" y="1024" font-size="30" fill="#A94C58" text-anchor="start" font-weight="600">本文建议：关键底稿可查</text><text x="64" y="1072" font-size="26" fill="#526477" text-anchor="start" font-weight="400">保留证据来源与修改来历</text><text x="64" y="1114" font-size="26" fill="#526477" text-anchor="start" font-weight="400">整理稿不能替代原始授权</text><text x="64" y="1156" font-size="26" fill="#526477" text-anchor="start" font-weight="400">按需要控制访问与留存</text><rect x="40" y="1240" width="460" height="158" rx="16" fill="#FFF8DC" stroke="#E2CC75"/><text x="270" y="1288" font-size="29" fill="#926724" text-anchor="middle" font-weight="600">工作记忆可以整理</text><text x="270" y="1334" font-size="29" fill="#926724" text-anchor="middle" font-weight="600">关键结论应当能追溯</text><text x="270" y="1374" font-size="24" fill="#926724" text-anchor="middle" font-weight="400">底稿无需全部挤进活跃上下文</text></g></svg>
