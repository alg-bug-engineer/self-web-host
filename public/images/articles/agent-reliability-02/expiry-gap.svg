<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc"><title id="title">过期，不等于立刻撤权</title><desc id="desc">接收端何时见到新代次，才是关键；保证：新代次提交后，旧代次不能覆盖</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="30" y="65" font-size="45" fill="#1758a8" font-weight="bold">过期，不等于立刻撤权</text><text x="30" y="110" font-size="27" fill="#657386">接收端何时见到新代次，才是关键</text><rect x="30" y="170" width="1020" height="125" rx="18" fill="#fff0f0" stroke="#b8c9da"/><text x="50" y="213" font-size="29" fill="#164f89" font-weight="bold">① B 已领取 epoch 2</text><text x="50" y="255" font-size="27" fill="#283b50">接收端还没见过 2 / A 的 epoch 1：仍被接受</text><text x="50" y="255" font-size="27" fill="#283b50"></text><path d="M 540 301 v 32 m -9 -9 l 9 9 l 9 -9" stroke="#557fa5" stroke-width="3" fill="none"/><rect x="30" y="330" width="1020" height="125" rx="18" fill="#e6f7f5" stroke="#b8c9da"/><text x="50" y="373" font-size="29" fill="#164f89" font-weight="bold">② B 提交 epoch 2</text><text x="50" y="415" font-size="27" fill="#283b50">新 fence 与新内容一起提交 / 接收端最高代次变为 2</text><text x="50" y="415" font-size="27" fill="#283b50"></text><path d="M 540 461 v 32 m -9 -9 l 9 9 l 9 -9" stroke="#557fa5" stroke-width="3" fill="none"/><rect x="30" y="490" width="1020" height="125" rx="18" fill="#eaf3ff" stroke="#b8c9da"/><text x="50" y="533" font-size="29" fill="#164f89" font-weight="bold">③ A 再发 epoch 1</text><text x="50" y="575" font-size="27" fill="#283b50">1 &lt; 2，返回 stale / 新内容保持不变</text><text x="50" y="575" font-size="27" fill="#283b50"></text><rect x="30" y="665" width="1020" height="90" rx="14" fill="#fff4cf"/><text x="48" y="703" font-size="27" fill="#645321">保证：新代次提交后，旧代次不能覆盖</text></g></svg>