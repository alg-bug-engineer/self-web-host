<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc"><title id="title">两本账，两道检查</title><desc id="desc">发送端成功，不代表业务结果正确；检查必须守在真正提交的位置</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="30" y="65" font-size="45" fill="#1758a8" font-weight="bold">两本账，两道检查</text><text x="30" y="110" font-size="27" fill="#657386">发送端成功，不代表业务结果正确</text><rect x="30" y="170" width="1020" height="125" rx="18" fill="#eaf3ff" stroke="#b8c9da"/><text x="50" y="213" font-size="29" fill="#164f89" font-weight="bold">发送端 / 调度账</text><text x="50" y="255" font-size="27" fill="#283b50">owner + epoch + deadline / 拒绝过期完成记录</text><text x="50" y="255" font-size="27" fill="#283b50"></text><path d="M 540 301 v 32 m -9 -9 l 9 9 l 9 -9" stroke="#557fa5" stroke-width="3" fill="none"/><rect x="30" y="330" width="1020" height="125" rx="18" fill="#e6f7f5" stroke="#b8c9da"/><text x="50" y="373" font-size="29" fill="#164f89" font-weight="bold">接收端 / 业务账</text><text x="50" y="415" font-size="27" fill="#283b50">已见最高 epoch + 原子写入 / 拒绝旧代次覆盖新内容</text><text x="50" y="415" font-size="27" fill="#283b50"></text><path d="M 540 461 v 32 m -9 -9 l 9 9 l 9 -9" stroke="#557fa5" stroke-width="3" fill="none"/><rect x="30" y="490" width="1020" height="125" rx="18" fill="#fff0f0" stroke="#b8c9da"/><text x="50" y="533" font-size="29" fill="#164f89" font-weight="bold">只检查发送端的反例</text><text x="50" y="575" font-size="27" fill="#283b50">调度结果：new / 业务文档：old</text><text x="50" y="575" font-size="27" fill="#283b50"></text><rect x="30" y="665" width="1020" height="90" rx="14" fill="#fff4cf"/><text x="48" y="703" font-size="27" fill="#645321">检查必须守在真正提交的位置</text></g></svg>