<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1160" viewBox="0 0 540 1160" role="img" aria-labelledby="title desc"><title id="title">两本账，两道检查</title><desc id="desc">发送端成功，不代表业务结果正确；检查必须守在真正提交的位置</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="30" y="65" font-size="34" fill="#1758a8" font-weight="bold">两本账，两道检查</text><text x="30" y="110" font-size="27" fill="#657386">发送端成功，不代表业务结果正确</text><rect x="30" y="190" width="480" height="205" rx="18" fill="#eaf3ff" stroke="#b8c9da"/><text x="50" y="233" font-size="29" fill="#164f89" font-weight="bold">发送端 / 调度账</text><text x="50" y="280" font-size="27" fill="#283b50">owner + epoch + deadline</text><text x="50" y="322" font-size="27" fill="#283b50">拒绝过期完成记录</text><path d="M 270 401 v 32 m -9 -9 l 9 9 l 9 -9" stroke="#557fa5" stroke-width="3" fill="none"/><rect x="30" y="450" width="480" height="205" rx="18" fill="#e6f7f5" stroke="#b8c9da"/><text x="50" y="493" font-size="29" fill="#164f89" font-weight="bold">接收端 / 业务账</text><text x="50" y="540" font-size="27" fill="#283b50">已见最高 epoch + 原子写入</text><text x="50" y="582" font-size="27" fill="#283b50">拒绝旧代次覆盖新内容</text><path d="M 270 661 v 32 m -9 -9 l 9 9 l 9 -9" stroke="#557fa5" stroke-width="3" fill="none"/><rect x="30" y="710" width="480" height="205" rx="18" fill="#fff0f0" stroke="#b8c9da"/><text x="50" y="753" font-size="29" fill="#164f89" font-weight="bold">只检查发送端的反例</text><text x="50" y="800" font-size="27" fill="#283b50">调度结果：new</text><text x="50" y="842" font-size="27" fill="#283b50">业务文档：old</text><rect x="30" y="1045" width="480" height="90" rx="14" fill="#fff4cf"/><text x="48" y="1083" font-size="27" fill="#645321">检查必须守在真正提交的位置</text></g></svg>