<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc"><title id="title">先确定能接，再持久受理</title><desc id="desc">身份重放优先；预算检查与业务入队在同一事务。排队、执行和隔离均占容量，只有本地完成或从未领取的取消才释放。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="28" y="58" font-size="34" fill="#1d4ed8" font-weight="700">先确定能接，再持久受理</text><text x="28" y="102" font-size="27" fill="#64748b" font-weight="400">预算限制未结承诺，不是磁盘总量</text><rect x="28" y="145" width="492" height="200" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="48" y="187" font-size="30" fill="#1d4ed8" font-weight="700">① 先查已接受的身份</text><text x="48" y="230" font-size="27" fill="#1e3a5f" font-weight="400">同 ID、同正文 → replay</text><text x="48" y="272" font-size="27" fill="#1e3a5f" font-weight="400">不同正文或租户 → conflict</text><text x="48" y="314" font-size="27" fill="#1e3a5f" font-weight="400">重放不再占一个名额</text><rect x="560" y="145" width="492" height="200" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="580" y="187" font-size="30" fill="#1d4ed8" font-weight="700">② 同一写事务检查预算</text><text x="580" y="230" font-size="27" fill="#1e3a5f" font-weight="400">全局 + 租户：条数与字节</text><text x="580" y="272" font-size="27" fill="#1e3a5f" font-weight="400">超限拒绝，不保存新身份</text><text x="580" y="314" font-size="27" fill="#1e3a5f" font-weight="400">够用：意图 + 任务共同提交</text><path d="M526 242 L553 242" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="390" width="492" height="220" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="48" y="432" font-size="30" fill="#9f1239" font-weight="700">③ 未结状态，始终占用</text><text x="48" y="475" font-size="27" fill="#1e3a5f" font-weight="400">queued / inflight / quarantined</text><text x="48" y="517" font-size="27" fill="#1e3a5f" font-weight="400">领取、到期、隔离与重投</text><text x="48" y="559" font-size="27" fill="#1e3a5f" font-weight="400">都不意味着已经办完</text><rect x="560" y="390" width="492" height="220" rx="18" fill="#ecfeff" stroke="#67c8d1" stroke-width="2"/><text x="580" y="432" font-size="30" fill="#155e75" font-weight="700">④ 只有可信终结才释放</text><text x="580" y="475" font-size="27" fill="#1e3a5f" font-weight="400">本地合成效果 + done 同事务</text><text x="580" y="517" font-size="27" fill="#1e3a5f" font-weight="400">或从未领取的排队任务取消</text><text x="580" y="559" font-size="27" fill="#1e3a5f" font-weight="400">重复完成不会释放第二次</text><path d="M804 351 L804 365 L274 365 L274 380" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M526 496 L553 496" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="28" y="660" width="1024" height="155" rx="18" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="48" y="702" font-size="30" fill="#713f12" font-weight="700">有界的是未结承诺，不是所有资源</text><text x="48" y="745" font-size="27" fill="#1e3a5f" font-weight="400">终结身份仍保留，历史可能增长；载荷字节不等于内存或硬盘</text><text x="48" y="787" font-size="27" fill="#1e3a5f" font-weight="400">原创机制示意，无吞吐量与生产性能数据</text></g></svg>