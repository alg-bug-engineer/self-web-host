<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1320" viewBox="0 0 540 1320" role="img" aria-labelledby="title desc"><title id="title">先确定能接，再持久受理</title><desc id="desc">身份重放优先；预算检查与业务入队在同一事务。排队、执行和隔离均占容量，只有本地完成或从未领取的取消才释放。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="28" y="58" font-size="34" fill="#1d4ed8" font-weight="700">先确定能接，再持久受理</text><text x="28" y="102" font-size="30" fill="#64748b" font-weight="400">预算限制未结承诺，不是磁盘总量</text><rect x="24" y="135" width="492" height="160" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="44" y="177" font-size="30" fill="#1d4ed8" font-weight="700">① 先查已接受的身份</text><text x="44" y="220" font-size="30" fill="#1e3a5f" font-weight="400">同 ID、同正文 → replay</text><text x="44" y="262" font-size="30" fill="#1e3a5f" font-weight="400">不同正文或租户 → conflict</text><path d="M270 300 L270 328" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="340" width="492" height="200" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="44" y="382" font-size="30" fill="#1d4ed8" font-weight="700">② 同一写事务检查预算</text><text x="44" y="425" font-size="30" fill="#1e3a5f" font-weight="400">全局 + 租户：条数与字节</text><text x="44" y="467" font-size="30" fill="#1e3a5f" font-weight="400">超限 → 拒绝，不保存新身份</text><text x="44" y="509" font-size="30" fill="#1e3a5f" font-weight="400">够用 → 意图与任务共同提交</text><path d="M270 546 L270 576" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="590" width="492" height="200" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="44" y="632" font-size="30" fill="#9f1239" font-weight="700">③ 未结状态，始终占用</text><text x="44" y="675" font-size="30" fill="#1e3a5f" font-weight="400">queued：排队</text><text x="44" y="717" font-size="30" fill="#1e3a5f" font-weight="400">inflight：执行或等待回收</text><text x="44" y="759" font-size="30" fill="#1e3a5f" font-weight="400">quarantined：隔离待处理</text><path d="M270 796 L270 826" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="840" width="492" height="200" rx="18" fill="#ecfeff" stroke="#67c8d1" stroke-width="2"/><text x="44" y="882" font-size="30" fill="#155e75" font-weight="700">④ 只有可信终结才释放</text><text x="44" y="925" font-size="30" fill="#1e3a5f" font-weight="400">本地合成效果 + done 同事务</text><text x="44" y="967" font-size="30" fill="#1e3a5f" font-weight="400">或 generation=0 的排队取消</text><text x="44" y="1009" font-size="30" fill="#1e3a5f" font-weight="400">领取、到期、重投均不释放</text><rect x="24" y="1080" width="492" height="200" rx="18" fill="#fef3c7" stroke="#e5c96d" stroke-width="2"/><text x="44" y="1122" font-size="30" fill="#713f12" font-weight="700">有界的是未结承诺</text><text x="44" y="1165" font-size="30" fill="#1e3a5f" font-weight="400">历史身份仍保留，可能增长</text><text x="44" y="1207" font-size="30" fill="#1e3a5f" font-weight="400">载荷字节 ≠ 内存或硬盘</text><text x="44" y="1249" font-size="30" fill="#1e3a5f" font-weight="400">机制示意，不是性能数据</text></g></svg>