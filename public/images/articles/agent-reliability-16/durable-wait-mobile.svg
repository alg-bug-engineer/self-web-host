<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1440" role="img" aria-labelledby="title desc">
<title id="title">持久等待：回信与超时只有一个结局</title>
<desc id="desc">精确代次定位等待，同一事务裁决信号或超时，写唯一继续指令，再原子消费本地效果。</desc>
<rect width="540" height="1440" fill="#fff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">
<text x="28" y="56" font-size="34" fill="#1d4ed8" font-weight="700">等哪一封信，先存下来</text>
<text x="28" y="106" font-size="30" fill="#64748b">合成业务 · 可信逻辑时间</text>
<rect x="28" y="150" width="484" height="180" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="52" y="198" font-size="32" fill="#1e40af" font-weight="700">精确等待地址</text>
<text x="52" y="246" font-size="30" fill="#334155">flow / step / generation</text>
<text x="52" y="288" font-size="30" fill="#334155">旧代回信不进入新一轮</text>
<path d="M270,335 L270,373" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="390" width="484" height="206" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="52" y="438" font-size="32" fill="#1e40af" font-weight="700">同一事务裁决</text>
<text x="52" y="486" font-size="30" fill="#334155">有效信号：now &lt; deadline</text>
<text x="52" y="528" font-size="30" fill="#334155">到期检查：now ≥ deadline</text>
<text x="52" y="570" font-size="30" fill="#334155">扫描器没跑，不代表未过期</text>
<path d="M270,605 L270,643" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="660" width="484" height="182" rx="20" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
<text x="52" y="708" font-size="32" fill="#1e40af" font-weight="700">唯一终态 + 继续记录</text>
<text x="52" y="756" font-size="30" fill="#334155">signaled 或 timed_out</text>
<text x="52" y="798" font-size="30" fill="#334155">不是只唤醒内存中的协程</text>
<path d="M270,850 L270,888" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="905" width="484" height="180" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
<text x="52" y="953" font-size="32" fill="#1e40af" font-weight="700">继续消费也要原子提交</text>
<text x="52" y="1001" font-size="30" fill="#334155">本地 effect + consumed</text>
<text x="52" y="1043" font-size="30" fill="#334155">重启或重复领取不多写</text>
<rect x="28" y="1120" width="484" height="144" rx="20" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
<text x="52" y="1168" font-size="32" fill="#1e40af" font-weight="700">拒收也有记忆</text>
<text x="52" y="1216" font-size="30" fill="#334155">早到拒绝重放，不自动转接受</text>
<rect x="28" y="1302" width="484" height="108" rx="18" fill="#fef9c3" stroke="#fde68a" stroke-width="2"/>
<text x="49" y="1344" font-size="30" fill="#334155" font-weight="700">信号 ≠ 鉴权；超时 ≠ 撤销</text>
<text x="49" y="1385" font-size="30" fill="#334155">本地闭环不保证远端效果</text>
</g>
</svg>
