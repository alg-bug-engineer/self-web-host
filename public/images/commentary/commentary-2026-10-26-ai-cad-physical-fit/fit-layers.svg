<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc"><title id="title">效果图不能替螺丝签字</title><desc id="desc">需求尺寸、几何网格、工艺配合和用途验证各需证据；前一层不自动证明后一层。原创验收层次示意，非产品真实流程或实测结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="62" font-size="44" fill="#1d4ed8" font-weight="700">效果图不能替螺丝签字</text><text x="40" y="110" font-size="28" fill="#64748b" font-weight="400">本文分析 · 非产品流程或实测</text><rect x="40" y="150" width="1000" height="115" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="64" y="198" font-size="32" fill="#1d4ed8" font-weight="700">需求与尺寸</text><text x="320" y="198" font-size="28" fill="#334155" font-weight="400">单位、孔距、配合对象</text><text x="320" y="241" font-size="28" fill="#334155" font-weight="400">哪些已知，哪些是推测</text><path d="M540 272 L540 288" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="295" width="1000" height="115" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="64" y="343" font-size="32" fill="#1d4ed8" font-weight="700">几何与网格</text><text x="320" y="343" font-size="28" fill="#334155" font-weight="400">外形、闭合、薄壁等检查</text><text x="320" y="386" font-size="28" fill="#334155" font-weight="400">网格可用 ≠ 尺寸合意</text><path d="M540 417 L540 433" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="440" width="1000" height="115" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="64" y="488" font-size="32" fill="#1d4ed8" font-weight="700">工艺与配合</text><text x="320" y="488" font-size="28" fill="#334155" font-weight="400">具体材料、设备与样件</text><text x="320" y="531" font-size="28" fill="#334155" font-weight="400">能打印 ≠ 装得合适</text><path d="M540 562 L540 578" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="585" width="1000" height="115" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="64" y="633" font-size="32" fill="#1d4ed8" font-weight="700">用途验证</text><text x="320" y="633" font-size="28" fill="#334155" font-weight="400">按实际使用条件验收</text><text x="320" y="676" font-size="28" fill="#334155" font-weight="400">能装上 ≠ 安全耐用</text><rect x="40" y="760" width="1000" height="104" rx="20" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="64" y="803" font-size="32" fill="#854d0e" font-weight="700">前一层有证据，不能替后一层签字。</text><text x="64" y="842" font-size="28" fill="#854d0e" font-weight="400">先说清用途，再决定需要哪些检查与验证。</text></g></svg>