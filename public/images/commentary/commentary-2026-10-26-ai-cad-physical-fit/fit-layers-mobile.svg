<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1420" viewBox="0 0 540 1420" role="img" aria-labelledby="title desc"><title id="title">效果图不能替螺丝签字</title><desc id="desc">需求尺寸、几何网格、工艺配合和用途验证各需证据；前一层不自动证明后一层。原创验收层次示意，非产品真实流程或实测结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="28" y="62" font-size="36" fill="#1d4ed8" font-weight="700">效果图不能替螺丝签字</text><text x="28" y="110" font-size="28" fill="#64748b" font-weight="400">本文分析 · 非产品流程或实测</text><rect x="24" y="150" width="492" height="200" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="48" y="202" font-size="34" fill="#1d4ed8" font-weight="700">需求与尺寸</text><text x="48" y="258" font-size="30" fill="#334155" font-weight="400">单位、孔距、配合对象</text><text x="48" y="305" font-size="30" fill="#334155" font-weight="400">哪些已知，哪些是推测</text><path d="M270 357 L270 373" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="390" width="492" height="200" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="48" y="442" font-size="34" fill="#1d4ed8" font-weight="700">几何与网格</text><text x="48" y="498" font-size="30" fill="#334155" font-weight="400">外形、闭合、薄壁等检查</text><text x="48" y="545" font-size="30" fill="#334155" font-weight="400">网格可用 ≠ 尺寸合意</text><path d="M270 597 L270 613" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="630" width="492" height="200" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="48" y="682" font-size="34" fill="#1d4ed8" font-weight="700">工艺与配合</text><text x="48" y="738" font-size="30" fill="#334155" font-weight="400">具体材料、设备与样件</text><text x="48" y="785" font-size="30" fill="#334155" font-weight="400">能打印 ≠ 装得合适</text><path d="M270 837 L270 853" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="870" width="492" height="200" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="48" y="922" font-size="34" fill="#1d4ed8" font-weight="700">用途验证</text><text x="48" y="978" font-size="30" fill="#334155" font-weight="400">按实际使用条件验收</text><text x="48" y="1025" font-size="30" fill="#334155" font-weight="400">能装上 ≠ 安全耐用</text><rect x="24" y="1120" width="492" height="244" rx="20" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="48" y="1172" font-size="34" fill="#854d0e" font-weight="700">前一层有证据，</text><text x="48" y="1228" font-size="34" fill="#854d0e" font-weight="700">不能替后一层签字。</text><text x="48" y="1294" font-size="30" fill="#854d0e" font-weight="400">先说清用途，再决定验收。</text></g></svg>