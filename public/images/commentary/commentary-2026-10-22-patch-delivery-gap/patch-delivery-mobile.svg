<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1490" viewBox="0 0 540 1490" role="img" aria-labelledby="title desc"><title id="title">补丁要走完交接链</title><desc id="desc">漏洞发现、维护者修复、运营者部署核验各有责任。应用更新不等于运行时更新，临时缓解不能替代修复。</desc><rect width="540" height="1490" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="30" y="65" font-size="42" fill="#1762aa" font-weight="700">补丁要走完</text><text x="30" y="120" font-size="42" fill="#1762aa" font-weight="700">交接链</text><text x="30" y="173" font-size="30" fill="#6b7785">责任示意，非定量统计</text><rect x="28" y="215" width="484" height="215" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="52" y="269" font-size="36" fill="#1762aa" font-weight="700">发现者</text><text x="52" y="326" font-size="32" fill="#28465c">确认问题</text><text x="52" y="379" font-size="32" fill="#28465c">提供可审查证据</text><rect x="28" y="480" width="484" height="215" rx="18" fill="#eaf8f5" stroke="#8ac2b7" stroke-width="2"/><text x="52" y="534" font-size="36" fill="#1762aa" font-weight="700">维护者</text><text x="52" y="591" font-size="32" fill="#28465c">准备并验证修复</text><text x="52" y="644" font-size="32" fill="#28465c">发布适用更新</text><rect x="28" y="745" width="484" height="215" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="52" y="799" font-size="36" fill="#1762aa" font-weight="700">运营者</text><text x="52" y="856" font-size="32" fill="#28465c">部署适用更新</text><text x="52" y="909" font-size="32" fill="#28465c">核验运行状态</text><path d="M270 440v28m-12 -12 12 12 12-12" fill="none" stroke="#1762aa" stroke-width="3"/><path d="M270 705v28m-12 -12 12 12 12-12" fill="none" stroke="#1762aa" stroke-width="3"/><rect x="28" y="1000" width="484" height="230" rx="18" fill="#fff0ee" stroke="#dda9a2" stroke-width="2"/><text x="52" y="1055" font-size="34" fill="#a44d44" font-weight="700">不能跳过的边界</text><text x="52" y="1110" font-size="30" fill="#28465c">应用更新 ≠ 运行时修复</text><text x="52" y="1163" font-size="32" fill="#28465c">临时缓解有范围</text><text x="52" y="1208" font-size="32" fill="#28465c">不能代替安全更新</text><rect x="28" y="1270" width="484" height="180" rx="18" fill="#fff8d8" stroke="#e0ce84" stroke-width="2"/><text x="52" y="1325" font-size="34" fill="#28465c" font-weight="700">公告已发布</text><text x="52" y="1377" font-size="32" fill="#28465c">≠ 这台服务已修复</text><text x="52" y="1427" font-size="30" fill="#28465c">还要核验具体运行状态</text></g></svg>