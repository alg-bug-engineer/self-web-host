<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="940" viewBox="0 0 1080 940" role="img" aria-labelledby="title desc"><title id="title">补丁要走完交接链</title><desc id="desc">漏洞发现、维护者修复、运营者部署核验各有责任。应用更新不等于运行时更新，临时缓解不能替代修复。</desc><rect width="1080" height="940" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="76" font-size="44" fill="#1762aa" font-weight="700">发现了漏洞，还要把修复送到运行现场</text><text x="40" y="130" font-size="30" fill="#6b7785">责任与证据的交接示意，不是耗时或成功率统计</text><rect x="40" y="205" width="300" height="270" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="65" y="268" font-size="36" fill="#1762aa" font-weight="700">发现者</text><text x="65" y="340" font-size="29" fill="#28465c">确认问题</text><text x="65" y="398" font-size="29" fill="#28465c">提供可审查证据</text><rect x="390" y="205" width="300" height="270" rx="18" fill="#eaf8f5" stroke="#8ac2b7" stroke-width="2"/><text x="415" y="268" font-size="36" fill="#1762aa" font-weight="700">维护者</text><text x="415" y="340" font-size="29" fill="#28465c">准备并验证修复</text><text x="415" y="398" font-size="29" fill="#28465c">发布适用更新</text><rect x="740" y="205" width="300" height="270" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="765" y="268" font-size="36" fill="#1762aa" font-weight="700">运营者</text><text x="765" y="340" font-size="29" fill="#28465c">部署适用更新</text><text x="765" y="398" font-size="29" fill="#28465c">核验运行状态</text><path d="M345 335h35m-12 -12 12 12-12 12" fill="none" stroke="#1762aa" stroke-width="3"/><path d="M695 335h35m-12 -12 12 12-12 12" fill="none" stroke="#1762aa" stroke-width="3"/><rect x="40" y="530" width="1000" height="190" rx="18" fill="#fff0ee" stroke="#dda9a2" stroke-width="2"/><text x="65" y="586" font-size="34" fill="#a44d44" font-weight="700">两个不能跳过的边界</text><text x="65" y="644" font-size="32" fill="#28465c">应用已更新，不代表底层运行时已修复</text><text x="65" y="692" font-size="32" fill="#28465c">临时缓解有范围，不能代替适用的安全更新</text><rect x="40" y="775" width="1000" height="120" rx="18" fill="#fff8d8" stroke="#e0ce84" stroke-width="2"/><text x="65" y="825" font-size="34" fill="#28465c" font-weight="700">公告已发布 ≠ 这台服务已完成修复</text><text x="65" y="873" font-size="30" fill="#28465c">需要落到具体部署的证据，不凭新闻标题报平安</text></g></svg>