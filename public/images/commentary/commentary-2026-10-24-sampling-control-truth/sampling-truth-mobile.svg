<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1510" viewBox="0 0 540 1510" role="img" aria-labelledby="title desc"><title id="title">拆掉采样旋钮，不等于接通事实开关</title><desc id="desc">新版本移除采样参数，仍按默认值采样。生成控制与事实验收是不同环节，稳定输出不等于正确。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="28" y="64" font-size="38" fill="#1d4ed8" font-weight="700">旋钮拆了，事实还得查</text><text x="28" y="110" font-size="32" fill="#64748b" font-weight="400">新 API 版本 ≠ 取消采样</text><rect x="24" y="145" width="492" height="390" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="48" y="196" font-size="36" fill="#1d4ed8" font-weight="700">官方接口变化</text><text x="48" y="245" font-size="32" fill="#334155" font-weight="400">API 2026-10-21</text><text x="48" y="298" font-size="30" fill="#334155" font-weight="400">temperature / top_p</text><text x="48" y="344" font-size="32" fill="#334155" font-weight="400">或 top_k → 400</text><text x="48" y="397" font-size="32" fill="#334155" font-weight="400">不传：仍按默认值采样</text><text x="48" y="444" font-size="32" fill="#334155" font-weight="400">temperature 为 1.0</text><text x="48" y="494" font-size="31" fill="#64748b" font-weight="400">不代表所有旧调用失效</text><path d="M270 546 L270 577" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="600" width="492" height="280" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="48" y="651" font-size="36" fill="#0e7490" font-weight="700">生成控制</text><text x="48" y="706" font-size="32" fill="#334155" font-weight="400">改变候选选择的分布</text><text x="48" y="756" font-size="30" fill="#334155" font-weight="400">低温可减少部分输出变化</text><text x="48" y="806" font-size="32" fill="#334155" font-weight="400">不保证每次完全相同</text><text x="48" y="851" font-size="32" fill="#334155" font-weight="400">也不核验事实真假</text><rect x="24" y="915" width="492" height="280" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="48" y="967" font-size="36" fill="#be123c" font-weight="700">事实验收</text><text x="48" y="1021" font-size="32" fill="#334155" font-weight="400">检查具体主张与来源</text><text x="48" y="1071" font-size="30" fill="#334155" font-weight="400">有引用，仍要核对支持度</text><text x="48" y="1121" font-size="32" fill="#334155" font-weight="400">允许回答“不知道”</text><text x="48" y="1166" font-size="30" fill="#334155" font-weight="400">缓解风险，不承诺零错误</text><rect x="24" y="1235" width="492" height="220" rx="20" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="48" y="1285" font-size="34" fill="#854d0e" font-weight="700">本文判断</text><text x="48" y="1336" font-size="34" fill="#854d0e" font-weight="400">稳定是输出特征，</text><text x="48" y="1386" font-size="34" fill="#854d0e" font-weight="700">正确需要证据。</text><text x="48" y="1430" font-size="30" fill="#854d0e" font-weight="400">迁移接口不能替代验收</text></g></svg>