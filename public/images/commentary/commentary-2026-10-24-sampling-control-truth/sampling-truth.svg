<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="950" viewBox="0 0 1080 950" role="img" aria-labelledby="title desc"><title id="title">拆掉采样旋钮，不等于接通事实开关</title><desc id="desc">新版本移除采样参数，仍按默认值采样。生成控制与事实验收是不同环节，稳定输出不等于正确。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="50" y="75" font-size="44" fill="#1d4ed8" font-weight="700">拆掉采样旋钮，不等于接通事实开关</text><text x="50" y="126" font-size="30" fill="#64748b" font-weight="400">Claude API 2026-10-21 · 官方变化与本文分析</text><rect x="50" y="165" width="980" height="210" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="78" y="211" font-size="34" fill="#1d4ed8" font-weight="700">官方接口变化</text><text x="78" y="262" font-size="32" fill="#334155" font-weight="400">发送 temperature / top_p / top_k → 400</text><text x="78" y="310" font-size="30" fill="#334155" font-weight="400">不传参数：仍按默认值采样，temperature 为 1.0</text><text x="78" y="350" font-size="29" fill="#64748b" font-weight="400">范围：新 API 版本；不代表所有旧调用失效</text><path d="M540 386 L540 420" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="445" width="470" height="275" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="78" y="493" font-size="35" fill="#0e7490" font-weight="700">生成控制</text><text x="78" y="548" font-size="31" fill="#334155" font-weight="400">改变候选选择的分布</text><text x="78" y="596" font-size="29" fill="#334155" font-weight="400">低温可减少部分输出变化</text><text x="78" y="650" font-size="30" fill="#334155" font-weight="400">不保证每次完全相同</text><text x="78" y="693" font-size="30" fill="#334155" font-weight="400">也不核验事实真假</text><rect x="560" y="445" width="470" height="275" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="588" y="493" font-size="35" fill="#be123c" font-weight="700">事实验收</text><text x="588" y="548" font-size="31" fill="#334155" font-weight="400">检查具体主张与来源</text><text x="588" y="596" font-size="29" fill="#334155" font-weight="400">引用存在，仍要核对支持度</text><text x="588" y="650" font-size="30" fill="#334155" font-weight="400">允许回答“不知道”</text><text x="588" y="693" font-size="29" fill="#334155" font-weight="400">缓解风险，不承诺零错误</text><rect x="50" y="770" width="980" height="125" rx="20" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="78" y="819" font-size="35" fill="#854d0e" font-weight="700">本文判断：稳定是输出特征，正确需要证据。</text><text x="78" y="868" font-size="29" fill="#854d0e" font-weight="400">采样控制不可冒充事实开关；接口迁移也不能替代验收。</text></g></svg>