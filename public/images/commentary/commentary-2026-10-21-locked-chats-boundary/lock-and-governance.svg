<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img" aria-labelledby="title desc"><title id="title">聊天上锁，治理规则仍在</title><desc id="desc">锁定改变普通界面的显示和打开条件；企业与教育工作区的授权合规日志访问仍适用。不是删除，也不是端到端加密保险库。</desc><rect width="1080" height="920" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="76" font-size="44" fill="#1762aa" font-weight="700">聊天上锁，治理规则仍在</text><text x="48" y="126" font-size="29" fill="#6b7785">Enterprise / Edu · 两类访问边界，不是两份副本</text><rect x="48" y="175" width="472" height="340" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><rect x="560" y="175" width="472" height="340" rx="18" fill="#eaf8f5" stroke="#8ac2b7" stroke-width="2"/><text x="76" y="238" font-size="35" fill="#1762aa" font-weight="700">普通界面</text><text x="76" y="310" font-size="29" fill="#28465c">从常规列表与搜索隐藏</text><text x="76" y="372" font-size="29" fill="#28465c">打开需要 PIN 或设备认证</text><text x="76" y="434" font-size="29" fill="#28465c">其他已开页面可能需刷新</text><text x="588" y="238" font-size="35" fill="#1762aa" font-weight="700">授权合规入口</text><text x="588" y="310" font-size="29" fill="#28465c">会话消息仍进入合规日志</text><text x="588" y="372" font-size="29" fill="#28465c">PIN 不阻止授权合规访问</text><text x="588" y="434" font-size="29" fill="#28465c">权限与组织规则继续适用</text><text x="48" y="562" font-size="32" fill="#1762aa" font-weight="700">两边不矛盾：界面开锁权 ≠ 全部数据访问权</text><rect x="48" y="600" width="984" height="154" rx="18" fill="#fff0ee" stroke="#dda9a2" stroke-width="2"/><text x="76" y="655" font-size="32" fill="#a44d44" font-weight="700">没有随之发生的事</text><text x="76" y="712" font-size="30" fill="#28465c">保留规则没有改变，也没有变成端到端加密保险库</text><rect x="48" y="795" width="984" height="84" rx="18" fill="#fff8d8" stroke="#e0ce84" stroke-width="2"/><text x="76" y="848" font-size="31" fill="#28465c">锁定保护界面入口，不等于删除或撤回既有共享。</text></g></svg>