<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1390" viewBox="0 0 540 1390" role="img" aria-labelledby="title desc"><title id="title">聊天上锁，治理规则仍在</title><desc id="desc">锁定改变普通界面的显示和打开条件；企业与教育工作区的授权合规日志访问仍适用。不是删除，也不是端到端加密保险库。</desc><rect width="540" height="1390" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="30" y="66" font-size="42" fill="#1762aa" font-weight="700">聊天上锁</text><text x="30" y="120" font-size="42" fill="#1762aa" font-weight="700">治理规则仍在</text><text x="30" y="170" font-size="30" fill="#6b7785">Enterprise / Edu 工作区</text><rect x="28" y="214" width="484" height="270" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="52" y="271" font-size="36" fill="#1762aa" font-weight="700">普通界面</text><text x="52" y="334" font-size="30" fill="#28465c">常规列表与搜索中隐藏</text><text x="52" y="388" font-size="30" fill="#28465c">打开需要 PIN / 设备认证</text><text x="52" y="442" font-size="30" fill="#28465c">已开页面可能需要刷新</text><text x="30" y="548" font-size="32" fill="#1762aa" font-weight="700">界面开锁权</text><text x="30" y="594" font-size="32" fill="#1762aa" font-weight="700">≠ 全部数据访问权</text><rect x="28" y="634" width="484" height="270" rx="18" fill="#eaf8f5" stroke="#8ac2b7" stroke-width="2"/><text x="52" y="691" font-size="36" fill="#1762aa" font-weight="700">授权合规入口</text><text x="52" y="754" font-size="30" fill="#28465c">会话消息仍进入合规日志</text><text x="52" y="808" font-size="30" fill="#28465c">PIN 不阻止授权合规访问</text><text x="52" y="862" font-size="30" fill="#28465c">权限与组织规则继续适用</text><rect x="28" y="944" width="484" height="204" rx="18" fill="#fff0ee" stroke="#dda9a2" stroke-width="2"/><text x="52" y="1000" font-size="34" fill="#a44d44" font-weight="700">锁定没有改变</text><text x="52" y="1058" font-size="30" fill="#28465c">原有的数据保留规则</text><text x="52" y="1110" font-size="30" fill="#28465c">也不是端到端加密保险库</text><rect x="28" y="1188" width="484" height="164" rx="18" fill="#fff8d8" stroke="#e0ce84" stroke-width="2"/><text x="52" y="1244" font-size="32" fill="#28465c" font-weight="700">保护界面入口</text><text x="52" y="1294" font-size="30" fill="#28465c">≠ 删除 / 撤回既有共享</text></g></svg>