<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960" role="img" aria-labelledby="title desc"><title id="title">听懂意图，也允许不出广告</title><desc id="desc">官方说明中，回答与广告选择由不同服务和模型处理。本文提醒商品提及、购买意图与当轮展示不能混为一谈。</desc><rect width="1080" height="960" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="75" font-size="44" fill="#1762aa" font-weight="700">听懂意图，也允许不出广告</text><text x="40" y="125" font-size="30" fill="#6b7785" font-weight="400">官方设计摘要 + 本文评审提醒，不是线上效果实测</text><rect x="300" y="170" width="480" height="115" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="330" y="218" font-size="32" fill="#1762aa" font-weight="700">对话上下文</text><text x="330" y="262" font-size="29" fill="#28465c" font-weight="400">“我想先修修这台咖啡机”</text><path d="M540 285V315H280V350M540 315H800V350" fill="none" stroke="#1762aa" stroke-width="3"/><path d="M270 338L280 350L290 338" fill="none" stroke="#1762aa" stroke-width="3"/><path d="M790 338L800 350L810 338" fill="none" stroke="#1762aa" stroke-width="3"/><rect x="40" y="355" width="480" height="230" rx="18" fill="#eaf8f5" stroke="#8ac2b7" stroke-width="2"/><text x="65" y="410" font-size="36" fill="#1762aa" font-weight="700">回答路径</text><text x="65" y="476" font-size="33" fill="#28465c" font-weight="400">独立的服务与模型</text><text x="65" y="535" font-size="33" fill="#28465c" font-weight="400">回答不等待广告</text><rect x="560" y="355" width="480" height="230" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="585" y="410" font-size="36" fill="#1762aa" font-weight="700">广告选择路径</text><text x="585" y="465" font-size="30" fill="#28465c" font-weight="400">另一个模型调度广告工具</text><text x="585" y="518" font-size="30" fill="#28465c" font-weight="400">合适才展示，单独标识</text><text x="585" y="563" font-size="30" fill="#28465c" font-weight="400">也可以本轮不出广告</text><rect x="40" y="635" width="1000" height="145" rx="18" fill="#fff0ee" stroke="#dda9a2" stroke-width="2"/><text x="65" y="689" font-size="34" fill="#a44d44" font-weight="700">本文提醒：提及商品 ≠ 准备购买</text><text x="65" y="746" font-size="32" fill="#28465c" font-weight="400">选购、维修、假设场景，需要不同的意图判断</text><rect x="40" y="830" width="1000" height="90" rx="18" fill="#fff8d8" stroke="#e0ce84" stroke-width="2"/><text x="65" y="888" font-size="35" fill="#28465c" font-weight="700">更会匹配商品，也要更懂什么时候不出现</text></g></svg>