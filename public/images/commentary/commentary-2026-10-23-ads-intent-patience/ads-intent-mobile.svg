<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1510" viewBox="0 0 600 1510" role="img" aria-labelledby="title desc"><title id="title">听懂意图，也允许不出广告</title><desc id="desc">官方说明中，回答与广告选择由不同服务和模型处理。本文提醒商品提及、购买意图与当轮展示不能混为一谈。</desc><rect width="600" height="1510" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="30" y="62" font-size="38" fill="#1762aa" font-weight="700">听懂意图，也允许不出广告</text><text x="30" y="108" font-size="30" fill="#6b7785" font-weight="400">官方设计摘要 + 本文评审提醒</text><rect x="30" y="150" width="540" height="130" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="55" y="203" font-size="34" fill="#1762aa" font-weight="700">对话上下文</text><text x="55" y="252" font-size="30" fill="#28465c" font-weight="400">“我想先修修这台咖啡机”</text><path d="M175 280 L175 330" fill="none" stroke="#1762aa" stroke-width="3"/><path d="M165 318 L175 330 L185 318" fill="none" stroke="#1762aa" stroke-width="3"/><rect x="30" y="335" width="540" height="200" rx="18" fill="#eaf8f5" stroke="#8ac2b7" stroke-width="2"/><text x="55" y="390" font-size="35" fill="#1762aa" font-weight="700">回答路径</text><text x="55" y="448" font-size="32" fill="#28465c" font-weight="400">独立的服务与模型</text><text x="55" y="498" font-size="32" fill="#28465c" font-weight="400">回答不等待广告</text><path d="M425 280V300H585V565H300V589" fill="none" stroke="#1762aa" stroke-width="3"/><path d="M290 577L300 589L310 577" fill="none" stroke="#1762aa" stroke-width="3"/><rect x="30" y="595" width="540" height="250" rx="18" fill="#edf4fd" stroke="#9ebddd" stroke-width="2"/><text x="55" y="650" font-size="35" fill="#1762aa" font-weight="700">广告选择路径</text><text x="55" y="710" font-size="30" fill="#28465c" font-weight="400">另一个模型调度广告工具</text><text x="55" y="765" font-size="32" fill="#28465c" font-weight="400">合适才展示，单独标识</text><text x="55" y="815" font-size="32" fill="#28465c" font-weight="400">也可以本轮不出广告</text><rect x="30" y="900" width="540" height="300" rx="18" fill="#fff0ee" stroke="#dda9a2" stroke-width="2"/><text x="55" y="960" font-size="35" fill="#a44d44" font-weight="700">本文提醒：别抢答</text><text x="55" y="1020" font-size="32" fill="#28465c" font-weight="400">提及商品 ≠ 准备购买</text><text x="55" y="1077" font-size="32" fill="#28465c" font-weight="400">选购、维修、假设场景</text><text x="55" y="1134" font-size="32" fill="#28465c" font-weight="400">需要不同的意图判断</text><rect x="30" y="1260" width="540" height="195" rx="18" fill="#fff8d8" stroke="#e0ce84" stroke-width="2"/><text x="55" y="1318" font-size="34" fill="#28465c" font-weight="700">留白也应当接受检验</text><text x="55" y="1374" font-size="30" fill="#28465c" font-weight="400">这是一张逻辑示意图</text><text x="55" y="1423" font-size="30" fill="#28465c" font-weight="400">不是线上效果的实测结论</text></g></svg>