<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" role="img" aria-labelledby="title desc"><title id="title">没有报警，不等于全都看见</title><desc id="desc">独立的动作记录与监控记录需要核对。应检、已检、判断与处置是不同状态，未检查不能当作通过。原创工程核验关系示意，不表示实际厂商拓扑或覆盖比例。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="44" y="66" font-size="44" fill="#1d4ed8" font-weight="700">没有报警，不等于全都看见</text><text x="44" y="116" font-size="28" fill="#64748b" font-weight="400">本文提出的核验关系 · 不是厂商真实拓扑或实测覆盖比例</text><rect x="44" y="162" width="452" height="194" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="70" y="214" font-size="34" fill="#1d4ed8" font-weight="700">动作发生了什么</text><text x="70" y="265" font-size="30" fill="#334155" font-weight="400">来自执行侧的动作记录</text><text x="70" y="314" font-size="28" fill="#334155" font-weight="400">不能只数监控已收到的请求</text><rect x="584" y="162" width="452" height="194" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="610" y="214" font-size="34" fill="#0e7490" font-weight="700">哪些动作本来应检</text><text x="610" y="265" font-size="30" fill="#334155" font-weight="400">说明覆盖范围与例外</text><text x="610" y="314" font-size="30" fill="#334155" font-weight="400">应检，不等于已经检查</text><path d="M510 259 L565 259" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="584" y="420" width="452" height="194" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="610" y="472" font-size="34" fill="#1d4ed8" font-weight="700">哪些确实完成检查</text><text x="610" y="523" font-size="30" fill="#334155" font-weight="400">区分收到、积压与失败</text><text x="610" y="572" font-size="30" fill="#334155" font-weight="400">未检查不能默认成通过</text><path d="M810 372 L810 404" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="420" width="452" height="194" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="70" y="472" font-size="34" fill="#be123c" font-weight="700">判断后是否有处理</text><text x="70" y="523" font-size="28" fill="#334155" font-weight="400">发现风险，不自动阻止动作</text><text x="70" y="572" font-size="30" fill="#334155" font-weight="400">判断与处置分别保留证据</text><path d="M568 518 L513 518" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="670" width="992" height="142" rx="20" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="72" y="723" font-size="34" fill="#854d0e" font-weight="700">动作记录 ↔ 监控记录：让遗漏也能被看见</text><text x="72" y="776" font-size="34" fill="#854d0e" font-weight="400">没有证据的空白，别涂成安全的绿色。</text></g></svg>