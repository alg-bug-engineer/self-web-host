<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1440" viewBox="0 0 540 1440" role="img" aria-labelledby="title desc"><title id="title">没有报警，不等于全都看见</title><desc id="desc">独立的动作记录与监控记录需要核对。应检、已检、判断与处置是不同状态，未检查不能当作通过。原创工程核验关系示意，不表示实际厂商拓扑或覆盖比例。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="28" y="63" font-size="36" fill="#1d4ed8" font-weight="700">没报警，先查有没有看见</text><text x="28" y="111" font-size="30" fill="#64748b" font-weight="400">本文分析 · 非实际系统拓扑</text><rect x="24" y="150" width="492" height="200" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="48" y="202" font-size="34" fill="#1d4ed8" font-weight="700">动作发生了什么</text><text x="48" y="258" font-size="30" fill="#334155" font-weight="400">来自执行侧的记录</text><text x="48" y="305" font-size="30" fill="#334155" font-weight="400">不能只数监控收到的请求</text><path d="M270 361 L270 377" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="390" width="492" height="200" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="48" y="442" font-size="34" fill="#1d4ed8" font-weight="700">哪些动作本来应检</text><text x="48" y="498" font-size="30" fill="#334155" font-weight="400">范围与例外要能解释</text><text x="48" y="545" font-size="30" fill="#334155" font-weight="400">未知覆盖，不显示为通过</text><path d="M270 601 L270 617" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="630" width="492" height="200" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="48" y="682" font-size="34" fill="#1d4ed8" font-weight="700">哪些确实完成检查</text><text x="48" y="738" font-size="30" fill="#334155" font-weight="400">收到 ≠ 已完整检查</text><text x="48" y="785" font-size="30" fill="#334155" font-weight="400">积压与失败单独记账</text><path d="M270 841 L270 857" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="870" width="492" height="200" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="48" y="922" font-size="34" fill="#1d4ed8" font-weight="700">判断后是否有处理</text><text x="48" y="978" font-size="30" fill="#334155" font-weight="400">识别风险 ≠ 阻止动作</text><text x="48" y="1025" font-size="30" fill="#334155" font-weight="400">发现与处置各有证据</text><rect x="24" y="1120" width="492" height="258" rx="20" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="48" y="1173" font-size="34" fill="#854d0e" font-weight="700">把两份记录对起来</text><text x="48" y="1227" font-size="32" fill="#854d0e" font-weight="400">动作记录 ↔ 监控记录</text><text x="48" y="1282" font-size="34" fill="#854d0e" font-weight="400">没有证据的空白，</text><text x="48" y="1336" font-size="34" fill="#854d0e" font-weight="700">别涂成安全的绿色。</text></g></svg>