name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: bash scripts/tests/test-github-pr-recovery.sh
      - run: node scripts/tests/test-search-console.mjs
      - run: node scripts/tests/test-import-wechat.mjs
      - run: npm run lint
      - run: npm run build
      - run: bash scripts/tests/test-analytics-conversions.sh
      - run: node scripts/tests/test-blog-learning-hub.mjs
