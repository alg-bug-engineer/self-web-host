      - run: npm run test:content-diversity
      - run: npm run test:content-redirects
      - run: npm run test:content-operations
      - run: npm run test:operator-content-report
      - run: npm run test:active-reading
      - run: npm run test:article-headings
      - run: npm run test:rag-evaluation
      - run: npm run test:rag-chunking
      - run: npm run test:rag-fusion
