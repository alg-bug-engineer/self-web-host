name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: bash scripts/tests/test-github-pr-recovery.sh
      - run: bash scripts/tests/test-daily-content-isolation.sh
      - run: node scripts/tests/test-search-console.mjs
      - run: node scripts/tests/test-import-wechat.mjs
      - run: npm run test:wechat-rss-backoff
      - run: npm run test:fetch-wechat-rss
      - run: npm run test:content-diversity
      - run: npm run test:content-redirects
      - run: npm run test:content-operations
      - run: npm run test:operator-content-report
      - run: npm run test:active-reading
      - run: npm run test:article-headings
      - run: npm run test:operator-decision
      - run: npm run test:operator-experiments
      - run: npm run test:indexnow
      - run: npm run test:llms-markdown
      - run: npm run test:profile-audit
      - run: npm run test:public-claims
      - run: npm run test:privacy
      - run: npm run test:identity-geo
      - run: npm run test:traffic-source
      - run: npm run test:production-health
      - run: npm run test:daily-launchd
      - run: npm run test:search-console-sync-launchd
      - run: npm run lint
      - run: npm run build
      - run: npm run test:identity-geo-build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:ui
      - run: bash scripts/tests/test-analytics-conversions.sh
      - run: node scripts/tests/test-blog-learning-hub.mjs
