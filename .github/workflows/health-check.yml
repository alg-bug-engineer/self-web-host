name: Production health check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check homepage and health endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 https://ai-knowledgepoints.cn/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://ai-knowledgepoints.cn/api/health | grep -q '"ok":true'
