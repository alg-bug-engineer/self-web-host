name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
        run: |
          ssh -i ~/.ssh/ecs_deploy_key -p "${ECS_PORT:-22}" "$ECS_USER@$ECS_HOST" \
            "cd /root/self-web-host && git fetch origin '$GITHUB_SHA' && git cat-file -e '$GITHUB_SHA:scripts/deploy.sh' && git show '$GITHUB_SHA:scripts/deploy.sh' | PROJECT_DIR=/root/self-web-host bash -s -- '$GITHUB_SHA'"

      - name: Verify public health
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 https://ai-knowledgepoints.cn/api/health)"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"ok":true'
          printf '%s' "$response" | grep -q "$GITHUB_SHA"

      - name: Notify participating search engines
        continue-on-error: true
        env:
          INDEXNOW_PREVIOUS_COMMIT: ${{ github.event.before }}
          INDEXNOW_COMMIT: ${{ github.sha }}
        run: npm run seo:indexnow
