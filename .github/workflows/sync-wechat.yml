name: Sync WeChat articles

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure ECS SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect and fetch private WeChat RSS from ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
        run: |
          ssh -i ~/.ssh/ecs_deploy_key -p "${ECS_PORT:-22}" "$ECS_USER@$ECS_HOST" \
            "set -Eeuo pipefail; cd /root/self-web-host; git fetch origin '$GITHUB_SHA'; sync_dir=\$(mktemp -d); trap 'rm -rf \"\$sync_dir\"' EXIT; git archive '$GITHUB_SHA' scripts/fetch-wechat-rss.mjs scripts/lib/wechat-rss-backoff.mjs | tar -x -C \"\$sync_dir\"; cd \"\$sync_dir\"; node scripts/fetch-wechat-rss.mjs" \
            > /tmp/wechat-rss.xml
          test -s /tmp/wechat-rss.xml

      - name: Import verified recent articles
        env:
          WECHAT_RSS_FILE: /tmp/wechat-rss.xml
          WECHAT_AUTO_PUBLISH: 'true'
          WECHAT_IMPORT_DAYS: '31'
          WECHAT_MAX_IMPORTS: '12'
          WECHAT_EXPECTED_BIZ: 'MzIxMjY3NzMwNw=='
        run: npm run sync:wechat

      - name: Verify imported content
        run: |
          npm run lint
          npm run build

      - name: Merge verified sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain -- content/posts)" ]]; then
            echo "没有新文章。"
            exit 0
          fi
          branch="codex/wechat-sync-${GITHUB_RUN_ID}"
          git config user.name "ai-knowledgepoints-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/posts
          git commit -m "同步公众号最近文章"
          git push origin "$branch"
          source scripts/lib/github-pr-recovery.sh
          pr_number="$(github_create_or_find_pr main "$branch" "同步公众号最近文章" "自动同步本人公众号最近 31 天已经公开的文章。来源账号、时间范围、篇数、正文长度、lint 与生产构建均已校验。")"
          merge_sha="$(github_merge_and_resolve_sha "$pr_number" "同步公众号最近文章 (#${pr_number})")"
          gh workflow run deploy.yml --ref main
          deployed=false
          for _ in {1..30}; do
            health="$(curl --fail --silent --show-error --max-time 15 https://ai-knowledgepoints.cn/api/health || true)"
            if [[ "$health" == *"\"commit\":\"$merge_sha\""* ]]; then
              deployed=true
              break
            fi
            sleep 20
          done
          if [[ "$deployed" != true ]]; then
            echo "网站在等待时间内没有部署到 $merge_sha。" >&2
            exit 1
          fi
