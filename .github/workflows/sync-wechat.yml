name: Sync WeChat articles

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure ECS SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect and fetch private WeChat RSS from ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
        run: |
          ssh -i ~/.ssh/ecs_deploy_key -p "${ECS_PORT:-22}" "$ECS_USER@$ECS_HOST" \
            "cd /root/self-web-host && git fetch origin '$GITHUB_SHA' && git show '$GITHUB_SHA:scripts/fetch-wechat-rss.mjs' | node --input-type=module" \
            > /tmp/wechat-rss.xml
          test -s /tmp/wechat-rss.xml

      - name: Import new articles as drafts
        env:
          WECHAT_RSS_FILE: /tmp/wechat-rss.xml
          WECHAT_AUTO_PUBLISH: 'false'
        run: npm run sync:wechat

      - name: Build imported content
        run: npm run build

      - name: Open review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/posts; then
            echo "没有新文章。"
            exit 0
          fi
          branch="codex/wechat-sync-${GITHUB_RUN_ID}"
          git config user.name "ai-knowledgepoints-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/posts
          git commit -m "同步公众号文章草稿"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "同步公众号文章草稿" --body "每日公众号同步生成的待审核草稿。审核正文与元数据后即可合并发布。"
